name: Generate and Upload Documentation
description: Build documentation (does not upload the artifact).
author: David C. Manuelda
branding:
  icon: 'help-circle'
  color: 'white'

inputs:
  doc_target:
    description: "CMake target to build documentation"
    required: true

  docs_source_dir:
    description: "Directory containing documentation source"
    required: false
    default: "./docs"

  extra-cmake-options:
    description: "Additional CMake configuration options"
    required: false
    default: ""

  extra-install:
    description: "Space-separated list of extra packages to install"
    required: false
    default: ""

runs:
  using: composite
  steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install toolchain
      uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
      with:
        toolchain: clang
        docs: true

    - name: Prepare cache key for extra packages
      if: ${{ inputs.extra-install != '' }}
      id: cachekey
      shell: bash
      run: |
        san=$(printf '%s' "${{ inputs.extra-install }}" | tr -d ' ')
        echo "cache_key=extra-apt-packages-${san}" >> "$GITHUB_OUTPUT"

    - name: Install extra packages
      if: ${{ inputs.extra-install != '' }}
      uses: stormbytepp/githubactions/.github/actions/install-cached@master
      with:
        packages: ${{ inputs.extra-install }}
        cache-key: ${{ steps.cachekey.outputs.cache_key }}

    - name: Build with CMake
      uses: ashutoshvarma/action-cmake-build@master
      with:
        build-dir: ${{ github.workspace }}/build
        cc: /usr/bin/clang
        cxx: /usr/bin/clang++
        configure-options: >-
          -G Ninja
          ${{ inputs.extra-cmake-options }}
        build-type: Release
        target: ${{ inputs.doc_target }}

    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ${{ inputs.docs_source_dir }}
        destination: ./_site