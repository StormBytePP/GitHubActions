name: Generate and Upload Documentation
description: Build documentation (does not upload the artifact).
author: David C. Manuelda
branding:
  icon: 'help-circle'
  color: 'white'

inputs:
  doc_target:
    description: "CMake target to build documentation"
    required: true

  docs_source_dir:
    description: "Directory containing documentation source"
    required: false
    default: "./docs"

  extra-cmake-options:
    description: "Additional CMake configuration options"
    required: false
    default: ""

  extra-install:
    description: "Space-separated list of extra packages to install"
    required: false
    default: ""

runs:
  using: composite
  steps:

    - name: Checkout repository
      uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install toolchain
      id: toolchain
      uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
      with:
        toolchain: clang
        docs: true

    - name: Install extra packages
      if: ${{ inputs.extra-install != '' }}
      uses: stormbytepp/githubactions/.github/actions/install-cached@master
      with:
        packages: ${{ inputs.extra-install }}
        cache-key: apt-doc-extra-v1
        unique: false

    - name: Configure CMake
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXTRA_CMAKE_OPTIONS: ${{ inputs.extra-cmake-options }}
      run: |
        set -euo pipefail
        source "$ACTION_PATH/../build-with-toolchain/configure-common.sh"
        parse_action_arguments "$EXTRA_CMAKE_OPTIONS" "extra-cmake-options"
        cmake -S . -B "${{ github.workspace }}/build" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER="${{ steps.toolchain.outputs.c_compiler }}" \
          -DCMAKE_CXX_COMPILER="${{ steps.toolchain.outputs.cxx_compiler }}" \
          ${PARSED_ARGS[@]+"${PARSED_ARGS[@]}"}

    - name: Build documentation target
      shell: bash
      run: |
        set -euo pipefail
        jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
        cmake --build "${{ github.workspace }}/build" \
          --target "${{ inputs.doc_target }}" \
          --parallel "$jobs"

    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ${{ inputs.docs_source_dir }}
        destination: ./_site