name: "Cache and Setup Compiler Toolchain"
description: "Install and cache compiler toolchains (Linux/macOS: gcc/clang, Windows: MSVC + BuildCache)"
author: "David C. Manuelda"
branding:
  icon: "settings"
  color: "green"

inputs:
  toolchain:
    description: 'gcc, clang, clang-libc++ (Linux/macOS) or msvc (Windows)'
    required: true
  docs:
    description: 'Install documentation tools (doxygen + graphviz). Linux & macOS only'
    default: 'false'
  version:
    description: 'Optional major version for gcc/clang (default: 14 for gcc, 20 for clang)'
    default: ''
  ccache-key:
    description: 'Base cache key for ccache (Linux/macOS) / buildcache (Windows). Empty = disabled'
    default: ''
  install-meson:
    description: 'Install Meson 1.10.2 via pip (default: true)'
    default: 'true'

outputs:
  c_compiler:
    value: ${{ steps.set-outputs.outputs.c_compiler }}
  cxx_compiler:
    value: ${{ steps.set-outputs.outputs.cxx_compiler }}
  buildcache_bin:
    value: ${{ steps.buildcache.outputs.buildcache_bin }}
  buildcache_wrapper:
    value: ${{ steps.buildcache.outputs.buildcache_wrapper }}
  buildcache_dir:
    value: ${{ steps.buildcache.outputs.buildcache_dir }}

runs:
  using: "composite"
  steps:

    ###########################################################################
    # 0. COMMON SETUP + VERSION RESOLUTION
    ###########################################################################
    - name: Resolve versions and validate toolchain
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        TOOLCHAIN="${{ inputs.toolchain }}"
        VER="${{ inputs.version }}"
        OS="${{ runner.os }}"

        case "$TOOLCHAIN" in
          gcc)
            echo "GCC_VERSION=${VER:-14}" >> $GITHUB_ENV
            echo "CLANG_VERSION=20" >> $GITHUB_ENV
            echo "TOOLCHAIN_VERSION=${VER:-14}" >> $GITHUB_ENV
            ;;
          clang|clang-libc++)
            echo "CLANG_VERSION=${VER:-20}" >> $GITHUB_ENV
            echo "GCC_VERSION=14" >> $GITHUB_ENV
            echo "TOOLCHAIN_VERSION=${VER:-20}" >> $GITHUB_ENV
            ;;
          msvc)
            if [[ "$OS" != "Windows" ]]; then
              echo "::error::msvc is only supported on Windows"
              exit 1
            fi
            echo "TOOLCHAIN_VERSION=msvc" >> $GITHUB_ENV
            ;;
          *)
            echo "::error::Unsupported toolchain: $TOOLCHAIN"
            exit 1
            ;;
        esac

        echo "Resolved toolchain=$TOOLCHAIN version=${TOOLCHAIN_VERSION:-} on $OS"

    ###########################################################################
    # 1. LINUX – PACKAGES + TOOLCHAIN
    ###########################################################################
    - name: Install common Linux packages + toolchain
      if: runner.os == 'Linux'
      uses: stormbytepp/githubactions/.github/actions/install-cached@master
      with:
        packages: >-
          ninja-build
          build-essential
          cmake
          ${{ inputs.toolchain == 'gcc' && format('gcc-{0} g++-{0}', env.GCC_VERSION) || '' }}
          ${{ (inputs.toolchain == 'clang' || inputs.toolchain == 'clang-libc++') && format('clang-{0} clang++-{0}', env.CLANG_VERSION) || '' }}
          ${{ inputs.toolchain == 'clang-libc++' && format('libc++-{0}-dev libc++abi-{0}-dev', env.CLANG_VERSION) || '' }}
          ${{ inputs.ccache-key != '' && 'ccache' || '' }}
          ${{ inputs.docs == 'true' && 'doxygen graphviz' || '' }}
        cache-key: apt-toolchain-${{ inputs.toolchain }}-${{ env.TOOLCHAIN_VERSION }}-v1
        unique: true

    - name: Register compiler alternatives (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [[ "${{ inputs.toolchain }}" == "gcc" ]]; then
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 140
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 140
        else
          sudo update-alternatives --remove-all clang  || true
          sudo update-alternatives --remove-all clang++ || true
          sudo update-alternatives --install /usr/bin/clang  clang  /usr/bin/clang-${{ env.CLANG_VERSION }}  200 \
            --slave /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.CLANG_VERSION }}
        fi

    ###########################################################################
    # 2. macOS – PACKAGES + TOOLCHAIN (Homebrew)
    ###########################################################################
    - name: Install packages + toolchain (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        echo "Installing base tools with Homebrew..."
        brew install ninja cmake

        if [[ "${{ inputs.toolchain }}" == "gcc" ]]; then
          echo "Installing GCC ${{ env.GCC_VERSION }}..."
          brew install gcc@${{ env.GCC_VERSION }}
        else
          echo "Installing LLVM/Clang ${{ env.CLANG_VERSION }}..."
          brew install llvm@${{ env.CLANG_VERSION }} || brew install llvm
        fi

        if [[ "${{ inputs.ccache-key }}" != "" ]]; then
          brew install ccache
        fi

        if [[ "${{ inputs.docs }}" == "true" ]]; then
          brew install doxygen graphviz
        fi

        if [[ "${{ inputs.toolchain }}" == "gcc" ]]; then
          echo "$(brew --prefix gcc@${{ env.GCC_VERSION }})/bin" >> $GITHUB_PATH
        else
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
        fi

    ###########################################################################
    # 3. MESON (optional)
    ###########################################################################
    - name: Setup Python + Meson
      if: inputs.install-meson == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Meson 1.10.2
      if: inputs.install-meson == 'true'
      shell: bash
      run: |
        pip install --quiet meson==1.10.2
        meson --version

    ###########################################################################
    # 4. CCACHE (Linux + macOS)
    ###########################################################################
    - name: Configure ccache
      if: (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      shell: bash
      run: |
        mkdir -p "$HOME/.ccache"
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV

        if [ -d /usr/lib/ccache ]; then
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        elif [ -d /usr/lib64/ccache ]; then
          echo "PATH=/usr/lib64/ccache:$PATH" >> $GITHUB_ENV
        elif command -v ccache >/dev/null; then
          CCACHE_PATH="$(dirname $(which ccache))"
          echo "PATH=$CCACHE_PATH:$PATH" >> $GITHUB_ENV
        fi

        SANITIZED=$(echo "${{ inputs.ccache-key }}" | tr ' /' '-' | sed 's/[^A-Za-z0-9._+-]/-/g')
        BASE_KEY="ccache-${{ runner.os }}-${{ inputs.toolchain }}-${{ env.TOOLCHAIN_VERSION }}-${SANITIZED}"
        echo "CCACHE_BASE_KEY=$BASE_KEY" >> $GITHUB_ENV
        echo "CCACHE_SAVE_KEY=${BASE_KEY}-${{ github.run_id }}" >> $GITHUB_ENV

        ccache -M 2G || true
        ccache -z || true

    - name: Restore ccache
      if: (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.CCACHE_BASE_KEY }}
        restore-keys: |
          ${{ env.CCACHE_BASE_KEY }}-

    ###########################################################################
    # 5. WINDOWS – MSVC + BUILDCACHE (LAUNCHER METHOD)
    ###########################################################################
    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install & configure BuildCache
      if: runner.os == 'Windows' && inputs.ccache-key != ''
      id: buildcache
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $version = "0.31.5"
        $extractDir = "$env:RUNNER_TEMP\buildcache"
        $zipUrl = "https://gitlab.com/bits-n-bites/buildcache/-/releases/v$version/downloads/buildcache-windows.zip"
        $zipPath = "$env:RUNNER_TEMP\buildcache.zip"

        if (-not (Test-Path "$extractDir\buildcache\bin\buildcache.exe")) {
          Write-Host "Downloading BuildCache $version..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
        }

        $bcExe = (Resolve-Path "$extractDir\buildcache\bin\buildcache.exe").Path
        "buildcache_bin=$bcExe" | Out-File $env:GITHUB_OUTPUT -Append

        # Cache directory
        $cacheDir = "$env:LOCALAPPDATA\buildcache"
        New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
        "BUILDCACHE_DIR=$cacheDir" | Out-File $env:GITHUB_ENV -Append
        "buildcache_dir=$cacheDir" | Out-File $env:GITHUB_OUTPUT -Append

        # Keys
        $sanitized = "${{ inputs.ccache-key }}" -replace '[^A-Za-z0-9._+-]', '-'
        $baseKey = "buildcache-msvc-$sanitized"
        $saveKey = "$baseKey-${{ github.run_id }}"
        "BUILDCACHE_BASE_KEY=$baseKey" | Out-File $env:GITHUB_ENV -Append
        "BUILDCACHE_SAVE_KEY=$saveKey" | Out-File $env:GITHUB_ENV -Append

        # === CLEAN METHOD: use only CMake compiler launchers ===
        # Do NOT put a fake cl.exe in PATH
        "CMAKE_C_COMPILER_LAUNCHER=$bcExe" | Out-File $env:GITHUB_ENV -Append
        "CMAKE_CXX_COMPILER_LAUNCHER=$bcExe" | Out-File $env:GITHUB_ENV -Append

        # Keep the real compilers from msvc-dev-cmd
        "CMAKE_C_COMPILER=cl" | Out-File $env:GITHUB_ENV -Append
        "CMAKE_CXX_COMPILER=cl" | Out-File $env:GITHUB_ENV -Append
        "CC=cl" | Out-File $env:GITHUB_ENV -Append
        "CXX=cl" | Out-File $env:GITHUB_ENV -Append

        # Optional but recommended
        "BUILDCACHE_DIR=$cacheDir" | Out-File $env:GITHUB_ENV -Append

        Write-Host "=== BuildCache configured (launcher method) ==="
        Write-Host "BuildCache: $bcExe"
        Write-Host "Cache dir:  $cacheDir"

    - name: Restore BuildCache
      if: runner.os == 'Windows' && inputs.ccache-key != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.BUILDCACHE_DIR }}
        key: ${{ env.BUILDCACHE_BASE_KEY }}
        restore-keys: |
          ${{ env.BUILDCACHE_BASE_KEY }}-

    ###########################################################################
    # 6. OUTPUTS
    ###########################################################################
    - name: Set compiler outputs
      id: set-outputs
      shell: bash
      run: |
        TOOL="${{ inputs.toolchain }}"
        OS="${{ runner.os }}"

        if [[ "$OS" == "Windows" ]]; then
          C_COMPILER="cl"
          CXX_COMPILER="cl"
        else
          case "$TOOL" in
            gcc)
              C_COMPILER="gcc"
              CXX_COMPILER="g++"
              ;;
            clang|clang-libc++)
              C_COMPILER="clang"
              CXX_COMPILER="clang++"
              ;;
          esac
        fi

        echo "c_compiler=$C_COMPILER" >> $GITHUB_OUTPUT
        echo "cxx_compiler=$CXX_COMPILER" >> $GITHUB_OUTPUT

        # Only set CC/CXX if they are not already defined by ccache/buildcache
        if [[ -z "${CC:-}" ]]; then
          echo "CC=$C_COMPILER" >> $GITHUB_ENV
        fi
        if [[ -z "${CXX:-}" ]]; then
          echo "CXX=$CXX_COMPILER" >> $GITHUB_ENV
        fi

        echo "Final compilers → CC=${CC:-$C_COMPILER}  CXX=${CXX:-$CXX_COMPILER}"

    ###########################################################################
    # 7. SAVE CACHES
    ###########################################################################
    - name: Save ccache
      if: success() && (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.CCACHE_SAVE_KEY }}

    - name: Save BuildCache
      if: success() && runner.os == 'Windows' && inputs.ccache-key != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.BUILDCACHE_DIR }}
        key: ${{ env.BUILDCACHE_SAVE_KEY }}