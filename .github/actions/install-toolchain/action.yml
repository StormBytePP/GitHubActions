name: "Install Compiler Toolchain"
description: "Install compiler toolchains and build tools (no cache/build configuration)"
author: "David C. Manuelda"
branding:
  icon: "settings"
  color: "green"

inputs:
  toolchain:
    description: "gcc, clang, clang-libc++ (Linux/macOS); msvc or clang-cl (Windows)"
    required: true
  docs:
    description: "Install documentation tools (doxygen + graphviz). Linux & macOS only"
    default: "false"
  version:
    description: "Optional major version for gcc/clang (default: 14 for gcc, 20 for clang). Ignored for Apple Clang on macOS and for msvc/clang-cl."
    default: ""
  ccache-key:
    description: "Non-empty also installs ccache (Linux/macOS) or sccache (Windows). Empty = skip"
    default: ""
  install-meson:
    description: "Install Meson via pip (default: true). Pinned to 1.10.0 on Windows only; latest on Linux/macOS"
    default: "true"

outputs:
  c_compiler:
    value: ${{ steps.set-outputs.outputs.c_compiler }}
  cxx_compiler:
    value: ${{ steps.set-outputs.outputs.cxx_compiler }}
  sccache_bin:
    value: ${{ steps.sccache.outputs.sccache_bin }}

runs:
  using: "composite"
  steps:

    ###########################################################################
    # 0. VERSION RESOLUTION
    ###########################################################################
    - name: Resolve versions and validate toolchain
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🔍 Resolving versions and validating toolchain"
        echo "────────────────────────────────────────────────────────"

        TOOLCHAIN="${{ inputs.toolchain }}"
        VER="${{ inputs.version }}"
        OS="${{ runner.os }}"

        case "$TOOLCHAIN" in
          gcc)
            echo "GCC_VERSION=${VER:-14}" >> "$GITHUB_ENV"
            echo "CLANG_VERSION=20" >> "$GITHUB_ENV"
            echo "TOOLCHAIN_VERSION=${VER:-14}" >> "$GITHUB_ENV"
            ;;
          clang|clang-libc++)
            echo "CLANG_VERSION=${VER:-20}" >> "$GITHUB_ENV"
            echo "GCC_VERSION=14" >> "$GITHUB_ENV"
            echo "TOOLCHAIN_VERSION=${VER:-20}" >> "$GITHUB_ENV"
            ;;
          msvc|clang-cl)
            if [[ "$OS" != "Windows" ]]; then
              echo "::error::${TOOLCHAIN} is only supported on Windows"
              exit 1
            fi
            echo "TOOLCHAIN_VERSION=${TOOLCHAIN}" >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error::Unsupported toolchain: $TOOLCHAIN"
            exit 1
            ;;
        esac

        echo "✅ Resolved toolchain=$TOOLCHAIN on $OS (version=${VER:-default})"

    ###########################################################################
    # 1. LINUX (via install-cached)
    ###########################################################################
    - name: Install Linux packages + toolchain
      if: runner.os == 'Linux'
      uses: stormbytepp/githubactions/.github/actions/install-cached@master
      with:
        packages: >-
          ninja-build
          build-essential
          cmake
          ${{ inputs.toolchain == 'gcc' && format('gcc-{0} g++-{0}', env.GCC_VERSION) || '' }}
          ${{ (inputs.toolchain == 'clang' || inputs.toolchain == 'clang-libc++') && format('clang-{0} clang++-{0} lld-{0} llvm-{0}', env.CLANG_VERSION) || '' }}
          ${{ inputs.toolchain == 'clang-libc++' && format('libc++-{0}-dev libc++abi-{0}-dev', env.CLANG_VERSION) || '' }}
          ${{ inputs.ccache-key != '' && 'ccache' || '' }}
          ${{ inputs.docs == 'true' && 'doxygen graphviz' || '' }}
        cache-key: apt-toolchain-${{ inputs.toolchain }}-${{ env.TOOLCHAIN_VERSION }}-v2
        unique: true

    - name: Register compiler alternatives (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🔧 Registering compiler alternatives (Linux)"
        echo "────────────────────────────────────────────────────────"

        if [[ "${{ inputs.toolchain }}" == "gcc" ]]; then
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 140
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 140
          echo "✅ Registered gcc/g++ ${{ env.GCC_VERSION }}"
        else
          sudo update-alternatives --remove-all clang  || true
          sudo update-alternatives --remove-all clang++ || true
          sudo update-alternatives --install /usr/bin/clang  clang  /usr/bin/clang-${{ env.CLANG_VERSION }}  200 \
            --slave /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.CLANG_VERSION }}

          sudo update-alternatives --remove-all lld || true
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-${{ env.CLANG_VERSION }} 200
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-${{ env.CLANG_VERSION }} 200
          echo "✅ Registered clang/clang++/lld ${{ env.CLANG_VERSION }}"
        fi

    ###########################################################################
    # 2. macOS
    ###########################################################################
    - name: Install macOS packages
      if: runner.os == 'macOS'
      uses: stormbytepp/githubactions/.github/actions/install-cached@master
      with:
        packages: >-
          ninja
          cmake
          ${{ inputs.toolchain == 'gcc' && format('gcc@{0}', env.GCC_VERSION) || '' }}
          ${{ inputs.ccache-key != '' && 'ccache' || '' }}
          ${{ inputs.docs == 'true' && 'doxygen graphviz' || '' }}

    - name: Configure macOS compiler PATH
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🍎 Configuring macOS compiler PATH"
        echo "────────────────────────────────────────────────────────"

        if [[ "${{ inputs.toolchain }}" == "gcc" ]]; then
          PREFIX="$(brew --prefix "gcc@${{ env.GCC_VERSION }}")"
          echo "${PREFIX}/bin" >> "$GITHUB_PATH"
          echo "PATH += ${PREFIX}/bin (Homebrew gcc)"
          command -v gcc >/dev/null
          echo "✅ gcc: $(command -v gcc)"
        else
          echo "Using Apple Clang (Xcode); skipping Homebrew llvm"
          command -v clang >/dev/null
          command -v clang++ >/dev/null
          echo "✅ clang:  $(command -v clang)"
          echo "✅ clang++: $(command -v clang++)"
          clang --version | head -n 2 || true
        fi

    ###########################################################################
    # 3. MESON (pip)
    ###########################################################################
    - name: Setup Python
      if: inputs.install-meson == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install Meson (pip)
      if: inputs.install-meson == 'true'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🐍 Installing Meson via pip"
        echo "────────────────────────────────────────────────────────"

        PY=""
        for c in python3 python; do
          if command -v "$c" >/dev/null 2>&1; then
            PY="$c"
            break
          fi
        done
        if [ -z "$PY" ]; then
          echo "❌ python not found after setup-python"
          exit 1
        fi

        echo "Python: $($PY -c 'import sys; print(sys.executable)')"
        $PY -m pip install --upgrade pip
        $PY -m pip uninstall -y meson 2>/dev/null || true

        if [[ "${{ runner.os }}" == "Windows" ]]; then
          MESON_SPEC='meson==1.10.0'
          EXPECTED='1.10.0*'
        else
          MESON_SPEC='meson'
          EXPECTED=''
        fi

        $PY -m pip install --force-reinstall --no-cache-dir "$MESON_SPEC"

        SCRIPTS="$($PY -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
        if [ -n "$SCRIPTS" ] && [ -d "$SCRIPTS" ]; then
          echo "$SCRIPTS" >> "$GITHUB_PATH"
          export PATH="$SCRIPTS:$PATH"
        fi

        VER="$(meson --version 2>/dev/null | head -n1 | tr -d '\r' || true)"
        echo "meson on PATH: $(command -v meson || echo none)"
        echo "meson --version: ${VER:-unknown}"

        if [[ -n "$EXPECTED" ]]; then
          case "$VER" in
            $EXPECTED) ;;
            *)
              echo "❌ Expected Meson 1.10.0 from pip, got: ${VER:-missing}"
              exit 1
              ;;
          esac
        fi

        echo "✅ Meson installed successfully"

    ###########################################################################
    # 4. WINDOWS – MSVC env (+ clang-cl / LLVM LTO tools if requested) + sccache
    ###########################################################################
    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Ensure clang-cl + LLVM LTO tools are available
      if: runner.os == 'Windows' && inputs.toolchain == 'clang-cl'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "🔍 Ensuring clang-cl + LTO tools (lld-link, llvm-lib, llvm-ar)"
        Write-Host "────────────────────────────────────────────────────────"

        function Find-Tool([string]$Name) {
          $cmd = Get-Command $Name -ErrorAction SilentlyContinue
          if ($cmd) { return $cmd.Source }

          $candidates = [System.Collections.Generic.List[string]]::new()
          foreach ($base in @(
            "${env:ProgramFiles}\LLVM\bin",
            "${env:ProgramFiles(x86)}\LLVM\bin",
            "${env:VCINSTALLDIR}Tools\Llvm\x64\bin",
            "${env:VCINSTALLDIR}Tools\Llvm\bin"
          )) {
            if ($base) { $candidates.Add((Join-Path $base $Name)) }
          }

          $vsRoots = @(
            "${env:ProgramFiles}\Microsoft Visual Studio",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
          )
          foreach ($root in $vsRoots) {
            if (-not (Test-Path $root)) { continue }
            Get-ChildItem -Path $root -Recurse -Filter $Name -ErrorAction SilentlyContinue |
              Select-Object -First 5 |
              ForEach-Object { $candidates.Add($_.FullName) }
          }

          foreach ($p in $candidates) {
            if ($p -and (Test-Path $p)) { return $p }
          }
          return $null
        }

        function Require-Tool([string]$Name) {
          $path = Find-Tool $Name
          if (-not $path) {
            Write-Error "$Name not found after LLVM install/search"
            exit 1
          }
          Write-Host "$Name : $path"
          return $path
        }

        $clangCl = Find-Tool "clang-cl.exe"
        $needInstall = -not $clangCl

        if (-not $needInstall) {
          # Same install must also provide LTO helpers (static libs + link)
          foreach ($t in @("lld-link.exe", "llvm-lib.exe", "llvm-ar.exe")) {
            if (-not (Find-Tool $t)) {
              Write-Host "Missing $t next to existing clang-cl; will (re)install LLVM package"
              $needInstall = $true
              break
            }
          }
        }

        if ($needInstall) {
          Write-Host "Installing full LLVM via Chocolatey (clang-cl, lld-link, llvm-lib, llvm-ar)..."
          choco install llvm -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to install LLVM"
            exit 1
          }
        }

        $clangCl = Require-Tool "clang-cl.exe"
        $lldLink = Require-Tool "lld-link.exe"
        $llvmLib = Require-Tool "llvm-lib.exe"
        $llvmAr  = Require-Tool "llvm-ar.exe"
        # Optional but useful for IPO static archives
        $llvmRanlib = Find-Tool "llvm-ranlib.exe"
        if ($llvmRanlib) { Write-Host "llvm-ranlib.exe : $llvmRanlib" }

        $binDir = Split-Path -Parent $clangCl
        $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:Path = "$binDir;$env:Path"

        # Prefer LLVM bin over any other shadow for these tools
        foreach ($extra in @($lldLink, $llvmLib, $llvmAr)) {
          $d = Split-Path -Parent $extra
          if ($d -and ($d -ne $binDir)) {
            $d | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$d;$env:Path"
          }
        }

        Write-Host ""
        & $clangCl --version
        Write-Host ""
        & $lldLink --version 2>&1 | Select-Object -First 2
        Write-Host ""
        Write-Host "✅ clang-cl + lld-link + llvm-lib + llvm-ar ready (IPO/static libs OK)"

    - name: Install sccache binary
      if: runner.os == 'Windows' && inputs.ccache-key != ''
      id: sccache
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "📦 Installing sccache binary (Windows)"
        Write-Host "────────────────────────────────────────────────────────"

        $version = "0.10.0"
        $extractDir = "$env:RUNNER_TEMP\sccache"
        $zipName = "sccache-v$version-x86_64-pc-windows-msvc"
        $zipUrl = "https://github.com/mozilla/sccache/releases/download/v$version/$zipName.zip"
        $zipPath = "$env:RUNNER_TEMP\sccache.zip"

        if (-not (Test-Path "$extractDir\$zipName\sccache.exe")) {
          Write-Host "Downloading sccache $version..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
        }

        $sccacheExe = (Resolve-Path "$extractDir\$zipName\sccache.exe").Path
        "sccache_bin=$sccacheExe" | Out-File $env:GITHUB_OUTPUT -Append

        $sccacheDir = Split-Path $sccacheExe
        echo $sccacheDir | Out-File $env:GITHUB_PATH -Append

        Write-Host "sccache installed: $sccacheExe"
        & $sccacheExe --version

        Write-Host "✅ sccache ready"

    ###########################################################################
    # 5. OUTPUTS
    ###########################################################################
    - name: Set compiler outputs
      id: set-outputs
      shell: bash
      run: |
        echo "────────────────────────────────────────────────────────"
        echo "📤 Setting compiler outputs"
        echo "────────────────────────────────────────────────────────"

        TOOL="${{ inputs.toolchain }}"
        OS="${{ runner.os }}"

        if [[ "$OS" == "Windows" ]]; then
          case "$TOOL" in
            clang-cl)
              C_COMPILER="clang-cl"
              CXX_COMPILER="clang-cl"
              ;;
            *)
              C_COMPILER="cl"
              CXX_COMPILER="cl"
              ;;
          esac
        else
          case "$TOOL" in
            gcc)
              C_COMPILER="gcc"
              CXX_COMPILER="g++"
              ;;
            clang|clang-libc++)
              C_COMPILER="clang"
              CXX_COMPILER="clang++"
              ;;
          esac
        fi

        echo "c_compiler=$C_COMPILER" >> "$GITHUB_OUTPUT"
        echo "cxx_compiler=$CXX_COMPILER" >> "$GITHUB_OUTPUT"
        echo "✅ Final compilers → CC=$C_COMPILER  CXX=$CXX_COMPILER"