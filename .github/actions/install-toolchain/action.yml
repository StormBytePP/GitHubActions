name: "Cache and Setup Compiler Toolchain"
description: "Install and cache compiler toolchains (Linux/macOS: gcc/clang + ccache, Windows: MSVC + sccache)"
author: "David C. Manuelda"
branding:
  icon: "settings"
  color: "green"

inputs:
  toolchain:
    description: "gcc, clang, clang-libc++ (Linux/macOS) or msvc (Windows)"
    required: true
  docs:
    description: "Install documentation tools (doxygen + graphviz). Linux & macOS only"
    default: "false"
  version:
    description: "Optional major version for gcc/clang (default: 14 for gcc, 20 for clang)"
    default: ""
  ccache-key:
    description: "Base cache key for ccache (Linux/macOS) / sccache (Windows). Empty = disabled"
    default: ""
  install-meson:
    description: "Install Meson 1.10.2 via pip (default: true)"
    default: "true"

outputs:
  c_compiler:
    value: ${{ steps.set-outputs.outputs.c_compiler }}
  cxx_compiler:
    value: ${{ steps.set-outputs.outputs.cxx_compiler }}
  sccache_bin:
    value: ${{ steps.sccache.outputs.sccache_bin }}
  sccache_dir:
    value: ${{ steps.sccache.outputs.sccache_dir }}

runs:
  using: "composite"
  steps:

    ###########################################################################
    # 0. COMMON SETUP + VERSION RESOLUTION
    ###########################################################################
    - name: Resolve versions and validate toolchain
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        TOOLCHAIN="${{ inputs.toolchain }}"
        VER="${{ inputs.version }}"
        OS="${{ runner.os }}"

        case "$TOOLCHAIN" in
          gcc)
            echo "GCC_VERSION=${VER:-14}" >> "$GITHUB_ENV"
            echo "CLANG_VERSION=20" >> "$GITHUB_ENV"
            echo "TOOLCHAIN_VERSION=${VER:-14}" >> "$GITHUB_ENV"
            ;;
          clang|clang-libc++)
            echo "CLANG_VERSION=${VER:-20}" >> "$GITHUB_ENV"
            echo "GCC_VERSION=14" >> "$GITHUB_ENV"
            echo "TOOLCHAIN_VERSION=${VER:-20}" >> "$GITHUB_ENV"
            ;;
          msvc)
            if [[ "$OS" != "Windows" ]]; then
              echo "::error::msvc is only supported on Windows"
              exit 1
            fi
            echo "TOOLCHAIN_VERSION=msvc" >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error::Unsupported toolchain: $TOOLCHAIN"
            exit 1
            ;;
        esac

        echo "Resolved toolchain=$TOOLCHAIN on $OS"

    ###########################################################################
    # 1. LINUX – PACKAGES + TOOLCHAIN
    ###########################################################################
    - name: Install common Linux packages + toolchain
      if: runner.os == 'Linux'
      uses: stormbytepp/githubactions/.github/actions/install-cached@master
      with:
        packages: >-
          ninja-build
          build-essential
          cmake
          ${{ inputs.toolchain == 'gcc' && format('gcc-{0} g++-{0}', env.GCC_VERSION) || '' }}
          ${{ (inputs.toolchain == 'clang' || inputs.toolchain == 'clang-libc++') && format('clang-{0} clang++-{0}', env.CLANG_VERSION) || '' }}
          ${{ inputs.toolchain == 'clang-libc++' && format('libc++-{0}-dev libc++abi-{0}-dev', env.CLANG_VERSION) || '' }}
          ${{ inputs.ccache-key != '' && 'ccache' || '' }}
          ${{ inputs.docs == 'true' && 'doxygen graphviz' || '' }}
        cache-key: apt-toolchain-${{ inputs.toolchain }}-${{ env.TOOLCHAIN_VERSION }}-v1
        unique: true

    - name: Register compiler alternatives (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [[ "${{ inputs.toolchain }}" == "gcc" ]]; then
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 140
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 140
        else
          sudo update-alternatives --remove-all clang  || true
          sudo update-alternatives --remove-all clang++ || true
          sudo update-alternatives --install /usr/bin/clang  clang  /usr/bin/clang-${{ env.CLANG_VERSION }}  200 \
            --slave /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.CLANG_VERSION }}
        fi

    ###########################################################################
    # 2. macOS – PACKAGES + TOOLCHAIN (Homebrew)
    ###########################################################################
    - name: Install packages + toolchain (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        echo "Installing base tools with Homebrew..."
        brew install ninja cmake

        if [[ "${{ inputs.toolchain }}" == "gcc" ]]; then
          echo "Installing GCC ${{ env.GCC_VERSION }}..."
          brew install gcc@${{ env.GCC_VERSION }}
        else
          echo "Installing LLVM/Clang ${{ env.CLANG_VERSION }}..."
          brew install llvm@${{ env.CLANG_VERSION }} || brew install llvm
        fi

        if [[ "${{ inputs.ccache-key }}" != "" ]]; then
          brew install ccache
        fi

        if [[ "${{ inputs.docs }}" == "true" ]]; then
          brew install doxygen graphviz
        fi

        if [[ "${{ inputs.toolchain }}" == "gcc" ]]; then
          echo "$(brew --prefix gcc@${{ env.GCC_VERSION }})/bin" >> "$GITHUB_PATH"
        else
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
        fi

    ###########################################################################
    # 3. MESON (pip only — never Chocolatey; pin 1.10.2 for MSVC has_function)
    ###########################################################################
    # See: https://github.com/mesonbuild/meson/issues/16086
    - name: Setup Python
      if: inputs.install-meson == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install Meson 1.10.2 (pip only)
      if: inputs.install-meson == 'true'
      shell: bash
      run: |
        set -euo pipefail

        PY=""
        for c in python3 python; do
          if command -v "$c" >/dev/null 2>&1; then
            PY="$c"
            break
          fi
        done
        if [ -z "$PY" ]; then
          echo "python not found after setup-python"
          exit 1
        fi

        echo "Python: $($PY -c 'import sys; print(sys.executable)')"
        $PY -m pip install --upgrade pip
        $PY -m pip uninstall -y meson 2>/dev/null || true
        $PY -m pip install --force-reinstall --no-cache-dir 'meson==1.10.2'

        SCRIPTS="$($PY -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
        if [ -n "$SCRIPTS" ] && [ -d "$SCRIPTS" ]; then
          # GITHUB_PATH entries are prepended for later steps
          echo "$SCRIPTS" >> "$GITHUB_PATH"
          export PATH="$SCRIPTS:$PATH"
        fi

        # If a stray meson exists elsewhere, prefer: python -m mesonbuild.mesonmain
        VER="$(meson --version 2>/dev/null | head -n1 | tr -d '\r' || true)"
        echo "meson on PATH: $(command -v meson || echo none)"
        echo "meson --version: ${VER:-unknown}"

        case "$VER" in
          1.10.2*) ;;
          *)
            echo "Expected Meson 1.10.2 from pip, got: ${VER:-missing}"
            exit 1
            ;;
        esac

    ###########################################################################
    # 4. CCACHE (Linux + macOS)
    ###########################################################################
    - name: Configure ccache
      if: (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      shell: bash
      run: |
        mkdir -p "$HOME/.ccache"
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"

        if [ -d /usr/lib/ccache ]; then
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        elif [ -d /usr/lib64/ccache ]; then
          echo "/usr/lib64/ccache" >> "$GITHUB_PATH"
        fi

        SANITIZED=$(echo "${{ inputs.ccache-key }}" | tr ' /' '-' | sed 's/[^A-Za-z0-9._+-]/-/g')
        BASE_KEY="ccache-${{ runner.os }}-${{ inputs.toolchain }}-${{ env.TOOLCHAIN_VERSION }}-${SANITIZED}"
        echo "CCACHE_BASE_KEY=$BASE_KEY" >> "$GITHUB_ENV"
        echo "CCACHE_SAVE_KEY=${BASE_KEY}-${{ github.run_id }}" >> "$GITHUB_ENV"

        ccache -M 2G || true
        ccache -z || true

    - name: Restore ccache
      if: (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.CCACHE_BASE_KEY }}
        restore-keys: |
          ${{ env.CCACHE_BASE_KEY }}-

    ###########################################################################
    # 5. WINDOWS – MSVC + sccache
    ###########################################################################
    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install & configure sccache
      if: runner.os == 'Windows' && inputs.ccache-key != ''
      id: sccache
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $version = "0.10.0"
        $extractDir = "$env:RUNNER_TEMP\sccache"
        $zipName = "sccache-v$version-x86_64-pc-windows-msvc"
        $zipUrl = "https://github.com/mozilla/sccache/releases/download/v$version/$zipName.zip"
        $zipPath = "$env:RUNNER_TEMP\sccache.zip"

        if (-not (Test-Path "$extractDir\$zipName\sccache.exe")) {
          Write-Host "Downloading sccache $version..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
        }

        $sccacheExe = (Resolve-Path "$extractDir\$zipName\sccache.exe").Path
        "sccache_bin=$sccacheExe" | Out-File $env:GITHUB_OUTPUT -Append

        # Must match the path sccache 0.10 actually uses
        $cacheDir = Join-Path $env:LOCALAPPDATA "Mozilla\sccache\cache"
        New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null

        "SCCACHE_DIR=$cacheDir" | Out-File $env:GITHUB_ENV -Append
        "sccache_dir=$cacheDir" | Out-File $env:GITHUB_OUTPUT -Append

        $sanitized = "${{ inputs.ccache-key }}" -replace '[^A-Za-z0-9._+-]', '-'
        $baseKey = "sccache-msvc-$sanitized"
        $saveKey = "$baseKey-${{ github.run_id }}"
        "SCCACHE_BASE_KEY=$baseKey" | Out-File $env:GITHUB_ENV -Append
        "SCCACHE_SAVE_KEY=$saveKey" | Out-File $env:GITHUB_ENV -Append

        $sccacheDir = Split-Path $sccacheExe
        echo $sccacheDir | Out-File $env:GITHUB_PATH -Append

        "CMAKE_C_COMPILER_LAUNCHER=sccache" | Out-File $env:GITHUB_ENV -Append
        "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File $env:GITHUB_ENV -Append
        "CMAKE_C_COMPILER=cl" | Out-File $env:GITHUB_ENV -Append
        "CMAKE_CXX_COMPILER=cl" | Out-File $env:GITHUB_ENV -Append
        "CC=cl" | Out-File $env:GITHUB_ENV -Append
        "CXX=cl" | Out-File $env:GITHUB_ENV -Append

        & $sccacheExe --start-server
        & $sccacheExe --zero-stats

        Write-Host "=== sccache configured ==="
        Write-Host "sccache:   $sccacheExe"
        Write-Host "Cache dir: $cacheDir"
        Write-Host "Base key:  $baseKey"
        Write-Host "Save key:  $saveKey"
        & $sccacheExe --version
        & $sccacheExe --show-stats

    - name: Restore sccache
      if: runner.os == 'Windows' && inputs.ccache-key != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ env.SCCACHE_BASE_KEY }}
        restore-keys: |
          ${{ env.SCCACHE_BASE_KEY }}-

    ###########################################################################
    # 6. OUTPUTS
    ###########################################################################
    - name: Set compiler outputs
      id: set-outputs
      shell: bash
      run: |
        TOOL="${{ inputs.toolchain }}"
        OS="${{ runner.os }}"

        if [[ "$OS" == "Windows" ]]; then
          C_COMPILER="cl"
          CXX_COMPILER="cl"
        else
          case "$TOOL" in
            gcc)
              C_COMPILER="gcc"
              CXX_COMPILER="g++"
              ;;
            clang|clang-libc++)
              C_COMPILER="clang"
              CXX_COMPILER="clang++"
              ;;
          esac
        fi

        echo "c_compiler=$C_COMPILER" >> "$GITHUB_OUTPUT"
        echo "cxx_compiler=$CXX_COMPILER" >> "$GITHUB_OUTPUT"

        if [[ -z "${CC:-}" ]]; then
          echo "CC=$C_COMPILER" >> "$GITHUB_ENV"
        fi
        if [[ -z "${CXX:-}" ]]; then
          echo "CXX=$CXX_COMPILER" >> "$GITHUB_ENV"
        fi

        echo "Final compilers → CC=${CC:-$C_COMPILER}  CXX=${CXX:-$CXX_COMPILER}"