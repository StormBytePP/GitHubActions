name: "Cache and Install Packages"
description: >
  Install packages with platform-native managers and caching where it matters.
  - Linux: APT with deterministic .deb cache (restore → download-only → install → save)
  - Windows: Chocolatey (+ common tool dirs on PATH)
  - macOS: Homebrew
author: "David C. Manuelda"
branding:
  icon: "hard-drive"
  color: "green"

inputs:
  packages:
    description: "Space-separated list of packages to install"
    required: true

  cache-key:
    description: >
      Cache key prefix (Linux APT .deb cache only). Empty disables caching.
      On Windows/macOS this input is ignored (no package cache implemented there).
    required: false
    default: ""

  unique:
    description: >
      Linux only. If true (default), use cache-key as-is.
      If false, append a hash of the normalized package list to avoid collisions
      when the same prefix is reused with different package sets.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:

    ###########################################################################
    # WINDOWS → Chocolatey
    ###########################################################################
    - name: Install packages with Chocolatey (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $pkgs = "${{ inputs.packages }}".Trim()
        if ([string]::IsNullOrWhiteSpace($pkgs)) {
          Write-Host "No packages requested; skipping"
          exit 0
        }

        Write-Host "Installing packages with Chocolatey: $pkgs"
        choco install ($pkgs -split '\s+' | Where-Object { $_ -ne "" }) -y --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $pathAdds = [System.Collections.Generic.List[string]]::new()
        $pathAdds.Add("C:\ProgramData\chocolatey\bin")

        foreach ($name in ($pkgs -split '\s+')) {
          if ([string]::IsNullOrWhiteSpace($name)) { continue }
          $n = $name.ToLowerInvariant()

          if ($n -eq "nasm") {
            foreach ($d in @(
              "${env:ProgramFiles}\NASM",
              "${env:ProgramFiles(x86)}\NASM"
            )) {
              if (Test-Path (Join-Path $d "nasm.exe")) {
                $pathAdds.Add($d)
                Write-Host "PATH: NASM -> $d"
              }
            }
          }

          if ($n -eq "yasm") {
            foreach ($d in @(
              "${env:ProgramFiles}\yasm",
              "${env:ProgramFiles(x86)}\yasm",
              "C:\ProgramData\chocolatey\lib\yasm\tools"
            )) {
              if ((Test-Path (Join-Path $d "yasm.exe")) -or (Test-Path $d)) {
                $pathAdds.Add($d)
                Write-Host "PATH: yasm candidate -> $d"
              }
            }
          }
        }

        foreach ($d in $pathAdds) {
          if (-not [string]::IsNullOrWhiteSpace($d) -and (Test-Path $d)) {
            Add-Content -Path $env:GITHUB_PATH -Value $d
            $env:Path = "$d;$env:Path"
          }
        }

        if ($pkgs -match '(?i)\bnasm\b') {
          $nasm = Get-Command nasm.exe -ErrorAction SilentlyContinue
          if ($null -eq $nasm) {
            Write-Warning "nasm.exe not found on PATH after install"
          } else {
            Write-Host "nasm OK: $($nasm.Source)"
          }
        }

        if ($pkgs -match '(?i)\byasm\b') {
          $yasm = Get-Command yasm.exe -ErrorAction SilentlyContinue
          if ($null -eq $yasm) {
            Write-Warning "yasm.exe not found on PATH after install"
          } else {
            Write-Host "yasm OK: $($yasm.Source)"
          }
        }

    ###########################################################################
    # macOS → Homebrew
    ###########################################################################
    - name: Install packages with Homebrew (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        PKGS="$(echo "${{ inputs.packages }}" | tr -s '[:space:]' ' ' | sed 's/^ *//;s/ *$//')"
        if [ -z "$PKGS" ]; then
          echo "No packages requested; skipping"
          exit 0
        fi

        echo "Installing packages with Homebrew: $PKGS"

        # Prefer versioned formulas when requested; fall back for llvm@N if missing
        for pkg in $PKGS; do
          if brew install "$pkg"; then
            echo "Installed: $pkg"
          else
            case "$pkg" in
              llvm@*)
                echo "Formula $pkg failed; falling back to llvm"
                brew install llvm
                ;;
              *)
                echo "::error::Failed to install $pkg"
                exit 1
                ;;
            esac
          fi
        done

    ###########################################################################
    # LINUX → APT (with deterministic .deb cache)
    ###########################################################################
    - name: Normalize package list (Linux)
      if: runner.os == 'Linux'
      id: pkgs
      shell: bash
      run: |
        set -euo pipefail

        PACKAGES_NORMALIZED="$(echo "${{ inputs.packages }}" | tr -s '[:space:]' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ' | sed 's/ *$//')"
        echo "packages=${PACKAGES_NORMALIZED}" >> "$GITHUB_OUTPUT"
        echo "Normalized packages: ${PACKAGES_NORMALIZED}"

        if [ -z "$PACKAGES_NORMALIZED" ]; then
          echo "empty=true" >> "$GITHUB_OUTPUT"
        else
          echo "empty=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepare APT cache key and directory
      if: runner.os == 'Linux' && inputs.cache-key != '' && steps.pkgs.outputs.empty != 'true'
      id: prep
      shell: bash
      run: |
        set -euo pipefail

        PACKAGES_NORMALIZED="${{ steps.pkgs.outputs.packages }}"

        if [ "${{ inputs.unique }}" = "true" ]; then
          CACHE_KEY="${{ inputs.cache-key }}"
          CACHE_DIR="$HOME/apt-cache/${{ inputs.cache-key }}"
        else
          HASH="$(echo -n "$PACKAGES_NORMALIZED" | sha256sum | cut -c1-16)"
          CACHE_KEY="${{ inputs.cache-key }}-${HASH}"
          CACHE_DIR="$HOME/apt-cache/${{ inputs.cache-key }}-${HASH}"
        fi

        mkdir -p "$CACHE_DIR"

        echo "CACHE_KEY=${CACHE_KEY}" >> "$GITHUB_ENV"
        echo "CACHE_DIR=${CACHE_DIR}" >> "$GITHUB_ENV"
        echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
        echo "cache_dir=${CACHE_DIR}" >> "$GITHUB_OUTPUT"

        echo "APT cache key: ${CACHE_KEY}"
        echo "APT cache dir: ${CACHE_DIR}"

    - name: Restore APT cache
      if: runner.os == 'Linux' && inputs.cache-key != '' && steps.pkgs.outputs.empty != 'true'
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CACHE_DIR }}
        key: ${{ env.CACHE_KEY }}

    - name: Seed system APT archives from cache
      if: runner.os == 'Linux' && inputs.cache-key != '' && steps.pkgs.outputs.empty != 'true'
      shell: bash
      run: |
        set -euo pipefail

        echo "Seeding /var/cache/apt/archives from ${CACHE_DIR}..."
        sudo mkdir -p /var/cache/apt/archives/partial

        if compgen -G "${CACHE_DIR}/*.deb" > /dev/null; then
          # -n: do not overwrite newer local files
          sudo cp -n "${CACHE_DIR}"/*.deb /var/cache/apt/archives/ || true
          echo "Restored $(ls -1 "${CACHE_DIR}"/*.deb 2>/dev/null | wc -l) deb(s) into system APT cache"
        else
          echo "No .deb files in cache directory"
        fi

    - name: Update APT and download packages
      if: runner.os == 'Linux' && steps.pkgs.outputs.empty != 'true'
      shell: bash
      run: |
        set -euo pipefail

        PACKAGES="${{ steps.pkgs.outputs.packages }}"
        echo "apt-get update..."
        sudo apt-get update -qq

        echo "Downloading packages (install deferred): ${PACKAGES}"
        # shellcheck disable=SC2086
        sudo apt-get install --download-only -y ${PACKAGES}

        if [ -n "${CACHE_DIR:-}" ]; then
          echo "Copying archives into cache dir: ${CACHE_DIR}"
          mkdir -p "${CACHE_DIR}"
          shopt -s nullglob
          for deb in /var/cache/apt/archives/*.deb; do
            cp -n "$deb" "${CACHE_DIR}/" 2>/dev/null || true
          done
          shopt -u nullglob
          echo "Cache dir now has $(ls -1 "${CACHE_DIR}"/*.deb 2>/dev/null | wc -l) deb(s)"
        fi

    - name: Install APT packages
      if: runner.os == 'Linux' && steps.pkgs.outputs.empty != 'true'
      shell: bash
      run: |
        set -euo pipefail

        PACKAGES="${{ steps.pkgs.outputs.packages }}"
        echo "Installing: ${PACKAGES}"
        # shellcheck disable=SC2086
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ${PACKAGES}

    - name: Save APT cache
      if: >-
        runner.os == 'Linux'
        && inputs.cache-key != ''
        && steps.pkgs.outputs.empty != 'true'
        && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CACHE_DIR }}
        key: ${{ env.CACHE_KEY }}