name: "Cache and Install Packages"
description: >
  Install packages with platform-native managers and caching where it matters.
  - Linux: optional APT lists cache (shared with update-apt-cached) + optional .deb cache
  - Windows: Chocolatey (+ common tool dirs on PATH)
  - macOS: Homebrew
author: "David C. Manuelda"
branding:
  icon: "hard-drive"
  color: "green"

inputs:
  packages:
    description: "Space-separated list of packages to install"
    required: true

  cache-key:
    description: >
      Linux .deb cache prefix. Empty disables deb caching.
      Independent from lists-cache-key. Ignored on Windows/macOS.
    required: false
    default: ""

  lists-cache-key:
    description: >
      Linux APT lists cache base key (must match update-apt-cached).
      Empty disables lists restore/skip-update (each job runs apt-get update).
      Default apt-lists aligns with update-apt-cached.
    required: false
    default: "apt-lists"

  rotate-weekly:
    description: >
      If true, append UTC ISO week (YYYY-Www) to lists-cache-key
      (must match update-apt-cached).
    required: false
    default: "true"

  unique:
    description: >
      Linux deb cache only. If true (default), use cache-key as-is.
      If false, append a hash of the normalized package list.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:

    ###########################################################################
    # WINDOWS → Chocolatey
    ###########################################################################
    - name: Install packages with Chocolatey (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "🍫  Installing packages with Chocolatey (Windows)"
        Write-Host "────────────────────────────────────────────────────────"

        $pkgs = "${{ inputs.packages }}".Trim()
        if ([string]::IsNullOrWhiteSpace($pkgs)) {
          Write-Host "ℹ️  No packages requested; skipping"
          exit 0
        }

        Write-Host "📦 Packages: $pkgs"
        choco install ($pkgs -split '\s+' | Where-Object { $_ -ne "" }) -y --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $pathAdds = [System.Collections.Generic.List[string]]::new()
        $pathAdds.Add("C:\ProgramData\chocolatey\bin")

        foreach ($name in ($pkgs -split '\s+')) {
          if ([string]::IsNullOrWhiteSpace($name)) { continue }
          $n = $name.ToLowerInvariant()

          if ($n -eq "nasm") {
            foreach ($d in @(
              "${env:ProgramFiles}\NASM",
              "${env:ProgramFiles(x86)}\NASM"
            )) {
              if (Test-Path (Join-Path $d "nasm.exe")) {
                $pathAdds.Add($d)
                Write-Host "PATH: NASM → $d"
              }
            }
          }

          if ($n -eq "yasm") {
            foreach ($d in @(
              "${env:ProgramFiles}\yasm",
              "${env:ProgramFiles(x86)}\yasm",
              "C:\ProgramData\chocolatey\lib\yasm\tools"
            )) {
              if ((Test-Path (Join-Path $d "yasm.exe")) -or (Test-Path $d)) {
                $pathAdds.Add($d)
                Write-Host "PATH: yasm candidate → $d"
              }
            }
          }
        }

        foreach ($d in $pathAdds) {
          if (-not [string]::IsNullOrWhiteSpace($d) -and (Test-Path $d)) {
            Add-Content -Path $env:GITHUB_PATH -Value $d
            $env:Path = "$d;$env:Path"
          }
        }

        if ($pkgs -match '(?i)\bnasm\b') {
          $nasm = Get-Command nasm.exe -ErrorAction SilentlyContinue
          if ($null -eq $nasm) {
            Write-Warning "⚠️  nasm.exe not found on PATH after install"
          } else {
            Write-Host "✅ nasm OK: $($nasm.Source)"
          }
        }

        if ($pkgs -match '(?i)\byasm\b') {
          $yasm = Get-Command yasm.exe -ErrorAction SilentlyContinue
          if ($null -eq $yasm) {
            Write-Warning "⚠️  yasm.exe not found on PATH after install"
          } else {
            Write-Host "✅ yasm OK: $($yasm.Source)"
          }
        }

        Write-Host "✅ Chocolatey install finished"

    ###########################################################################
    # macOS → Homebrew
    ###########################################################################
    - name: Install packages with Homebrew (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🍺  Installing packages with Homebrew (macOS)"
        echo "────────────────────────────────────────────────────────"

        PKGS="$(echo "${{ inputs.packages }}" | tr -s '[:space:]' ' ' | sed 's/^ *//;s/ *$//')"
        if [ -z "$PKGS" ]; then
          echo "ℹ️  No packages requested; skipping"
          exit 0
        fi

        echo "📦 Packages: $PKGS"

        for pkg in $PKGS; do
          if brew install "$pkg"; then
            echo "✅ Installed: $pkg"
          else
            case "$pkg" in
              llvm@*)
                echo "⚠️  Formula $pkg failed; falling back to llvm"
                brew install llvm
                echo "✅ Installed: llvm (fallback)"
                ;;
              *)
                echo "::error::❌ Failed to install $pkg"
                exit 1
                ;;
            esac
          fi
        done

        echo "✅ Homebrew install finished"

    ###########################################################################
    # LINUX → APT (lists from update-apt-cached + optional .deb cache)
    ###########################################################################
    - name: Normalize package list (Linux)
      if: runner.os == 'Linux'
      id: pkgs
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "📋  Normalizing package list (Linux)"
        echo "────────────────────────────────────────────────────────"

        PACKAGES_NORMALIZED="$(echo "${{ inputs.packages }}" | tr -s '[:space:]' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ' | sed 's/ *$//')"
        echo "packages=${PACKAGES_NORMALIZED}" >> "$GITHUB_OUTPUT"
        echo "📦 Normalized packages: ${PACKAGES_NORMALIZED}"

        if [ -z "$PACKAGES_NORMALIZED" ]; then
          echo "empty=true" >> "$GITHUB_OUTPUT"
          echo "ℹ️  Empty package list"
        else
          echo "empty=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve APT lists cache (Linux)
      if: runner.os == 'Linux'
      id: lists
      shell: bash
      run: |
        set -euo pipefail

        echo "🔑 Resolving APT lists cache key..."

        BASE="$(echo "${{ inputs.lists-cache-key }}" | tr -s ' ' | sed 's/^ *//;s/ *$//')"

        if [ -z "$BASE" ]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️  lists-cache-key empty – will apt-get update locally if needed"
          exit 0
        fi

        if [ "${{ inputs.rotate-weekly }}" = "true" ]; then
          WEEK="$(date -u +%G-W%V)"
          KEY="${BASE}-${WEEK}"
        else
          KEY="${BASE}"
        fi

        LISTS_DIR="$HOME/apt-cache/${KEY}/lists"
        mkdir -p "$LISTS_DIR"

        echo "enabled=true" >> "$GITHUB_OUTPUT"
        echo "lists_key=${KEY}" >> "$GITHUB_OUTPUT"
        echo "lists_dir=${LISTS_DIR}" >> "$GITHUB_OUTPUT"
        echo "LISTS_KEY=${KEY}" >> "$GITHUB_ENV"
        echo "LISTS_DIR=${LISTS_DIR}" >> "$GITHUB_ENV"
        echo "✅ APT lists key: ${KEY}"
        echo "📁 Lists dir: ${LISTS_DIR}"

    - name: Restore APT lists cache
      if: runner.os == 'Linux' && steps.lists.outputs.enabled == 'true'
      id: restore-lists
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.lists.outputs.lists_dir }}
        key: ${{ steps.lists.outputs.lists_key }}

    - name: Seed APT lists or update
      if: runner.os == 'Linux' && steps.pkgs.outputs.empty != 'true'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "📥  Seeding / updating APT lists"
        echo "────────────────────────────────────────────────────────"

        if [ "${APT_LISTS_FRESH:-0}" = "1" ]; then
          echo "ℹ️  APT lists already fresh in this job; skipping update"
          exit 0
        fi

        sudo mkdir -p /var/lib/apt/lists/partial

        NEED_UPDATE=1

        if [ "${{ steps.lists.outputs.enabled }}" = "true" ]; then
          LISTS_DIR="${{ steps.lists.outputs.lists_dir }}"
          if compgen -G "${LISTS_DIR}/*" > /dev/null; then
            echo "📁 Seeding /var/lib/apt/lists from ${LISTS_DIR}..."
            sudo find "${LISTS_DIR}" -maxdepth 1 -type f -exec cp --update=none {} /var/lib/apt/lists/ \;
            if sudo find /var/lib/apt/lists -maxdepth 1 -type f -name '*_Packages' | grep -q .; then
              NEED_UPDATE=0
              echo "✅ Restored lists usable; skipping apt-get update"
            fi
          fi
        fi

        if [ "$NEED_UPDATE" = "1" ]; then
          echo "🔄 Running apt-get update..."
          sudo apt-get update -qq
          echo "✅ apt-get update finished"
        fi

        echo "APT_LISTS_FRESH=1" >> "$GITHUB_ENV"

    - name: Prepare APT deb cache paths
      if: runner.os == 'Linux' && inputs.cache-key != '' && steps.pkgs.outputs.empty != 'true'
      id: prep
      shell: bash
      run: |
        set -euo pipefail

        echo "🔑 Preparing APT .deb cache paths..."

        PACKAGES_NORMALIZED="${{ steps.pkgs.outputs.packages }}"
        PREFIX="$(echo "${{ inputs.cache-key }}" | tr -s ' ' | sed 's/^ *//;s/ *$//')"

        if [ "${{ inputs.unique }}" = "true" ]; then
          DEBS_KEY="${PREFIX}"
          DEBS_DIR="$HOME/apt-cache/debs/${PREFIX}"
        else
          HASH="$(echo -n "$PACKAGES_NORMALIZED" | sha256sum | cut -c1-16)"
          DEBS_KEY="${PREFIX}-${HASH}"
          DEBS_DIR="$HOME/apt-cache/debs/${PREFIX}-${HASH}"
        fi

        mkdir -p "$DEBS_DIR"

        echo "DEBS_KEY=${DEBS_KEY}" >> "$GITHUB_ENV"
        echo "DEBS_DIR=${DEBS_DIR}" >> "$GITHUB_ENV"
        echo "debs_key=${DEBS_KEY}" >> "$GITHUB_OUTPUT"
        echo "✅ APT debs key: ${DEBS_KEY}"
        echo "📁 Debs dir: ${DEBS_DIR}"

    - name: Restore APT debs cache
      if: runner.os == 'Linux' && inputs.cache-key != '' && steps.pkgs.outputs.empty != 'true'
      id: restore-debs
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.DEBS_DIR }}
        key: ${{ env.DEBS_KEY }}

    - name: Seed system APT archives from deb cache
      if: runner.os == 'Linux' && inputs.cache-key != '' && steps.pkgs.outputs.empty != 'true'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "📦  Seeding system APT archives from deb cache"
        echo "────────────────────────────────────────────────────────"

        echo "📁 Seeding /var/cache/apt/archives from ${DEBS_DIR}..."
        sudo mkdir -p /var/cache/apt/archives/partial

        if compgen -G "${DEBS_DIR}/*.deb" > /dev/null; then
          sudo cp --update=none "${DEBS_DIR}"/*.deb /var/cache/apt/archives/ || true
          COUNT=$(ls -1 "${DEBS_DIR}"/*.deb 2>/dev/null | wc -l)
          echo "✅ Restored ${COUNT} deb(s)"
        else
          echo "ℹ️  No .deb files in deb cache"
        fi

    - name: Download APT packages
      if: runner.os == 'Linux' && steps.pkgs.outputs.empty != 'true'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "⬇️  Downloading APT packages"
        echo "────────────────────────────────────────────────────────"

        PACKAGES="${{ steps.pkgs.outputs.packages }}"
        echo "📦 Downloading: ${PACKAGES}"
        # shellcheck disable=SC2086
        sudo DEBIAN_FRONTEND=noninteractive apt-get install --download-only -y ${PACKAGES}

        if [ -n "${DEBS_DIR:-}" ]; then
          mkdir -p "${DEBS_DIR}"
          shopt -s nullglob
          for deb in /var/cache/apt/archives/*.deb; do
            cp --update=none "$deb" "${DEBS_DIR}/" 2>/dev/null || true
          done
          shopt -u nullglob
          echo "📁 Copied debs into cache dir"
        fi

        echo "✅ Download finished"

    - name: Install APT packages
      if: runner.os == 'Linux' && steps.pkgs.outputs.empty != 'true'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🔧  Installing APT packages"
        echo "────────────────────────────────────────────────────────"

        PACKAGES="${{ steps.pkgs.outputs.packages }}"
        echo "📦 Installing: ${PACKAGES}"
        # shellcheck disable=SC2086
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ${PACKAGES}

        echo "✅ APT install finished"

    - name: Save APT debs cache
      if: >-
        runner.os == 'Linux'
        && inputs.cache-key != ''
        && steps.pkgs.outputs.empty != 'true'
        && steps.restore-debs.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.DEBS_DIR }}
        key: ${{ env.DEBS_KEY }}