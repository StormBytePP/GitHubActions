name: Cache and Install Packages
description: >
  Installs packages with caching support.
  - Linux: APT (with deterministic .deb caching)
  - Windows: Chocolatey
  - macOS: Homebrew
author: David C. Manuelda
branding:
  icon: 'hard-drive'
  color: 'green'

inputs:
  packages:
    description: "Space-separated list of packages to install"
    required: true

  cache-key:
    description: "Prefix for the cache key (Linux only). If empty, caching is disabled."
    required: false
    default: ""

  unique:
    description: >
      If true (default), the cache-key is assumed to be globally unique and
      no hash suffix will be added. If false, a deterministic hash based on
      the package list will be appended to avoid collisions.
      (Only used on Linux)
    required: false
    default: "true"

runs:
  using: "composite"
  steps:

    ###########################################################################
    # WINDOWS → Chocolatey
    ###########################################################################
    - name: Install packages with Chocolatey (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host "Installing packages with Chocolatey: ${{ inputs.packages }}"
        choco install ${{ inputs.packages }} -y

    ###########################################################################
    # macOS → Homebrew
    ###########################################################################
    - name: Install packages with Homebrew (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "Installing packages with Homebrew: ${{ inputs.packages }}"
        brew install ${{ inputs.packages }}

    ###########################################################################
    # LINUX → APT (con cache completo)
    ###########################################################################

    - name: Prepare APT cache key and directory
      if: runner.os == 'Linux' && inputs.cache-key != ''
      id: prep
      shell: bash
      run: |
        set -euo pipefail
        echo "[STEP 0] Preparing cache key and directory..."

        PACKAGES_NORMALIZED=$(echo "${{ inputs.packages }}" | tr -s ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/ *$//')

        if [ "${{ inputs.unique }}" = "true" ]; then
          CACHE_KEY="${{ inputs.cache-key }}"
          CACHE_DIR="$HOME/apt-cache-${{ inputs.cache-key }}"
        else
          HASH=$(echo -n "$PACKAGES_NORMALIZED" | sha256sum | cut -c1-16)
          CACHE_KEY="${{ inputs.cache-key }}-${HASH}"
          CACHE_DIR="$HOME/apt-cache-${{ inputs.cache-key }}-${HASH}"
        fi

        echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_ENV"
        echo "CACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"

        mkdir -p "$CACHE_DIR"
        echo "Using cache key: $CACHE_KEY"
        echo "Cache directory: $CACHE_DIR"

    - name: Restore APT cache
      if: runner.os == 'Linux' && inputs.cache-key != ''
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CACHE_DIR }}
        key: ${{ env.CACHE_KEY }}

    - name: Restore cached .deb files into system APT cache
      if: runner.os == 'Linux' && inputs.cache-key != ''
      shell: bash
      run: |
        echo "[STEP 2] Copying restored .deb files into /var/cache/apt/archives..."
        sudo mkdir -p /var/cache/apt/archives
        if compgen -G "${CACHE_DIR}/*.deb" > /dev/null; then
          sudo cp -n "${CACHE_DIR}"/*.deb /var/cache/apt/archives/ || true
        fi

    - name: Download APT packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        echo "[STEP 3] Updating package lists and downloading missing packages..."
        sudo apt-get update -qq
        sudo apt-get install --download-only -y ${{ inputs.packages }}

        if [ -n "${CACHE_DIR:-}" ]; then
          echo "Copying newly downloaded .deb files into cache directory..."
          shopt -s nullglob
          cp -n /var/cache/apt/archives/*.deb "${CACHE_DIR}/" 2>/dev/null || true
          shopt -u nullglob
        fi

    - name: Install APT packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "[STEP 4] Installing packages..."
        sudo apt-get install -y ${{ inputs.packages }}

    - name: Save APT cache
      if: runner.os == 'Linux' && inputs.cache-key != '' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CACHE_DIR }}
        key: ${{ env.CACHE_KEY }}