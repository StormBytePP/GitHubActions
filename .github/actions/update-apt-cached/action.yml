name: "Update APT lists (cached)"
description: >
  Linux only. Restore cached APT indexes, then decide whether to refresh
  them from the mirrors under a hard timeout. Cache is a fallback when
  mirrors hang; it is not a weekly freeze of Packages.
author: "David C. Manuelda"
branding:
  icon: "database"
  color: "yellow"

inputs:
  cache-key:
    description: >
      Cache key prefix (e.g. apt-lists). Empty disables caching (no-op).
      OS and a short InRelease hash are appended. One logical family per OS.
    required: false
    default: "apt-lists"

  acquire-timeout:
    description: "Seconds per HTTP(S) attempt against Ubuntu mirrors."
    required: false
    default: "20"

  acquire-retries:
    description: "Retries per mirror request (apt + InRelease probe)."
    required: false
    default: "2"

runs:
  using: "composite"
  steps:

    - name: Skip on non-Linux
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "update-apt-cached: no-op on ${{ runner.os }}"

    - name: Resolve cache prefix
      if: runner.os == 'Linux'
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        BASE="$(echo "${{ inputs.cache-key }}" | tr -s ' ' | sed 's/^ *//;s/ *$//')"
        if [ -z "$BASE" ]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "cache-key empty — bypass"
          exit 0
        fi
        PREFIX="${BASE}-${{ runner.os }}"
        LISTS_ROOT="$HOME/apt-cache/${PREFIX}"
        mkdir -p "$LISTS_ROOT"
        echo "enabled=true" >> "$GITHUB_OUTPUT"
        echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
        echo "lists_root=${LISTS_ROOT}" >> "$GITHUB_OUTPUT"
        echo "prefix=${PREFIX}"

    - name: Probe InRelease
      if: runner.os == 'Linux' && steps.meta.outputs.enabled == 'true'
      id: probe
      shell: bash
      run: |
        set -euo pipefail
        TIMEOUT="${{ inputs.acquire-timeout }}"
        RETRIES="${{ inputs.acquire-retries }}"
        case "$TIMEOUT" in ''|*[!0-9]*) TIMEOUT=20 ;; esac
        case "$RETRIES" in ''|*[!0-9]*) RETRIES=2 ;; esac
        [ "$TIMEOUT" -lt 5 ] && TIMEOUT=5
        [ "$RETRIES" -lt 0 ] && RETRIES=0

        . /etc/os-release
        CODE="${VERSION_CODENAME:-}"
        if [ -z "$CODE" ]; then
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "hash=none" >> "$GITHUB_OUTPUT"
          echo "InRelease: no VERSION_CODENAME — cannot probe"
          exit 0
        fi

        ARCHIVE="http://archive.ubuntu.com/ubuntu"
        SECURITY="http://security.ubuntu.com/ubuntu"
        URLS=(
          "${ARCHIVE}/dists/${CODE}/InRelease"
          "${ARCHIVE}/dists/${CODE}-updates/InRelease"
          "${ARCHIVE}/dists/${CODE}-backports/InRelease"
          "${SECURITY}/dists/${CODE}-security/InRelease"
        )

        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        ok=1
        echo "Probing InRelease (timeout=${TIMEOUT}s retries=${RETRIES}) codename=${CODE}"
        for url in "${URLS[@]}"; do
          name="$(echo "$url" | sed 's#https\?://##;s#[^A-Za-z0-9._-]#_#g')"
          echo "  GET ${url}"
          if ! curl -fsSL --max-time "$TIMEOUT" --retry "$RETRIES" --retry-all-errors \
               -o "${TMP}/${name}" "$url"; then
            echo "  failed: ${url}"
            ok=0
            break
          fi
        done

        if [ "$ok" -ne 1 ]; then
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "hash=none" >> "$GITHUB_OUTPUT"
          echo "InRelease: unreachable or timed out — will not wait on mirrors"
          exit 0
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          HASH="$(cat "${TMP}"/* | sha256sum | awk '{print substr($1,1,16)}')"
        else
          HASH="$(cat "${TMP}"/* | shasum -a 256 | awk '{print substr($1,1,16)}')"
        fi
        echo "reachable=true" >> "$GITHUB_OUTPUT"
        echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
        echo "InRelease hash=${HASH}"

    - name: Restore APT lists cache
      if: runner.os == 'Linux' && steps.meta.outputs.enabled == 'true'
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.meta.outputs.lists_root }}
        key: ${{ steps.meta.outputs.prefix }}-${{ steps.probe.outputs.hash }}
        restore-keys: |
          ${{ steps.meta.outputs.prefix }}-

    - name: Seed or update APT lists
      if: runner.os == 'Linux' && steps.meta.outputs.enabled == 'true'
      id: lists
      shell: bash
      run: |
        set -euo pipefail
        LISTS_ROOT="${{ steps.meta.outputs.lists_root }}"
        HASH="${{ steps.probe.outputs.hash }}"
        REACHABLE="${{ steps.probe.outputs.reachable }}"
        HIT="${{ steps.restore.outputs.cache-hit }}"
        TIMEOUT="${{ inputs.acquire-timeout }}"
        RETRIES="${{ inputs.acquire-retries }}"
        case "$TIMEOUT" in ''|*[!0-9]*) TIMEOUT=20 ;; esac
        case "$RETRIES" in ''|*[!0-9]*) RETRIES=2 ;; esac

        LISTS_DIR="${LISTS_ROOT}/lists"
        mkdir -p "$LISTS_DIR"
        sudo mkdir -p /var/lib/apt/lists/partial

        seed_lists() {
          if compgen -G "${LISTS_DIR}/*" >/dev/null; then
            sudo find "$LISTS_DIR" -maxdepth 1 -type f -exec cp --update=none {} /var/lib/apt/lists/ \;
            if sudo find /var/lib/apt/lists -maxdepth 1 -type f -name '*_Packages' | grep -q .; then
              return 0
            fi
          fi
          return 1
        }

        run_update() {
          sudo apt-get update -qq \
            -o Acquire::Retries="$RETRIES" \
            -o Acquire::http::Timeout="$TIMEOUT" \
            -o Acquire::https::Timeout="$TIMEOUT"
        }

        save_lists() {
          mkdir -p "$LISTS_DIR"
          sudo find /var/lib/apt/lists -maxdepth 1 -type f -exec cp -f {} "$LISTS_DIR/" \;
          sudo chown -R "$(id -u):$(id -g)" "$LISTS_ROOT" || true
        }

        SEEDED=0
        if seed_lists; then
          SEEDED=1
          echo "Seeded /var/lib/apt/lists from cache"
        else
          echo "No usable cached Packages"
        fi

        CASE=""
        UPDATED=0

        if [ "$REACHABLE" = "true" ] && [ "$HIT" = "true" ] && [ "$SEEDED" = "1" ]; then
          CASE="unchanged"
          echo "Indexes unchanged (hash=${HASH}) — using cached lists"
        elif [ "$REACHABLE" = "true" ]; then
          CASE="refresh"
          if [ "$HIT" = "true" ]; then
            echo "Indexes changed or incomplete cache — apt-get update (timeout=${TIMEOUT}s)"
          else
            echo "No exact cache for hash=${HASH} — apt-get update (timeout=${TIMEOUT}s)"
          fi
          if run_update; then
            save_lists
            UPDATED=1
            echo "apt-get update finished — lists saved"
          elif [ "$SEEDED" = "1" ]; then
            echo "apt-get update failed — keeping seeded cache"
          else
            echo "apt-get update failed and no cache"
            exit 1
          fi
        else
          CASE="mirror-down"
          if [ "$SEEDED" = "1" ]; then
            echo "Mirrors unreachable — using cached lists (may be stale)"
          else
            echo "Mirrors unreachable and no cache — last attempt at apt-get update"
            if run_update; then
              save_lists
              UPDATED=1
              echo "apt-get update finished — lists saved"
            else
              echo "apt-get update failed"
              exit 1
            fi
          fi
        fi

        echo "case=${CASE}" >> "$GITHUB_OUTPUT"
        echo "lists_updated=${UPDATED}" >> "$GITHUB_ENV"
        echo "APT_LISTS_FRESH=1" >> "$GITHUB_ENV"
        echo "Ready (case=${CASE} updated=${UPDATED} hash=${HASH})"

    - name: Save APT lists cache
      if: >-
        runner.os == 'Linux'
        && steps.meta.outputs.enabled == 'true'
        && env.lists_updated == '1'
        && steps.probe.outputs.reachable == 'true'
        && steps.probe.outputs.hash != 'none'
        && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.meta.outputs.lists_root }}
        key: ${{ steps.meta.outputs.prefix }}-${{ steps.probe.outputs.hash }}
