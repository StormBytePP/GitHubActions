name: "Build with Toolchain"
description: "Install compiler toolchain, build with CMake/Ninja and save compiler cache"
author: "David C. Manuelda"
branding:
  icon: "package"
  color: "blue"

inputs:
  toolchain:
    description: "gcc, clang, clang-libc++, or msvc"
    required: true

  ccache-key:
    description: >
      Non-empty enables compiler caching. Used as a version/namespace suffix
      (e.g. "v1"). The real Actions key is per-OS + toolchain + this suffix +
      a hash of configure-options/build-type/target so matrix profiles do not
      overwrite each other on restore. Do not put only "v1" if two jobs share
      the same options but you still need separate caches — change options or
      the suffix.
    required: false
    default: ""

  build-dir:
    description: "CMake build directory"
    required: false
    default: "build"

  build-type:
    description: "CMake build type"
    required: false
    default: "Debug"

  configure-options:
    description: "Extra CMake configure options"
    required: false
    default: ""

  target:
    description: "Optional CMake target to build (empty = all)"
    required: false
    default: ""

  run-tests:
    description: "Run ctest after build"
    required: false
    default: "false"

  ctest-options:
    description: "Extra options for ctest"
    required: false
    default: "--output-on-failure"

  version:
    description: "Optional major version for gcc/clang"
    required: false
    default: ""

  docs:
    description: "Install documentation tools"
    required: false
    default: "false"

  install-meson:
    description: >
      Install/pin Meson 1.10.0 via pip (required for FFmpeg/libvpx MSVC
      link tests; newer Meson can inject invalid /release for cl).
    required: false
    default: "true"

  msvc-embedded-debug:
    description: >
      Windows only. If true (default), pass
      -DCMAKE_POLICY_DEFAULT_CMP0141=NEW and
      -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded so MSVC uses /Z7
      instead of /Zi (avoids PDB races under parallel sccache).
    required: false
    default: "true"

outputs:
  c_compiler:
    value: ${{ steps.toolchain.outputs.c_compiler }}
  cxx_compiler:
    value: ${{ steps.toolchain.outputs.cxx_compiler }}

runs:
  using: "composite"
  steps:

    ###########################################################################
    # 0. COMPILER CACHE KEYS + STABLE CACHE DIRS
    ###########################################################################
    - name: Compute compiler cache keys
      if: inputs.ccache-key != ''
      id: cachekeys
      shell: bash
      run: |
        set -euo pipefail

        OS="${{ runner.os }}"
        TOOL="${{ inputs.toolchain }}"
        SUFFIX="$(echo '${{ inputs.ccache-key }}' | tr -s ' ' | sed 's/^ *//;s/ *$//')"
        if [ -z "$SUFFIX" ]; then
          echo "ccache-key is empty after trim"
          exit 1
        fi

        if [ "$OS" = "Windows" ]; then
          PREFIX="sccache"
          if [ -z "${SCCACHE_DIR:-}" ]; then
            SCCACHE_DIR="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}/Mozilla/sccache/cache"
            if [ -n "${RUNNER_TEMP:-}" ]; then
              SCCACHE_DIR="${RUNNER_TEMP}/sccache"
            fi
          fi
          mkdir -p "$SCCACHE_DIR"
          echo "SCCACHE_DIR=${SCCACHE_DIR}" >> "$GITHUB_ENV"
          export SCCACHE_DIR
          echo "SCCACHE_DIR=${SCCACHE_DIR}"
        else
          PREFIX="ccache"
          CCACHE_DIR="${RUNNER_TEMP}/ccache"
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          export CCACHE_DIR
          echo "CCACHE_DIR=${CCACHE_DIR}"
        fi

        # Profile fingerprint: jobs with different configure/type/target must
        # NOT share the same restore prefix (otherwise the last job to finish
        # wins and a thin SYSTEM cache can hide a fat BUNDLED one).
        VARIANT="$(
          printf '%s\0%s\0%s' \
            "${{ inputs.configure-options }}" \
            "${{ inputs.build-type }}" \
            "${{ inputs.target }}" \
          | sha256sum 2>/dev/null | cut -c1-12 \
          || printf '%s\0%s\0%s' \
            "${{ inputs.configure-options }}" \
            "${{ inputs.build-type }}" \
            "${{ inputs.target }}" \
          | shasum -a 256 | cut -c1-12
        )"

        # BASE is the stable lineage for this OS + toolchain + namespace + profile.
        # SAVE is unique per workflow run so parallel identical jobs do not collide.
        BASE="${PREFIX}-${OS}-${TOOL}-${SUFFIX}-${VARIANT}"
        SAVE="${BASE}-${GITHUB_RUN_ID}"

        echo "base_key=${BASE}" >> "$GITHUB_OUTPUT"
        echo "save_key=${SAVE}" >> "$GITHUB_OUTPUT"

        echo "BASE_KEY=${BASE}" >> "$GITHUB_ENV"
        echo "SAVE_KEY=${SAVE}" >> "$GITHUB_ENV"

        echo "Compiler cache BASE=${BASE}"
        echo "Compiler cache SAVE=${SAVE}"
        echo "Compiler cache VARIANT=${VARIANT}"

    ###########################################################################
    # 1. INSTALL TOOLCHAIN
    ###########################################################################
    - name: Install toolchain
      id: toolchain
      uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        ccache-key: ${{ inputs.ccache-key != '' && format('{0}-{1}', inputs.toolchain, inputs.ccache-key) || '' }}
        version: ${{ inputs.version }}
        docs: ${{ inputs.docs }}
        install-meson: ${{ inputs.install-meson }}

    ###########################################################################
    # 1a. RE-PIN CACHE DIRS + EXPORT LAUNCHERS FOR BUILDMASTER (ENV fallback)
    ###########################################################################
    - name: Pin cache dirs and export compiler launchers
      if: inputs.ccache-key != ''
      shell: bash
      run: |
        set -euo pipefail

        OS="${{ runner.os }}"

        if [ "$OS" = "Windows" ]; then
          if [ -z "${SCCACHE_DIR:-}" ]; then
            if [ -n "${RUNNER_TEMP:-}" ]; then
              SCCACHE_DIR="${RUNNER_TEMP}/sccache"
            else
              SCCACHE_DIR="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}/Mozilla/sccache/cache"
            fi
          fi
          mkdir -p "$SCCACHE_DIR"
          echo "SCCACHE_DIR=${SCCACHE_DIR}" >> "$GITHUB_ENV"

          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

          if command -v sccache >/dev/null 2>&1; then
            sccache --stop-server 2>/dev/null || true
            sccache --start-server 2>/dev/null || true
            sccache --zero-stats 2>/dev/null || true
            echo "sccache ready (dir=${SCCACHE_DIR})"
            sccache --show-stats || true
          else
            echo "WARNING: sccache not on PATH after install-toolchain"
          fi
        else
          CCACHE_DIR="${RUNNER_TEMP}/ccache"
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          export CCACHE_DIR

          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

          if command -v ccache >/dev/null 2>&1; then
            ccache -z || true
            echo "ccache ready (dir=${CCACHE_DIR})"
            ccache -s || true
          else
            echo "WARNING: ccache not on PATH after install-toolchain"
          fi
        fi

    ###########################################################################
    # 1b. PIN MESON 1.10.0 (single place — no duplicate install)
    ###########################################################################
    - name: Pin Meson 1.10.0
      if: inputs.install-meson != 'false'
      shell: bash
      run: |
        set -euo pipefail

        PY=""
        for c in python3 python; do
          if command -v "$c" >/dev/null 2>&1; then
            PY="$c"
            break
          fi
        done
        if [ -z "$PY" ]; then
          echo "python/python3 not found (install-toolchain should set up Python)"
          exit 1
        fi

        echo "Using: $($PY -c 'import sys; print(sys.executable)')"
        $PY -m pip install --upgrade pip
        $PY -m pip uninstall -y meson 2>/dev/null || true
        $PY -m pip install --force-reinstall --no-cache-dir 'meson==1.10.0'

        SCRIPTS="$($PY -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
        if [ -n "$SCRIPTS" ] && [ -d "$SCRIPTS" ]; then
          echo "$SCRIPTS" >> "$GITHUB_PATH"
          export PATH="$SCRIPTS:$PATH"
        fi

        MESON_BIN="$(command -v meson || true)"
        if [ -z "$MESON_BIN" ]; then
          echo "meson not on PATH after install"
          exit 1
        fi

        VER="$(meson --version | head -n1 | tr -d '\r')"
        echo "meson at: $MESON_BIN"
        echo "meson version: $VER"
        case "$VER" in
          1.10.0*) ;;
          *)
            echo "Expected Meson 1.10.0, got: $VER"
            exit 1
            ;;
        esac

    ###########################################################################
    # 1c. RESTORE COMPILER CACHE
    ###########################################################################
    - name: Restore ccache
      if: inputs.ccache-key != '' && (runner.os == 'Linux' || runner.os == 'macOS')
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}
        restore-keys: |
          ${{ steps.cachekeys.outputs.base_key }}-

    - name: Restore sccache
      if: inputs.ccache-key != '' && runner.os == 'Windows'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}
        restore-keys: |
          ${{ steps.cachekeys.outputs.base_key }}-

    ###########################################################################
    # 1d. WINDOWS: drop GNU link.exe shadows + clean __VSCMD_PREINIT_PATH
    ###########################################################################
    - name: Sanitize PATH for MSVC linker
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        function Remove-GnuShadowPaths([string]$pathValue) {
          $gnuPathFragments = @(
            'Git\usr\bin',
            'Git\mingw64\bin',
            'Git\mingw32\bin',
            'Strawberry\c\bin',
            'Strawberry\c\x86_64-w64-mingw32',
            'msys64\usr\bin',
            'msys64\mingw64\bin',
            'cygwin64\bin',
            'mingw64\bin',
            'mingw32\bin'
          )
          $parts = [System.Collections.Generic.List[string]]::new()
          foreach ($p in ($pathValue -split ';')) {
            if ([string]::IsNullOrWhiteSpace($p)) { continue }
            $drop = $false
            foreach ($frag in $gnuPathFragments) {
              if ($p -like "*$frag*") {
                Write-Host "PATH: removing GNU shadow: $p"
                $drop = $true
                break
              }
            }
            if (-not $drop) { $parts.Add($p) }
          }
          return ($parts -join ';')
        }

        $env:Path = Remove-GnuShadowPaths $env:Path

        $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
        if ($null -eq $linkCmd) {
          Write-Error "link.exe not found after PATH sanitize (msvc-dev-cmd missing?)"
          exit 1
        }

        $linkDir = Split-Path -Parent $linkCmd.Source
        $env:Path = "$linkDir;$env:Path"

        $linkDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        if ($env:__VSCMD_PREINIT_PATH) {
          $cleanPreinit = Remove-GnuShadowPaths $env:__VSCMD_PREINIT_PATH
          $env:__VSCMD_PREINIT_PATH = $cleanPreinit
          "__VSCMD_PREINIT_PATH=$cleanPreinit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Cleaned __VSCMD_PREINIT_PATH"
        }

        Write-Host "Using linker: $($linkCmd.Source)"

        if ($linkCmd.Source -notmatch '(?i)[\\/]MSVC[\\/]|HostX64|Hostx64|Visual Studio') {
          Write-Error "link.exe does not look like MSVC: $($linkCmd.Source)"
          exit 1
        }

        $bannerText = @(cmd /c "link.exe 2>&1") | Out-String
        Write-Host "link.exe banner (first 300 chars):"
        if ($bannerText.Length -gt 0) {
          Write-Host $bannerText.Substring(0, [Math]::Min(300, $bannerText.Length))
        }

        Write-Host "MSVC linker OK"
        exit 0

    ###########################################################################
    # 2. CONFIGURE (explicit -D launchers = required for parent + BuildMaster)
    ###########################################################################
    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        CONFIGURE_OPTIONS: ${{ inputs.configure-options }}
      run: |
        set -euo pipefail

        LAUNCHER_ARGS=()
        if [ -n "${{ inputs.ccache-key }}" ] && command -v ccache >/dev/null 2>&1; then
          export CCACHE_DIR="${CCACHE_DIR:-${RUNNER_TEMP}/ccache}"
          mkdir -p "${CCACHE_DIR}"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"

          LAUNCHER_ARGS+=(
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          )
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

          echo "Using ccache as compiler launcher (dir=${CCACHE_DIR})"
          ccache -s || true
        else
          echo "ccache launcher disabled or ccache not installed"
        fi

        # shellcheck disable=SC2086
        cmake -S . -B "${{ inputs.build-dir }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
          -DCMAKE_C_COMPILER="${{ steps.toolchain.outputs.c_compiler }}" \
          -DCMAKE_CXX_COMPILER="${{ steps.toolchain.outputs.cxx_compiler }}" \
          "${LAUNCHER_ARGS[@]}" \
          ${CONFIGURE_OPTIONS}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CONFIGURE_OPTIONS: ${{ inputs.configure-options }}
      run: |
        $ErrorActionPreference = "Stop"

        $cmakeArgs = [System.Collections.Generic.List[string]]::new()
        foreach ($a in @(
          "-S", ".",
          "-B", "${{ inputs.build-dir }}",
          "-G", "Ninja",
          "-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}",
          "-DCMAKE_C_COMPILER=cl",
          "-DCMAKE_CXX_COMPILER=cl"
        )) {
          $cmakeArgs.Add($a)
        }

        if ("${{ inputs.msvc-embedded-debug }}" -eq "true") {
          Write-Host "msvc-embedded-debug: CMP0141=NEW + Embedded (/Z7)"
          $cmakeArgs.Add("-DCMAKE_POLICY_DEFAULT_CMP0141=NEW")
          $cmakeArgs.Add("-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded")
        }

        $useSccache = $false
        if ("${{ inputs.ccache-key }}" -ne "") {
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            $useSccache = $true
          }
        }

        if ($useSccache) {
          Write-Host "Using sccache launcher (explicit -D + ENV for BuildMaster)"
          $cmakeArgs.Add("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
          $cmakeArgs.Add("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")

          if (-not $env:SCCACHE_DIR -or $env:SCCACHE_DIR -eq "") {
            if ($env:RUNNER_TEMP) {
              $env:SCCACHE_DIR = Join-Path $env:RUNNER_TEMP "sccache"
            } else {
              $env:SCCACHE_DIR = Join-Path $env:LOCALAPPDATA "Mozilla\sccache\cache"
            }
          }
          New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null
          "SCCACHE_DIR=$($env:SCCACHE_DIR)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SCCACHE_DIR=$($env:SCCACHE_DIR)"
        } else {
          Write-Host "WARNING: sccache not configured – caching disabled"
        }

        $extra = $env:CONFIGURE_OPTIONS
        if ($extra -and $extra.Trim() -ne "") {
          foreach ($m in [regex]::Matches($extra, '("([^"]*)"|''([^'']*)''|\S+)')) {
            $t = $m.Value
            if ($t.Length -ge 2 -and (
                ($t.StartsWith('"') -and $t.EndsWith('"')) -or
                ($t.StartsWith("'") -and $t.EndsWith("'"))
              )) {
              $t = $t.Substring(1, $t.Length - 2)
            }
            if ($t -ne "") { $cmakeArgs.Add($t) }
          }
        }

        Write-Host "Running: cmake $($cmakeArgs -join ' ')"
        & cmake @($cmakeArgs.ToArray())
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    ###########################################################################
    # 3. BUILD
    ###########################################################################
    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        function Remove-GnuShadowPaths([string]$pathValue) {
          $gnuPathFragments = @(
            'Git\usr\bin', 'Git\mingw64\bin', 'Git\mingw32\bin',
            'Strawberry\c\bin', 'Strawberry\c\x86_64-w64-mingw32',
            'msys64\usr\bin', 'msys64\mingw64\bin', 'cygwin64\bin',
            'mingw64\bin', 'mingw32\bin'
          )
          $parts = [System.Collections.Generic.List[string]]::new()
          foreach ($p in ($pathValue -split ';')) {
            if ([string]::IsNullOrWhiteSpace($p)) { continue }
            $drop = $false
            foreach ($frag in $gnuPathFragments) {
              if ($p -like "*$frag*") { $drop = $true; break }
            }
            if (-not $drop) { $parts.Add($p) }
          }
          return ($parts -join ';')
        }

        $env:Path = Remove-GnuShadowPaths $env:Path
        $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
        if ($null -eq $linkCmd) {
          Write-Error "link.exe not found before build"
          exit 1
        }
        $linkDir = Split-Path -Parent $linkCmd.Source
        $env:Path = "$linkDir;$env:Path"
        if ($env:__VSCMD_PREINIT_PATH) {
          $env:__VSCMD_PREINIT_PATH = Remove-GnuShadowPaths $env:__VSCMD_PREINIT_PATH
        }

        Write-Host "Build-time linker: $($linkCmd.Source)"
        if ($linkCmd.Source -notmatch '(?i)[\\/]MSVC[\\/]|HostX64|Hostx64|Visual Studio') {
          Write-Error "Build step link.exe does not look like MSVC: $($linkCmd.Source)"
          exit 1
        }
        where.exe link

        $jobs = [Environment]::ProcessorCount
        if ($jobs -lt 1) { $jobs = 4 }

        $target = "${{ inputs.target }}"
        if ($target -ne "") {
          ninja -C "${{ inputs.build-dir }}" -j $jobs $target
        } else {
          ninja -C "${{ inputs.build-dir }}" -j $jobs
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"

        if [ -n "${{ inputs.target }}" ]; then
          ninja -C "${{ inputs.build-dir }}" -j"${JOBS}" "${{ inputs.target }}"
        else
          ninja -C "${{ inputs.build-dir }}" -j"${JOBS}"
        fi

    ###########################################################################
    # 4. CACHE STATS
    ###########################################################################
    - name: Compiler cache stats
      if: always() && inputs.ccache-key != ''
      shell: bash
      run: |
        set +e
        echo "=============================================="
        echo " COMPILER CACHE STATISTICS"
        echo "=============================================="
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          echo "SCCACHE_DIR=${SCCACHE_DIR:-<unset>}"
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || echo "sccache not found in PATH"
        else
          echo "CCACHE_DIR=${CCACHE_DIR:-<unset>}"
          command -v ccache >/dev/null 2>&1 && ccache -s || echo "ccache not found in PATH"
        fi
        echo "=============================================="

    ###########################################################################
    # 5. TESTS (optional)
    ###########################################################################
    - name: Run tests (Windows)
      if: inputs.run-tests == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
      run: |
        $ErrorActionPreference = "Stop"
        $opts = $env:CTEST_OPTIONS
        if ($opts) {
          ctest --test-dir "${{ inputs.build-dir }}" $opts.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
        } else {
          ctest --test-dir "${{ inputs.build-dir }}" --output-on-failure
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run tests (Linux/macOS)
      if: inputs.run-tests == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        ctest --test-dir "${{ inputs.build-dir }}" ${CTEST_OPTIONS}

    ###########################################################################
    # 6. SAVE COMPILER CACHE
    ###########################################################################
    - name: Save ccache
      if: success() && (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}

    - name: Save sccache
      if: success() && runner.os == 'Windows' && inputs.ccache-key != ''
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}