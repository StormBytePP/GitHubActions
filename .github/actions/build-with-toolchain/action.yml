name: "Build with Toolchain"
description: "Configure caches/linkers, build with CMake/Ninja, run tests and save caches"
author: "David C. Manuelda"
branding:
  icon: "package"
  color: "blue"

inputs:
  compiler:
    description: "gcc, clang, msvc, or clang-cl (Windows only)"
    required: false
    default: ""

  compiler-version:
    description: "Optional major version for gcc/clang"
    required: false
    default: ""

  cxx-stdlib:
    description: "C++ standard library: libstdc++ or libc++. Empty uses the platform default."
    required: false
    default: ""

  libc:
    description: "Linux C library: glibc or musl. musl builds run in Alpine 3.24."
    required: false
    default: "glibc"

  compiler-cache-key:
    description: "Compiler cache namespace. Empty disables compiler caching."
    required: false
    default: ""

  compiler-cache-scope:
    description: "Extra compiler-cache namespace for matrix cells or parallel jobs."
    required: false
    default: ""

  buildmaster-cache-key:
    description: "BuildMaster downloads-cache namespace. Empty disables that cache."
    required: false
    default: ""

  cmake-options:
    description: "Extra CMake configure options"
    required: false
    default: ""

  build-target:
    description: "Optional CMake target to build (empty = all)"
    required: false
    default: ""

  ctest:
    description: "Run ctest after build"
    required: false
    default: ""

  install-prefix:
    description: "Set CMAKE_INSTALL_PREFIX; does not trigger installation."
    required: false
    default: ""

  meson:
    description: "Install Meson via pip."
    required: false
    default: ""

  extra-packages:
    description: "Additional packages for the build environment (APT, apk, Homebrew, or Chocolatey names)."
    required: false
    default: ""

  container-env:
    description: "Additional host environment variable names to forward to the Alpine container."
    required: false
    default: ""

  pgo:
    description: "Set ENABLE_PGO to true or false. Empty leaves the CMake option unchanged."
    required: false
    default: ""

  lto:
    description: "Set ENABLE_LTO to true or false. Empty leaves the CMake option unchanged."
    required: false
    default: ""

  cpu-baseline:
    description: >
      Target CPU flags for C/C++ (also inherited by BuildMaster dependencies).
      auto: Linux x64 -march=x86-64-v3, Linux ARM64 -march=armv8.2-a,
      macOS ARM64 -mcpu=apple-m1, Windows x64 /arch:AVX. none adds nothing.
      Any other value is used verbatim.
    required: false
    default: "auto"

  deploy:
    description: "Install and upload a ZIP to the existing GitHub release for this tag."
    required: false
    default: "false"

  # Backward-compatible aliases. Prefer the canonical names above.
  toolchain:
    description: "gcc, clang, clang-libc++, msvc, or clang-cl (Windows only)"
    required: false
    default: ""

  ccache-key:
    description: >
      Deprecated alias for compiler-cache-key.
    required: false
    default: ""

  cache-scope:
    description: >
      Deprecated alias for compiler-cache-scope.
    required: false
    default: ""

  buildmaster-datadir-cache-key:
    description: >
      Deprecated alias for buildmaster-cache-key.
    required: false
    default: ""

  source-dir:
    description: "CMake source directory (-S)"
    required: false
    default: "."

  build-dir:
    description: "CMake build directory"
    required: false
    default: "build"

  build-type:
    description: "CMake build type"
    required: false
    default: "Debug"

  configure-options:
    description: "Deprecated alias for cmake-options."
    required: false
    default: ""

  target:
    description: "Deprecated alias for build-target."
    required: false
    default: ""

  run-tests:
    description: "Deprecated alias for ctest."
    required: false
    default: "false"

  install:
    description: "Run cmake --install after the build and tests"
    required: false
    default: "false"

  install-location:
    description: "Deprecated alias for install-prefix."
    required: false
    default: ""

  ctest-options:
    description: "Extra options for ctest"
    required: false
    default: ""

  version:
    description: "Deprecated alias for compiler-version."
    required: false
    default: ""

  docs:
    description: "Install documentation tools"
    required: false
    default: "false"

  install-meson:
    description: >
      Deprecated alias for meson. Installs Meson via pip; Windows requires
      1.12.1 or newer.
    required: false
    default: "true"

  # Deprecated no-op retained for existing workflows.

  msvc-embedded-debug:
    description: >
      Deprecated no-op. Kept so existing workflows do not break.
      Windows debug info is derived from build-type: Debug/RelWithDebInfo
      get /Z7; Release/MinSizeRel keep their default debug settings.
    required: false
    default: "true"

outputs:
  c_compiler:
    value: ${{ steps.options.outputs.libc == 'musl' && steps.options.outputs.compiler == 'clang' && 'clang-22' || steps.options.outputs.libc == 'musl' && 'gcc' || steps.toolchain.outputs.c_compiler }}
  cxx_compiler:
    value: ${{ steps.options.outputs.libc == 'musl' && steps.options.outputs.compiler == 'clang' && 'clang++-22' || steps.options.outputs.libc == 'musl' && 'g++' || steps.toolchain.outputs.cxx_compiler }}

runs:
  using: "composite"
  steps:

    - name: Resolve build options
      id: options
      shell: bash
      env:
        INPUT_COMPILER: ${{ inputs.compiler }}
        INPUT_COMPILER_LEGACY: ${{ inputs.toolchain }}
        INPUT_COMPILER_VERSION: ${{ inputs.compiler-version }}
        INPUT_COMPILER_VERSION_LEGACY: ${{ inputs.version }}
        INPUT_COMPILER_CACHE_KEY: ${{ inputs.compiler-cache-key }}
        INPUT_COMPILER_CACHE_KEY_LEGACY: ${{ inputs.ccache-key }}
        INPUT_COMPILER_CACHE_SCOPE: ${{ inputs.compiler-cache-scope }}
        INPUT_COMPILER_CACHE_SCOPE_LEGACY: ${{ inputs.cache-scope }}
        INPUT_BUILDMASTER_CACHE_KEY: ${{ inputs.buildmaster-cache-key }}
        INPUT_BUILDMASTER_CACHE_KEY_LEGACY: ${{ inputs.buildmaster-datadir-cache-key }}
        INPUT_CMAKE_OPTIONS: ${{ inputs.cmake-options }}
        INPUT_CMAKE_OPTIONS_LEGACY: ${{ inputs.configure-options }}
        INPUT_BUILD_TARGET: ${{ inputs.build-target }}
        INPUT_BUILD_TARGET_LEGACY: ${{ inputs.target }}
        INPUT_CTEST: ${{ inputs.ctest }}
        INPUT_CTEST_LEGACY: ${{ inputs.run-tests }}
        INPUT_INSTALL_PREFIX: ${{ inputs.install-prefix }}
        INPUT_INSTALL_PREFIX_LEGACY: ${{ inputs.install-location }}
        INPUT_MESON: ${{ inputs.meson }}
        INPUT_MESON_LEGACY: ${{ inputs.install-meson }}
        INPUT_CXX_STDLIB: ${{ inputs.cxx-stdlib }}
        INPUT_LIBC: ${{ inputs.libc }}
        INPUT_PGO: ${{ inputs.pgo }}
        INPUT_LTO: ${{ inputs.lto }}
        INPUT_CPU_BASELINE: ${{ inputs.cpu-baseline }}
        INPUT_DEPLOY: ${{ inputs.deploy }}
        REF_TYPE: ${{ github.ref_type }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        pick() {
          local preferred="$1" fallback="$2"
          if [[ -n "$preferred" ]]; then printf '%s' "$preferred"; else printf '%s' "$fallback"; fi
        }
        compiler="$(pick "$INPUT_COMPILER" "$INPUT_COMPILER_LEGACY")"
        compiler_version="$(pick "$INPUT_COMPILER_VERSION" "$INPUT_COMPILER_VERSION_LEGACY")"
        compiler_cache_key="$(pick "$INPUT_COMPILER_CACHE_KEY" "$INPUT_COMPILER_CACHE_KEY_LEGACY")"
        compiler_cache_scope="$(pick "$INPUT_COMPILER_CACHE_SCOPE" "$INPUT_COMPILER_CACHE_SCOPE_LEGACY")"
        buildmaster_cache_key="$(pick "$INPUT_BUILDMASTER_CACHE_KEY" "$INPUT_BUILDMASTER_CACHE_KEY_LEGACY")"
        cmake_options="$(pick "$INPUT_CMAKE_OPTIONS" "$INPUT_CMAKE_OPTIONS_LEGACY")"
        build_target="$(pick "$INPUT_BUILD_TARGET" "$INPUT_BUILD_TARGET_LEGACY")"
        ctest="$(pick "$INPUT_CTEST" "$INPUT_CTEST_LEGACY")"
        install_prefix="$(pick "$INPUT_INSTALL_PREFIX" "$INPUT_INSTALL_PREFIX_LEGACY")"
        meson="$(pick "$INPUT_MESON" "$INPUT_MESON_LEGACY")"
        cxx_stdlib="$INPUT_CXX_STDLIB"
        libc="$INPUT_LIBC"
        pgo="$INPUT_PGO"
        lto="$INPUT_LTO"
        deploy="$INPUT_DEPLOY"

        if [[ "$compiler" == clang-libc++ ]]; then
          compiler=clang
          [[ -z "$cxx_stdlib" ]] && cxx_stdlib=libc++
        fi
        if [[ -z "$compiler" ]]; then
          echo "::error::Input 'compiler' is required"
          exit 1
        fi
        case "$compiler" in gcc|clang|msvc|clang-cl) ;; *)
          echo "::error::Unsupported compiler: $compiler"
          exit 1
        esac
        if [[ "$RUNNER_OS" == Windows && "$compiler" != msvc && "$compiler" != clang-cl ]]; then
          echo "::error::Windows supports compiler=msvc or compiler=clang-cl"
          exit 1
        fi
        if [[ "$RUNNER_OS" == Windows && "$RUNNER_ARCH" != X64 ]]; then
          echo "::error::Windows builds are supported only on X64"
          exit 1
        fi
        if [[ "$RUNNER_OS" != Windows && ( "$compiler" == msvc || "$compiler" == clang-cl ) ]]; then
          echo "::error::msvc and clang-cl are supported only on Windows"
          exit 1
        fi
        case "$libc" in glibc|musl) ;; *)
          echo "::error::libc must be glibc or musl"
          exit 1
        esac
        if [[ "$libc" == musl && "$RUNNER_OS" != Linux ]]; then
          echo "::error::musl is supported only on Linux"
          exit 1
        fi
        if [[ -n "$cxx_stdlib" ]]; then
          case "$cxx_stdlib" in libstdc++|libc++) ;; *)
            echo "::error::cxx-stdlib must be libstdc++ or libc++"
            exit 1
          esac
        fi
        if [[ "$RUNNER_OS" == Windows && -n "$cxx_stdlib" ]]; then
          echo "::error::cxx-stdlib is not applicable to Windows toolchains"
          exit 1
        fi
        if [[ "$RUNNER_OS" == macOS && "$compiler" == clang && "$cxx_stdlib" == libstdc++ ]]; then
          echo "::error::Apple Clang does not support libstdc++; use libc++"
          exit 1
        fi
        if [[ -z "$cxx_stdlib" ]]; then
          if [[ "$RUNNER_OS" == Linux ]]; then
            cxx_stdlib=libstdc++
          elif [[ "$RUNNER_OS" == macOS && "$compiler" == clang ]]; then
            cxx_stdlib=libc++
          fi
        fi
        if [[ -z "$compiler_version" ]]; then
          case "$compiler" in
            gcc)
              if [[ "$libc" == musl ]]; then compiler_version=15; else compiler_version=16; fi
              ;;
            clang)
              compiler_version=22
              [[ "$RUNNER_OS" == macOS ]] && compiler_version=apple
              ;;
          esac
        fi
        if [[ "$cxx_stdlib" == libc++ && "$compiler" != clang ]]; then
          echo "::error::libc++ requires compiler=clang"
          exit 1
        fi
        for value in "$pgo" "$lto" "$ctest" "$deploy"; do
          case "$value" in ""|true|false) ;; *)
            echo "::error::Boolean inputs must be true or false (received '$value')"
            exit 1
          esac
        done
        for value in "$meson" "${{ inputs.docs }}" "${{ inputs.install }}"; do
          case "$value" in true|false) ;; *)
            echo "::error::Boolean inputs must be true or false (received '$value')"
            exit 1
          esac
        done
        if [[ "$deploy" == true && -z "$install_prefix" ]]; then
          echo "::error::deploy=true requires install-prefix"
          exit 1
        fi
        if [[ "$deploy" == true && "$REF_TYPE" != tag ]]; then
          echo "::error::deploy=true requires a tag ref"
          exit 1
        fi
        for value in "$compiler_version" "$compiler_cache_key" "$compiler_cache_scope" "$buildmaster_cache_key" "$build_target" "$ctest" "$install_prefix" "$meson" "$pgo" "$lto" "$deploy" "$INPUT_CPU_BASELINE"; do
          if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "::error::Single-line action inputs cannot contain line breaks"
            exit 1
          fi
        done

        cpu_baseline="$(printf '%s' "$INPUT_CPU_BASELINE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
        case "$cpu_baseline" in
          ""|auto)
            case "${RUNNER_OS}-${RUNNER_ARCH}" in
              Linux-X64) cpu_flags="-march=x86-64-v3" ;;
              Linux-ARM64) cpu_flags="-march=armv8.2-a" ;;
              macOS-ARM64) cpu_flags="-mcpu=apple-m1" ;;
              Windows-X64) cpu_flags="/arch:AVX" ;;
              *)
                echo "::error::cpu-baseline=auto has no default for ${RUNNER_OS} ${RUNNER_ARCH}; set it explicitly or use none"
                exit 1
                ;;
            esac
            ;;
          none) cpu_flags="" ;;
          *) cpu_flags="$cpu_baseline" ;;
        esac
        if [[ -n "$cpu_flags" && ! "$cpu_flags" =~ (^|[[:space:]])(-march=|-mcpu=|[/-]arch:) ]]; then
          echo "::error::cpu-baseline must select a target CPU with -march=, -mcpu= or /arch: (received '$cpu_flags')"
          exit 1
        fi
        echo "🎯 cpu-baseline=${cpu_baseline:-auto} → ${cpu_flags:-<none>}"

        {
          echo "compiler=$compiler"
          echo "compiler_version=$compiler_version"
          echo "cxx_stdlib=$cxx_stdlib"
          echo "libc=$libc"
          echo "compiler_cache_key=$compiler_cache_key"
          echo "compiler_cache_scope=$compiler_cache_scope"
          echo "buildmaster_cache_key=$buildmaster_cache_key"
          delimiter="OPTIONS_${RANDOM}_$$"
          echo "cmake_options<<${delimiter}"
          printf '%s\n' "$cmake_options"
          echo "$delimiter"
          echo "build_target=$build_target"
          echo "ctest=$ctest"
          echo "install_prefix=$install_prefix"
          echo "meson=$meson"
          echo "pgo=$pgo"
          echo "lto=$lto"
          echo "cpu_flags=$cpu_flags"
          echo "deploy=$deploy"
        } >> "$GITHUB_OUTPUT"

    ###########################################################################
    # 0. COMPILER CACHE KEYS + STABLE CACHE DIRS
    ###########################################################################
    - name: Compute compiler cache keys
      if: steps.options.outputs.compiler_cache_key != ''
      id: cachekeys
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        COMPILER: ${{ steps.options.outputs.compiler }}
        COMPILER_VERSION: ${{ steps.options.outputs.compiler_version }}
        CXX_STDLIB: ${{ steps.options.outputs.cxx_stdlib }}
        LIBC: ${{ steps.options.outputs.libc }}
        BUILD_TYPE: ${{ inputs.build-type }}
        PGO: ${{ steps.options.outputs.pgo }}
        LTO: ${{ steps.options.outputs.lto }}
        CPU_FLAGS: ${{ steps.options.outputs.cpu_flags }}
        CACHE_NAMESPACE: ${{ steps.options.outputs.compiler_cache_key }}
        CACHE_SCOPE: ${{ steps.options.outputs.compiler_cache_scope }}
      run: |
        set -euo pipefail

        echo "🔑 Computing compiler cache keys..."

        OS="${{ runner.os }}"
        JOB="${{ github.job }}"
        ARCH="${{ runner.arch }}"
        SUFFIX="$(echo "$CACHE_NAMESPACE" | tr -s ' ' | sed 's/^ *//;s/ *$//')"
        SCOPE="$(echo "$CACHE_SCOPE" | tr -s ' ' | sed 's/^ *//;s/ *$//')"

        if [ -z "$SUFFIX" ]; then
          echo "❌ compiler-cache-key is empty after trim"
          exit 1
        fi

        source "$ACTION_PATH/cache-key.sh"
        JOB_S="$(sanitize_cache_part "$JOB")"
        SCOPE_S="$(sanitize_cache_part "$SCOPE")"
        SUFFIX_S="$(sanitize_cache_part "$SUFFIX")"
        TOOL_S="$(sanitize_cache_part "$COMPILER")"
        VERSION_S="$(sanitize_cache_part "${COMPILER_VERSION:-default}")"
        STDLIB_S="$(sanitize_cache_part "${CXX_STDLIB:-default}")"
        TYPE_S="$(sanitize_cache_part "$BUILD_TYPE")"
        LIBC_S="$(sanitize_cache_part "$LIBC")"
        PGO_S="$(sanitize_cache_part "${PGO:-default}")"
        LTO_S="$(sanitize_cache_part "${LTO:-default}")"

        if [ "$OS" = "Windows" ]; then
          PREFIX="sccache"
          if [ -z "${SCCACHE_DIR:-}" ]; then
            if [ -n "${RUNNER_TEMP:-}" ]; then
              SCCACHE_DIR="${RUNNER_TEMP}/sccache"
            else
              SCCACHE_DIR="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}/Mozilla/sccache/cache"
            fi
          fi
          mkdir -p "$SCCACHE_DIR"
          echo "SCCACHE_DIR=${SCCACHE_DIR}" >> "$GITHUB_ENV"
          echo "SCCACHE_SERVER_PORT=4226" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
          export SCCACHE_DIR
          echo "📁 SCCACHE_DIR=${SCCACHE_DIR}"
        else
          PREFIX="ccache"
          CCACHE_DIR="${RUNNER_TEMP}/ccache"
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          export CCACHE_DIR
          echo "📁 CCACHE_DIR=${CCACHE_DIR}"
        fi

        KEY="${PREFIX}-${OS}-${ARCH}-${LIBC_S}-${TOOL_S}-${VERSION_S}-${STDLIB_S}-${TYPE_S}-pgo-${PGO_S}-lto-${LTO_S}-${SUFFIX_S}-${JOB_S}"
        if [ -n "$SCOPE_S" ]; then
          KEY="${KEY}-${SCOPE_S}"
        fi
        IDENTITY="$(cache_identity_hash "$OS" "$ARCH" "$LIBC" "$COMPILER" "$COMPILER_VERSION" \
          "$CXX_STDLIB" "$BUILD_TYPE" "$PGO" "$LTO" "$SUFFIX" "$JOB" "$SCOPE" "cpu=${CPU_FLAGS:-}")"
        KEY="${KEY}-${IDENTITY}"

        SAVE_KEY="${KEY}--${{ github.run_id }}-${{ github.run_attempt }}"
        if [ "${#SAVE_KEY}" -gt 512 ]; then
          echo "::error::Computed compiler-cache key exceeds GitHub's 512-character limit"
          exit 1
        fi

        echo "cache_key=${KEY}" >> "$GITHUB_OUTPUT"
        echo "save_key=${SAVE_KEY}" >> "$GITHUB_OUTPUT"
        echo "CACHE_KEY=${KEY}" >> "$GITHUB_ENV"
        echo "✅ Compiler cache KEY=${KEY}"
        echo "✅ Compiler cache SAVE_KEY=${SAVE_KEY}"

    ###########################################################################
    # 0b. BUILDMASTER DATADIR CACHE
    ###########################################################################
    - name: Prepare BuildMaster data directory
      if: steps.options.outputs.buildmaster_cache_key != ''
      id: buildmaster
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CACHE_NAMESPACE: ${{ steps.options.outputs.buildmaster_cache_key }}
        COMPILER: ${{ steps.options.outputs.compiler }}
        COMPILER_VERSION: ${{ steps.options.outputs.compiler_version }}
        CXX_STDLIB: ${{ steps.options.outputs.cxx_stdlib }}
        LIBC: ${{ steps.options.outputs.libc }}
        BUILD_TYPE: ${{ inputs.build-type }}
        PGO: ${{ steps.options.outputs.pgo }}
        LTO: ${{ steps.options.outputs.lto }}
        CPU_FLAGS: ${{ steps.options.outputs.cpu_flags }}
        CACHE_SCOPE: ${{ steps.options.outputs.compiler_cache_scope }}
        JOB_NAME: ${{ github.job }}
      run: |
        set -euo pipefail

        KEY="$(echo "$CACHE_NAMESPACE" | tr -s ' ' | sed 's/^ *//;s/ *$//')"
        if [ -z "$KEY" ]; then
          echo "❌ buildmaster-cache-key is empty after trim"
          exit 1
        fi

        source "$ACTION_PATH/cache-key.sh"
        KEY_S="$(sanitize_cache_part "$KEY")"
        if [ -z "$KEY_S" ]; then
          echo "❌ buildmaster-cache-key has no usable characters"
          exit 1
        fi
        ARCH="${{ runner.arch }}"
        COMPILER_S="$(sanitize_cache_part "$COMPILER")"
        VERSION_S="$(sanitize_cache_part "${COMPILER_VERSION:-default}")"
        STDLIB_S="$(sanitize_cache_part "${CXX_STDLIB:-default}")"
        TYPE_S="$(sanitize_cache_part "$BUILD_TYPE")"
        LIBC_S="$(sanitize_cache_part "$LIBC")"
        PGO_S="$(sanitize_cache_part "${PGO:-default}")"
        LTO_S="$(sanitize_cache_part "${LTO:-default}")"
        SCOPE_S="$(sanitize_cache_part "$CACHE_SCOPE")"
        JOB_S="$(sanitize_cache_part "$JOB_NAME")"
        KEY_S="${KEY_S}-${{ runner.os }}-${ARCH}-${LIBC_S}-${COMPILER_S}-${VERSION_S}-${STDLIB_S}-${TYPE_S}-pgo-${PGO_S}-lto-${LTO_S}-${JOB_S}"
        if [ -n "$SCOPE_S" ]; then KEY_S="${KEY_S}-${SCOPE_S}"; fi
        IDENTITY="$(cache_identity_hash "${{ runner.os }}" "$ARCH" "$LIBC" "$COMPILER" \
          "$COMPILER_VERSION" "$CXX_STDLIB" "$BUILD_TYPE" "$PGO" "$LTO" "$KEY" "$JOB_NAME" "$CACHE_SCOPE" "cpu=${CPU_FLAGS:-}")"
        KEY_S="${KEY_S}-${IDENTITY}"
        SAVE_KEY="${KEY_S}--${{ github.run_id }}-${{ github.run_attempt }}"
        if [ "${#SAVE_KEY}" -gt 512 ]; then
          echo "::error::Computed BuildMaster cache key exceeds GitHub's 512-character limit"
          exit 1
        fi

        if [ -n "${RUNNER_TEMP:-}" ]; then
          DATADIR="${RUNNER_TEMP}/buildmaster-datadir"
        else
          DATADIR="${{ github.workspace }}/.buildmaster-datadir"
        fi
        mkdir -p "$DATADIR"
        rm -rf "${DATADIR}/tmp"

        echo "datadir=${DATADIR}" >> "$GITHUB_OUTPUT"
        echo "cache_key=${KEY_S}" >> "$GITHUB_OUTPUT"
        echo "save_key=${SAVE_KEY}" >> "$GITHUB_OUTPUT"
        echo "BUILDMASTER_DATADIR=${DATADIR}" >> "$GITHUB_ENV"
        echo "📁 BUILDMASTER_DATADIR=${DATADIR}"
        echo "✅ BuildMaster datadir KEY=${KEY_S}"
        echo "✅ BuildMaster datadir SAVE_KEY=${SAVE_KEY}"

    ###########################################################################
    # 1. INSTALL TOOLCHAIN
    ###########################################################################
    - name: Install toolchain
      id: toolchain
      if: steps.options.outputs.libc != 'musl'
      uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
      with:
        toolchain: ${{ steps.options.outputs.compiler == 'clang' && steps.options.outputs.cxx_stdlib == 'libc++' && 'clang-libc++' || steps.options.outputs.compiler }}
        ccache-key: ${{ steps.options.outputs.compiler_cache_key }}
        version: ${{ steps.options.outputs.compiler_version }}
        docs: ${{ inputs.docs }}
        install-meson: ${{ steps.options.outputs.meson }}

    - name: Install extra host packages
      if: steps.options.outputs.libc != 'musl' && inputs.extra-packages != ''
      uses: stormbytepp/githubactions/.github/actions/install-cached@master
      with:
        packages: ${{ inputs.extra-packages }}
        cache-key: apt-build-extra-v1
        unique: false

    ###########################################################################
    # 1a. CONFIGURE COMPILER CACHE + LAUNCHERS
    ###########################################################################
    - name: Configure compiler cache and launchers
      if: steps.options.outputs.compiler_cache_key != ''
      shell: bash
      run: |
        set -euo pipefail

        echo "⚙️  Configuring compiler cache & launchers..."

        OS="${{ runner.os }}"
        if [ "${{ steps.options.outputs.libc }}" = "musl" ]; then
          echo "ccache will be installed and configured inside Alpine"
          exit 0
        fi

        if [ "$OS" = "Windows" ]; then
          if [ -z "${SCCACHE_DIR:-}" ]; then
            if [ -n "${RUNNER_TEMP:-}" ]; then
              SCCACHE_DIR="${RUNNER_TEMP}/sccache"
            else
              SCCACHE_DIR="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}/Mozilla/sccache/cache"
            fi
          fi
          mkdir -p "$SCCACHE_DIR"
          echo "SCCACHE_DIR=${SCCACHE_DIR}" >> "$GITHUB_ENV"
          echo "SCCACHE_SERVER_PORT=4226" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"

          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

          if command -v sccache >/dev/null 2>&1; then
            echo "✅ sccache on PATH (server starts in compilation steps, dir=${SCCACHE_DIR})"
          else
            echo "::error::sccache not on PATH after install-toolchain"
            exit 1
          fi
        else
          CCACHE_DIR="${RUNNER_TEMP}/ccache"
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          export CCACHE_DIR

          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

          if [ -d /usr/lib/ccache ]; then
            echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          elif [ -d /usr/lib64/ccache ]; then
            echo "/usr/lib64/ccache" >> "$GITHUB_PATH"
          fi

          if command -v ccache >/dev/null 2>&1; then
            ccache -M 2G || true
            ccache -z || true
            echo "✅ ccache ready (dir=${CCACHE_DIR})"
          else
            echo "⚠️  WARNING: ccache not found in PATH after install-toolchain"
          fi
        fi

    ###########################################################################
    # 1b. LLVM LLD + binutils (clang family)
    ###########################################################################
    - name: Setup LLVM linker tools (Linux clang / clang-libc++)
      if: runner.os == 'Linux' && steps.options.outputs.libc == 'glibc' && steps.options.outputs.compiler == 'clang'
      shell: bash
      run: |
        set -euo pipefail

        echo "🔗 Setting up lld + LLVM binutils for clang..."

        VER="${CLANG_VERSION:-}"
        if [ -z "$VER" ]; then
          VER="$(clang --version 2>/dev/null | sed -n 's/.*clang version \([0-9]\+\).*/\1/p' | head -1)"
        fi
        if [ -z "$VER" ]; then
          echo "::error::Could not resolve CLANG_VERSION"
          exit 1
        fi
        echo "CLANG_VERSION=${VER}"

        if ! command -v "ld.lld-${VER}" >/dev/null 2>&1 && ! command -v ld.lld >/dev/null 2>&1; then
          echo "::error::ld.lld not found (install-toolchain should provide lld-${VER})"
          exit 1
        fi

        LLD="$(command -v ld.lld-${VER} 2>/dev/null || command -v ld.lld)"
        AR="$(command -v llvm-ar-${VER} 2>/dev/null || command -v llvm-ar || true)"
        RANLIB="$(command -v llvm-ranlib-${VER} 2>/dev/null || command -v llvm-ranlib || true)"
        NM="$(command -v llvm-nm-${VER} 2>/dev/null || command -v llvm-nm || true)"

        echo "ld.lld:  ${LLD}"
        "$LLD" --version 2>/dev/null | head -1 || true
        echo "llvm-ar: ${AR:-<missing>}"

        {
          echo "LDFLAGS=-fuse-ld=lld"
          echo "CMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=lld"
          echo "CMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=lld"
          echo "CMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=lld"
          echo "CMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
          echo "CMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld"
          echo "CMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld"
        } >> "$GITHUB_ENV"

        if [ -n "$AR" ]; then
          echo "AR=${AR}" >> "$GITHUB_ENV"
          echo "CMAKE_AR=${AR}" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_AR=${AR}" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_AR=${AR}" >> "$GITHUB_ENV"
        else
          echo "::warning::llvm-ar not found; LTO static libs may hit bfd/gold mismatch"
        fi
        if [ -n "$RANLIB" ]; then
          echo "RANLIB=${RANLIB}" >> "$GITHUB_ENV"
          echo "CMAKE_RANLIB=${RANLIB}" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_RANLIB=${RANLIB}" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_RANLIB=${RANLIB}" >> "$GITHUB_ENV"
        fi
        if [ -n "$NM" ]; then
          echo "NM=${NM}" >> "$GITHUB_ENV"
          echo "CMAKE_NM=${NM}" >> "$GITHUB_ENV"
        fi

        echo "CC=$(command -v clang-${VER} 2>/dev/null || command -v clang)" >> "$GITHUB_ENV"
        echo "CXX=$(command -v clang++-${VER} 2>/dev/null || command -v clang++)" >> "$GITHUB_ENV"

        echo "✅ Linux Clang: -fuse-ld=lld + LLVM binutils"

    - name: Setup LLVM linker tools (Windows clang-cl)
      if: runner.os == 'Windows' && steps.options.outputs.compiler == 'clang-cl'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "🔗 Setting up lld-link + llvm-lib/llvm-ar for clang-cl (IPO)..."

        function Require-Cmd([string]$Name) {
          $cmd = Get-Command $Name -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Error "$Name not on PATH (install-toolchain should provide LLVM tools)"
            exit 1
          }
          return $cmd.Source
        }

        $lld  = Require-Cmd "lld-link.exe"
        $lib  = Require-Cmd "llvm-lib.exe"
        $ar   = Require-Cmd "llvm-ar.exe"
        $ranlib = $null
        $rn = Get-Command "llvm-ranlib.exe" -ErrorAction SilentlyContinue
        if ($rn) { $ranlib = $rn.Source }

        $lldC  = ($lld  -replace '\\', '/')
        $libC  = ($lib  -replace '\\', '/')
        $arC   = ($ar   -replace '\\', '/')

        $binDir = Split-Path -Parent $lld
        $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:Path = "$binDir;$env:Path"

        Write-Host "lld-link : $lldC"
        Write-Host "llvm-lib : $libC"
        Write-Host "llvm-ar  : $arC"
        if ($ranlib) { Write-Host "llvm-ranlib: $($ranlib -replace '\\','/')" }

        @(
          "CMAKE_LINKER=$lldC",
          "CMAKE_C_COMPILER_LINKER=$lldC",
          "CMAKE_CXX_COMPILER_LINKER=$lldC",
          "CMAKE_AR=$libC",
          "CMAKE_C_COMPILER_AR=$libC",
          "CMAKE_CXX_COMPILER_AR=$libC",
          "AR=$arC"
        ) | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }

        if ($ranlib) {
          $rnC = ($ranlib -replace '\\', '/')
          @(
            "CMAKE_RANLIB=$rnC",
            "CMAKE_C_COMPILER_RANLIB=$rnC",
            "CMAKE_CXX_COMPILER_RANLIB=$rnC",
            "RANLIB=$rnC"
          ) | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
        }

        & $lld --version 2>&1 | Select-Object -First 2
        Write-Host "✅ Windows clang-cl: lld-link + llvm-lib (LTO/static OK)"

    ###########################################################################
    # 1c. RESTORE COMPILER CACHE
    ###########################################################################
    - name: Restore ccache
      id: restore-ccache
      if: steps.options.outputs.compiler_cache_key != '' && (runner.os == 'Linux' || runner.os == 'macOS')
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}
        restore-keys: |
          ${{ steps.cachekeys.outputs.cache_key }}--${{ github.run_id }}-
          ${{ steps.cachekeys.outputs.cache_key }}--

    - name: Restore sccache
      id: restore-sccache
      if: steps.options.outputs.compiler_cache_key != '' && runner.os == 'Windows'
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}
        restore-keys: |
          ${{ steps.cachekeys.outputs.cache_key }}--${{ github.run_id }}-
          ${{ steps.cachekeys.outputs.cache_key }}--

    ###########################################################################
    # 1d. RESTORE + PREPARE DOWNLOADS CACHE
    ###########################################################################
    - name: Restore BuildMaster data directory
      id: restore-buildmaster
      if: steps.options.outputs.buildmaster_cache_key != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.buildmaster.outputs.datadir }}/downloads
        key: ${{ steps.buildmaster.outputs.save_key }}
        restore-keys: |
          ${{ steps.buildmaster.outputs.cache_key }}--${{ github.run_id }}-
          ${{ steps.buildmaster.outputs.cache_key }}--

    - name: Ensure BuildMaster data directory exists
      if: steps.options.outputs.buildmaster_cache_key != ''
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ steps.buildmaster.outputs.datadir }}"
        rm -rf "${{ steps.buildmaster.outputs.datadir }}/tmp"
        echo "📁 BUILDMASTER_DATADIR=${{ steps.buildmaster.outputs.datadir }}"

    ###########################################################################
    # 1e. WINDOWS PATH: linker first; GNU/Git deferred to end (gzip/tar still work)
    ###########################################################################
    - name: Sanitize Windows PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $toolchain = "${{ steps.options.outputs.compiler }}"

        Write-Host "🧹 Sanitizing Windows PATH (toolchain=$toolchain)..."

        $gnuPathFragments = @(
          'Git\usr\bin', 'Git\mingw64\bin', 'Git\mingw32\bin',
          'Strawberry\c\bin', 'Strawberry\c\x86_64-w64-mingw32',
          'msys64\usr\bin', 'msys64\mingw64\bin', 'cygwin64\bin',
          'mingw64\bin', 'mingw32\bin'
        )

        function Split-PathList([string]$pathValue) {
          $list = [System.Collections.Generic.List[string]]::new()
          if ([string]::IsNullOrWhiteSpace($pathValue)) { return $list }
          foreach ($p in ($pathValue -split ';')) {
            if (-not [string]::IsNullOrWhiteSpace($p)) {
              $list.Add($p.Trim().TrimEnd('\'))
            }
          }
          return $list
        }

        function Test-GnuShadow([string]$p) {
          foreach ($frag in $gnuPathFragments) {
            if ($p -like "*$frag*") { return $true }
          }
          return $false
        }

        function Add-Unique([System.Collections.Generic.List[string]]$list, [string]$item) {
          if ([string]::IsNullOrWhiteSpace($item)) { return }
          if (-not ($list -contains $item)) { $list.Add($item) }
        }

        $kept = [System.Collections.Generic.List[string]]::new()
        $deferred = [System.Collections.Generic.List[string]]::new()

        foreach ($p in (Split-PathList $env:Path)) {
          if (Test-GnuShadow $p) {
            Write-Host "PATH: defer GNU shadow to end: $p"
            Add-Unique $deferred $p
          } else {
            Add-Unique $kept $p
          }
        }

        $prefix = [System.Collections.Generic.List[string]]::new()
        if ($toolchain -eq "msvc") {
          $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
          if ($null -eq $linkCmd) {
            Write-Error "link.exe not found (msvc-dev-cmd missing?)"
            exit 1
          }
          if ($linkCmd.Source -notmatch '(?i)[\\/]MSVC[\\/]|HostX64|Hostx64|Visual Studio') {
            Write-Error "link.exe does not look like MSVC: $($linkCmd.Source)"
            exit 1
          }
          $linkDir = (Split-Path -Parent $linkCmd.Source).TrimEnd('\')
          Add-Unique $prefix $linkDir
          $linkDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "MSVC link.exe first: $($linkCmd.Source)"
        } else {
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if ($lld) {
            $lldDir = (Split-Path -Parent $lld.Source).TrimEnd('\')
            Add-Unique $prefix $lldDir
            $lldDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "lld-link first: $($lld.Source)"
          }
        }

        $newParts = [System.Collections.Generic.List[string]]::new()
        foreach ($p in $prefix)   { Add-Unique $newParts $p }
        foreach ($p in $kept)     { Add-Unique $newParts $p }
        foreach ($p in $deferred) { Add-Unique $newParts $p }

        $env:Path = ($newParts -join ';')

        if ($env:__VSCMD_PREINIT_PATH) {
          $preKept = [System.Collections.Generic.List[string]]::new()
          $preDef  = [System.Collections.Generic.List[string]]::new()
          foreach ($p in (Split-PathList $env:__VSCMD_PREINIT_PATH)) {
            if (Test-GnuShadow $p) { Add-Unique $preDef $p } else { Add-Unique $preKept $p }
          }
          $preNew = (@($preKept) + @($preDef)) -join ';'
          $env:__VSCMD_PREINIT_PATH = $preNew
          "__VSCMD_PREINIT_PATH=$preNew" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }

        "PATH=$($env:Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "✅ PATH sanitized (linker first; GNU/Git tools at end for gzip/tar/git)"

    ###########################################################################
    # 2. CONFIGURE
    ###########################################################################
    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows' && steps.options.outputs.libc != 'musl'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CMAKE_OPTIONS: ${{ steps.options.outputs.cmake_options }}
        COMPILER: ${{ steps.options.outputs.compiler }}
        PGO: ${{ steps.options.outputs.pgo }}
        LTO: ${{ steps.options.outputs.lto }}
        INSTALL_PREFIX: ${{ steps.options.outputs.install_prefix }}
        CXX_STDLIB: ${{ steps.options.outputs.cxx_stdlib }}
        CPU_FLAGS: ${{ steps.options.outputs.cpu_flags }}
        CC: ${{ steps.toolchain.outputs.c_compiler }}
        CXX: ${{ steps.toolchain.outputs.cxx_compiler }}
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🔧 Configuring CMake (Linux/macOS)"
        echo "   Source dir : ${{ inputs.source-dir }}"
        echo "   Build type : ${{ inputs.build-type }}"
        echo "   Build dir  : ${{ inputs.build-dir }}"
        echo "   Compiler   : ${{ steps.options.outputs.compiler }}"
        echo "────────────────────────────────────────────────────────"

        LAUNCHER_ARGS=()
        if [ -n "${{ steps.options.outputs.compiler_cache_key }}" ] && command -v ccache >/dev/null 2>&1; then
          export CCACHE_DIR="${CCACHE_DIR:-${RUNNER_TEMP}/ccache}"
          mkdir -p "${CCACHE_DIR}"
          LAUNCHER_ARGS+=(
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          )
          echo "📦 Using ccache launcher (dir=${CCACHE_DIR})"
        fi

        LINKER_ARGS=()
        if [ "${{ runner.os }}" = "Linux" ]; then
          if [ "${{ steps.options.outputs.compiler }}" = clang ]; then
            LINKER_ARGS+=(
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld
              -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld
            )
            if [ -n "${CMAKE_AR:-}" ]; then LINKER_ARGS+=("-DCMAKE_AR=${CMAKE_AR}"); fi
            echo "🔗 Using lld for clang"
          fi
        fi

        BM_ARGS=()
        if [ -n "${BUILDMASTER_DATADIR:-}" ]; then
          BM_ARGS+=("-DBUILDMASTER_DATADIR=${BUILDMASTER_DATADIR}")
          echo "📁 BUILDMASTER_DATADIR=${BUILDMASTER_DATADIR}"
        fi

        source "$ACTION_PATH/configure-common.sh"
        prepare_cmake_options

        cmake -S "${{ inputs.source-dir }}" -B "${{ inputs.build-dir }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
          -DCMAKE_C_COMPILER="${{ steps.toolchain.outputs.c_compiler }}" \
          -DCMAKE_CXX_COMPILER="${{ steps.toolchain.outputs.cxx_compiler }}" \
          ${LAUNCHER_ARGS[@]+"${LAUNCHER_ARGS[@]}"} \
          ${LINKER_ARGS[@]+"${LINKER_ARGS[@]}"} \
          ${BM_ARGS[@]+"${BM_ARGS[@]}"} \
          ${CONFIGURE_ARGS[@]+"${CONFIGURE_ARGS[@]}"}

        echo "✅ CMake configure finished"

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIGURE_OPTIONS: ${{ steps.options.outputs.cmake_options }}
        PGO: ${{ steps.options.outputs.pgo }}
        LTO: ${{ steps.options.outputs.lto }}
        CPU_FLAGS: ${{ steps.options.outputs.cpu_flags }}
        INSTALL_PREFIX: ${{ steps.options.outputs.install_prefix }}
        CC: ${{ steps.toolchain.outputs.c_compiler }}
        CXX: ${{ steps.toolchain.outputs.cxx_compiler }}
      run: |
        $ErrorActionPreference = "Stop"
        $toolchain = "${{ steps.options.outputs.compiler }}"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "🔧 Configuring CMake (Windows)"
        Write-Host "   Source dir : ${{ inputs.source-dir }}"
        Write-Host "   Build type : ${{ inputs.build-type }}"
        Write-Host "   Build dir  : ${{ inputs.build-dir }}"
        Write-Host "   Toolchain  : $toolchain"
        Write-Host "────────────────────────────────────────────────────────"

        $cCompiler = "${{ steps.toolchain.outputs.c_compiler }}"
        $cxxCompiler = "${{ steps.toolchain.outputs.cxx_compiler }}"
        if ([string]::IsNullOrWhiteSpace($cCompiler))  { $cCompiler = "cl" }
        if ([string]::IsNullOrWhiteSpace($cxxCompiler)) { $cxxCompiler = "cl" }

        $cmakeArgs = [System.Collections.Generic.List[string]]::new()
        foreach ($a in @(
          "-S", "${{ inputs.source-dir }}",
          "-B", "${{ inputs.build-dir }}",
          "-G", "Ninja",
          "-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}",
          "-DCMAKE_C_COMPILER=$cCompiler",
          "-DCMAKE_CXX_COMPILER=$cxxCompiler"
        )) {
          $cmakeArgs.Add($a)
        }

        $extraArgs = [System.Collections.Generic.List[string]]::new()
        if (-not [string]::IsNullOrWhiteSpace($env:CONFIGURE_OPTIONS)) {
          $parser = Join-Path $env:ACTION_PATH "parse-windows-arguments.py"
          $json = & python $parser $env:CONFIGURE_OPTIONS "cmake-options"
          if ($LASTEXITCODE -ne 0) { throw "Invalid cmake-options" }
          $pendingDefinition = $false
          foreach ($arg in (ConvertFrom-Json -InputObject ($json -join "`n") -NoEnumerate)) {
            if ($pendingDefinition) {
              $extraArgs.Add("-D$arg")
              $pendingDefinition = $false
            } elseif ($arg -eq "-D") {
              $pendingDefinition = $true
            } else {
              $extraArgs.Add([string]$arg)
            }
          }
          if ($pendingDefinition) { $extraArgs.Add("-D") }
        }

        foreach ($setting in @("PGO", "LTO")) {
          $value = [Environment]::GetEnvironmentVariable($setting)
          if ([string]::IsNullOrWhiteSpace($value)) { continue }
          $desired = if ($value -eq "true") { "ON" } else { "OFF" }
          $option = "ENABLE_$setting"
          $present = $false
          $existing = ""
          foreach ($arg in $extraArgs) {
            if ($arg -match "^-D$option(?::[A-Za-z]+)?=(.*)$") {
              $existing = $Matches[1]
              $present = $true
            }
          }
          if ($present) {
            $normalized = $existing.ToUpperInvariant()
            switch -Regex ($normalized) {
              '^(1|ON|YES|TRUE|Y)$' { $actual = $true; break }
              '^(0|OFF|NO|FALSE|N|IGNORE|NOTFOUND|.*-NOTFOUND|)$' { $actual = $false; break }
              default { throw "$option in cmake-options is not a recognized boolean: $existing" }
            }
            if ($actual -ne ($value -eq "true")) {
              throw "$option in cmake-options conflicts with $($setting.ToLowerInvariant())=$value"
            }
          } else {
            $cmakeArgs.Add("-D$option=$desired")
          }
        }

        # CMake prepends CFLAGS/CXXFLAGS to its MSVC defaults (/DWIN32 /EHsc ...),
        # so the baseline goes through the environment unless -DCMAKE_<LANG>_FLAGS overrides it.
        if (-not [string]::IsNullOrWhiteSpace($env:CPU_FLAGS)) {
          $cpuPattern = '(^|\s)(-march=|-mcpu=|[/-]arch:)'
          $cpuSource = $null
          if ("$env:CFLAGS" -match $cpuPattern) { $cpuSource = "CFLAGS" }
          elseif ("$env:CXXFLAGS" -match $cpuPattern) { $cpuSource = "CXXFLAGS" }
          else {
            foreach ($arg in $extraArgs) {
              if ($arg -match '^-D(CMAKE_(?:C|CXX)_FLAGS(?:_[A-Za-z]+)?)(?::[^=]+)?=(.*)$' -and $Matches[2] -match $cpuPattern) {
                $cpuSource = $Matches[1]
                break
              }
            }
          }
          if ($cpuSource) {
            Write-Host "::warning::$cpuSource already selects a target CPU; cpu-baseline ($env:CPU_FLAGS) was not applied"
          } else {
            foreach ($name in @("CFLAGS", "CXXFLAGS")) {
              $current = [Environment]::GetEnvironmentVariable($name)
              $merged = if ([string]::IsNullOrWhiteSpace($current)) { $env:CPU_FLAGS } else { "$current $($env:CPU_FLAGS)" }
              [Environment]::SetEnvironmentVariable($name, $merged)
            }
            for ($i = 0; $i -lt $extraArgs.Count; $i++) {
              if ($extraArgs[$i] -match '^-DCMAKE_(?:C|CXX)_FLAGS(?::[^=]+)?=(.*)$') {
                $extraArgs[$i] = if ($Matches[1] -eq "") { "$($extraArgs[$i])$($env:CPU_FLAGS)" } else { "$($extraArgs[$i]) $($env:CPU_FLAGS)" }
              }
            }
            Write-Host "🎯 CPU baseline: $env:CPU_FLAGS"
          }
        }

        $mtCmd = Get-Command mt.exe -ErrorAction SilentlyContinue
        $mtExe = if ($mtCmd) { ($mtCmd.Source -replace '\\', '/') } else { "mt" }
        $cmakeArgs.Add("-DCMAKE_MT=$mtExe")

        if ($toolchain -eq "clang-cl") {
          $lldCmd = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if (-not $lldCmd) {
            Write-Error "lld-link.exe not found"
            exit 1
          }
          $lldExe = ($lldCmd.Source -replace '\\', '/')
          $libCmd = Get-Command llvm-lib.exe -ErrorAction SilentlyContinue
          $libExe = if ($libCmd) { ($libCmd.Source -replace '\\', '/') } else { "llvm-lib" }

          Write-Host "   C compiler  : $cCompiler"
          Write-Host "   CXX compiler: $cxxCompiler"
          Write-Host "   Linker      : $lldExe (LLD)"
          Write-Host "   mt          : $mtExe"

          $cmakeArgs.Add("-DCMAKE_LINKER_TYPE=LLD")
          $cmakeArgs.Add("-DCMAKE_LINKER=$lldExe")
          $cmakeArgs.Add("-DCMAKE_C_COMPILER_LINKER=$lldExe")
          $cmakeArgs.Add("-DCMAKE_CXX_COMPILER_LINKER=$lldExe")
          $cmakeArgs.Add("-DCMAKE_AR=$libExe")
          $cmakeArgs.Add("-DCMAKE_C_COMPILER_AR=$libExe")
          $cmakeArgs.Add("-DCMAKE_CXX_COMPILER_AR=$libExe")
        } else {
          $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
          if ($null -eq $linkCmd) {
            Write-Error "link.exe not found (msvc-dev-cmd required)"
            exit 1
          }
          if ($linkCmd.Source -notmatch '(?i)[\\/]MSVC[\\/]|HostX64|Hostx64|Visual Studio') {
            Write-Error "link.exe does not look like MSVC: $($linkCmd.Source)"
            exit 1
          }
          $linkExe = ($linkCmd.Source -replace '\\', '/')

          Write-Host "   C compiler  : $cCompiler"
          Write-Host "   CXX compiler: $cxxCompiler"
          Write-Host "   Linker      : $linkExe (MSVC)"
          Write-Host "   mt          : $mtExe"

          $cmakeArgs.Add("-DCMAKE_LINKER_TYPE=MSVC")
          $cmakeArgs.Add("-DCMAKE_LINKER=$linkExe")
          $cmakeArgs.Add("-DCMAKE_C_COMPILER_LINKER=$linkExe")
          $cmakeArgs.Add("-DCMAKE_CXX_COMPILER_LINKER=$linkExe")
        }

        if ($env:BUILDMASTER_DATADIR) {
          $bmDir = ($env:BUILDMASTER_DATADIR -replace '\\', '/')
          Write-Host "BUILDMASTER_DATADIR=$bmDir"
          $cmakeArgs.Add("-DBUILDMASTER_DATADIR=$bmDir")
        }

        $bt = "${{ inputs.build-type }}".ToLowerInvariant()
        if ($bt -eq "debug" -or $bt -eq "relwithdebinfo") {
          Write-Host "Debug ${bt}: Embedded (/Z7) for sccache"
          $cmakeArgs.Add("-DCMAKE_POLICY_DEFAULT_CMP0141=NEW")
          $cmakeArgs.Add("-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded")
        } else {
          Write-Host "Release ${bt}: no debug information flags"
        }

        if ("${{ steps.options.outputs.compiler_cache_key }}" -ne "" -and (Get-Command sccache -ErrorAction SilentlyContinue)) {
          Write-Host "Using sccache launcher"
          $cmakeArgs.Add("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
          $cmakeArgs.Add("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")

          if (-not $env:SCCACHE_DIR -or $env:SCCACHE_DIR -eq "") {
            if ($env:RUNNER_TEMP) {
              $env:SCCACHE_DIR = Join-Path $env:RUNNER_TEMP "sccache"
            } else {
              $env:SCCACHE_DIR = Join-Path $env:LOCALAPPDATA "Mozilla\sccache\cache"
            }
          }
          New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null
          "SCCACHE_DIR=$($env:SCCACHE_DIR)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SCCACHE_DIR=$($env:SCCACHE_DIR)"
        } else {
          Write-Host "sccache launcher disabled"
        }

        foreach ($arg in $extraArgs) { $cmakeArgs.Add($arg) }
        if (-not [string]::IsNullOrWhiteSpace($env:INSTALL_PREFIX)) {
          $cmakeArgs.Add("-DCMAKE_INSTALL_PREFIX=$($env:INSTALL_PREFIX)")
        }

        Write-Host "Running: cmake $($cmakeArgs -join ' ')"
        if ("${{ steps.options.outputs.compiler_cache_key }}" -ne "") {
          & "${{ github.action_path }}/start-sccache.ps1"
        }
        try {
          & cmake @($cmakeArgs.ToArray())
          $configureExitCode = $LASTEXITCODE
        } finally {
          if ("${{ steps.options.outputs.compiler_cache_key }}" -ne "") {
            $stopOutput = & sccache --stop-server 2>&1
            if ($LASTEXITCODE -ne 0) {
              $stopOutput | ForEach-Object { Write-Host $_ }
              throw "Could not stop sccache after configure"
            }
          }
        }
        if ($configureExitCode -ne 0) { exit $configureExitCode }

        Write-Host "CMake configure finished"

    ###########################################################################
    # 3. BUILD
    ###########################################################################
    - name: Build (Windows)
      id: build-windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $toolchain = "${{ steps.options.outputs.compiler }}"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "🏗️  Building with Ninja (Windows)"
        Write-Host "────────────────────────────────────────────────────────"

        $gnuPathFragments = @(
          'Git\usr\bin', 'Git\mingw64\bin', 'Git\mingw32\bin',
          'Strawberry\c\bin', 'Strawberry\c\x86_64-w64-mingw32',
          'msys64\usr\bin', 'msys64\mingw64\bin', 'cygwin64\bin',
          'mingw64\bin', 'mingw32\bin'
        )

        function Split-PathList([string]$pathValue) {
          $list = [System.Collections.Generic.List[string]]::new()
          if ([string]::IsNullOrWhiteSpace($pathValue)) { return $list }
          foreach ($p in ($pathValue -split ';')) {
            if (-not [string]::IsNullOrWhiteSpace($p)) {
              $list.Add($p.Trim().TrimEnd('\'))
            }
          }
          return $list
        }

        function Test-GnuShadow([string]$p) {
          foreach ($frag in $gnuPathFragments) {
            if ($p -like "*$frag*") { return $true }
          }
          return $false
        }

        function Add-Unique([System.Collections.Generic.List[string]]$list, [string]$item) {
          if ([string]::IsNullOrWhiteSpace($item)) { return }
          if (-not ($list -contains $item)) { $list.Add($item) }
        }

        $kept = [System.Collections.Generic.List[string]]::new()
        $deferred = [System.Collections.Generic.List[string]]::new()
        foreach ($p in (Split-PathList $env:Path)) {
          if (Test-GnuShadow $p) { Add-Unique $deferred $p } else { Add-Unique $kept $p }
        }

        $prefix = [System.Collections.Generic.List[string]]::new()
        if ($toolchain -eq "msvc") {
          $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
          if ($null -eq $linkCmd) {
            Write-Error "link.exe not found before build"
            exit 1
          }
          Add-Unique $prefix ((Split-Path -Parent $linkCmd.Source).TrimEnd('\'))
        } else {
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if ($lld) {
            Add-Unique $prefix ((Split-Path -Parent $lld.Source).TrimEnd('\'))
          }
        }

        $newParts = [System.Collections.Generic.List[string]]::new()
        foreach ($p in $prefix)   { Add-Unique $newParts $p }
        foreach ($p in $kept)     { Add-Unique $newParts $p }
        foreach ($p in $deferred) { Add-Unique $newParts $p }
        $env:Path = ($newParts -join ';')

        if ($env:__VSCMD_PREINIT_PATH) {
          $preKept = [System.Collections.Generic.List[string]]::new()
          $preDef  = [System.Collections.Generic.List[string]]::new()
          foreach ($p in (Split-PathList $env:__VSCMD_PREINIT_PATH)) {
            if (Test-GnuShadow $p) { Add-Unique $preDef $p } else { Add-Unique $preKept $p }
          }
          $env:__VSCMD_PREINIT_PATH = (@($preKept) + @($preDef)) -join ';'
        }

        $jobs = [Environment]::ProcessorCount
        if ($jobs -lt 1) { $jobs = 4 }

        if ("${{ steps.options.outputs.compiler_cache_key }}" -ne "") {
          & "${{ github.action_path }}/start-sccache.ps1"
        }

        $target = "${{ steps.options.outputs.build_target }}"
        Write-Host "🚀 Starting build with $jobs jobs..."
        try {
          if ($target -ne "") {
            Write-Host "   Target: $target"
            ninja -C "${{ inputs.build-dir }}" -j $jobs $target
          } else {
            Write-Host "   Target: all"
            ninja -C "${{ inputs.build-dir }}" -j $jobs
          }
          $buildExitCode = $LASTEXITCODE
        } finally {
          if ("${{ steps.options.outputs.compiler_cache_key }}" -ne "") {
            try {
              Write-Host "sccache statistics for this build (before tests):"
              & sccache --show-stats
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::warning::Could not read sccache build statistics"
              }
            } finally {
              # Flush before Windows can terminate the compiling step's children.
              $stopOutput = & sccache --stop-server 2>&1
              if ($LASTEXITCODE -ne 0) {
                $stopOutput | ForEach-Object { Write-Host $_ }
                throw "Could not flush sccache; compiler cache will not be saved"
              }
              "sccache-ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }
        }
        if ($buildExitCode -ne 0) { exit $buildExitCode }

        Write-Host "✅ Build finished successfully"

    - name: Build in Alpine (musl)
      id: build-musl
      if: runner.os == 'Linux' && steps.options.outputs.libc == 'musl'
      shell: bash
      env:
        DOCKER_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        HOST_ARCH: ${{ runner.arch }}
        ACTION_PATH: ${{ github.action_path }}
        COMPILER: ${{ steps.options.outputs.compiler }}
        COMPILER_VERSION: ${{ steps.options.outputs.compiler_version }}
        CXX_STDLIB: ${{ steps.options.outputs.cxx_stdlib }}
        CMAKE_OPTIONS: ${{ steps.options.outputs.cmake_options }}
        BUILD_TYPE: ${{ inputs.build-type }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        BUILD_DIR: ${{ inputs.build-dir }}
        BUILD_TARGET: ${{ steps.options.outputs.build_target }}
        CTEST_ENABLED: ${{ steps.options.outputs.ctest }}
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
        INSTALL_ENABLED: ${{ inputs.install }}
        INSTALL_PREFIX: ${{ steps.options.outputs.install_prefix }}
        DEPLOY: ${{ steps.options.outputs.deploy }}
        PGO: ${{ steps.options.outputs.pgo }}
        LTO: ${{ steps.options.outputs.lto }}
        CPU_FLAGS: ${{ steps.options.outputs.cpu_flags }}
        DOCS: ${{ inputs.docs }}
        MESON: ${{ steps.options.outputs.meson }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        CONTAINER_ENV: ${{ inputs.container-env }}
        CACHE_ENABLED: ${{ steps.options.outputs.compiler_cache_key != '' }}
        BUILDMASTER_DATADIR: ${{ steps.buildmaster.outputs.datadir || env.BUILDMASTER_DATADIR }}
      run: |
        set -euo pipefail

        if ! command -v docker >/dev/null 2>&1; then
          echo "::error::Docker is required to build with libc=musl"
          exit 1
        fi
        case "$HOST_ARCH" in
          X64|ARM64) ;;
          *) echo "::error::Alpine builds require a native X64 or ARM64 runner"; exit 1 ;;
        esac

        if [[ -n "$COMPILER_VERSION" ]]; then
          expected=15
          [[ "$COMPILER" == clang ]] && expected=22
          if [[ "$COMPILER_VERSION" != "$expected" ]]; then
            echo "::error::Alpine 3.24 provides gcc ${expected} or clang 22; compiler-version=${COMPILER_VERSION} is unavailable"
            exit 1
          fi
        else
          [[ "$COMPILER" == gcc ]] && COMPILER_VERSION=15 || COMPILER_VERSION=22
        fi

        cd "$GITHUB_WORKSPACE"
        prefix_to_check=""
        if [[ "$INSTALL_ENABLED" == true || "$DEPLOY" == true ]]; then
          prefix_to_check="$INSTALL_PREFIX"
        fi
        python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$SOURCE_DIR" "$BUILD_DIR" "$prefix_to_check" "$BUILDMASTER_DATADIR" <<'PY'
        from pathlib import Path
        import sys

        roots = [Path(path).resolve() for path in sys.argv[1:3]]
        for label, raw in zip(("source-dir", "build-dir", "install-prefix", "BUILDMASTER_DATADIR"), sys.argv[3:]):
            if not raw:
                continue
            path = Path(raw).resolve()
            if not any(path == root or root in path.parents for root in roots):
                print(f"::error::{label} must be inside the workspace or runner temp for an Alpine build: {raw}", file=sys.stderr)
                sys.exit(1)
        PY

        CACHEDIR="${CCACHE_DIR:-${RUNNER_TEMP}/ccache}"
        ALPINE_HOME="${RUNNER_TEMP}/alpine-home"
        mkdir -p "$CACHEDIR" "$ALPINE_HOME"
        if [[ -n "$BUILDMASTER_DATADIR" ]]; then
          mkdir -p "$BUILDMASTER_DATADIR/downloads"
          rm -rf "$BUILDMASTER_DATADIR/tmp"
        fi

        docker_env=()
        for name in CI GITHUB_ACTIONS LD_LIBRARY_PATH \
          POSTGRES_USER POSTGRES_PASSWORD POSTGRES_PORT \
          MARIADB_USER MARIADB_PASSWORD MARIADB_PORT \
          MSSQL_HOST MSSQL_USER MSSQL_PASSWORD MSSQL_DATABASE MSSQL_PORT; do
          if printenv "$name" >/dev/null; then docker_env+=(-e "$name"); fi
        done
        read -r -a requested_env <<< "${CONTAINER_ENV//$'\n'/ }"
        for name in "${requested_env[@]}"; do
          if [[ ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::container-env must contain environment variable names, not values: $name"
            exit 1
          fi
          case "$name" in
            ACTION_PATH|BUILDMASTER_DATADIR|BUILD_DIR|BUILD_GID|BUILD_TARGET|BUILD_TYPE|BUILD_UID|CACHE_ENABLED|CCACHE_DIR|CMAKE_OPTIONS|COMPILER|COMPILER_VERSION|CONTAINER_ENV|CPU_FLAGS|CTEST_ENABLED|CTEST_OPTIONS|CXX_STDLIB|DEPLOY|DOCS|EXTRA_PACKAGES|GITHUB_WORKSPACE|HOME|INSTALL_ENABLED|INSTALL_PREFIX|LTO|MESON|PATH|PGO|RUNNER_TEMP|SOURCE_DIR)
              echo "::error::container-env cannot override the action's $name setting"
              exit 1
              ;;
          esac
          if ! printenv "$name" >/dev/null; then
            echo "::error::Requested container environment variable is not set: $name"
            exit 1
          fi
          docker_env+=(-e "$name")
        done
        BUILD_UID="$(id -u)"
        BUILD_GID="$(id -g)"
        export BUILD_UID BUILD_GID

        docker run --rm -i \
          --network host \
          --platform "linux/${DOCKER_ARCH}" \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
          -v "${ACTION_PATH}:${ACTION_PATH}:ro" \
          -w "$GITHUB_WORKSPACE" \
          -e ACTION_PATH -e BUILD_UID -e BUILD_GID -e HOME="$ALPINE_HOME" \
          -e COMPILER -e COMPILER_VERSION -e CXX_STDLIB \
          -e CMAKE_OPTIONS -e BUILD_TYPE -e SOURCE_DIR -e BUILD_DIR \
          -e BUILD_TARGET -e CTEST_ENABLED -e CTEST_OPTIONS \
          -e INSTALL_ENABLED -e INSTALL_PREFIX -e DEPLOY -e PGO -e LTO -e CPU_FLAGS \
          -e DOCS -e MESON -e EXTRA_PACKAGES -e CACHE_ENABLED -e CCACHE_DIR="$CACHEDIR" \
          -e BUILDMASTER_DATADIR -e RUNNER_TEMP -e GITHUB_WORKSPACE \
          "${docker_env[@]}" \
          alpine:3.24 /bin/sh -eu -c '
            packages="bash build-base cmake pkgconf ca-certificates curl git zip unzip tar xz python3 py3-pip autoconf automake libtool perl openssl nasm yasm linux-headers bison flex su-exec jemalloc"
            [ "$COMPILER" != clang ] || packages="$packages clang22 clang22-extra-tools lld22 llvm22 compiler-rt"
            [ "$CXX_STDLIB" != libc++ ] || packages="$packages libc++-dev libc++-static llvm-libunwind-dev"
            [ "$CACHE_ENABLED" != true ] || packages="$packages ccache"
            [ "$DOCS" != true ] || packages="$packages doxygen graphviz"
            set -f
            set -- $packages
            for package in $EXTRA_PACKAGES; do
              case "$package" in
                -*) echo "::error::Invalid extra package name: $package" >&2; exit 1 ;;
              esac
              set -- "$@" "$package"
            done
            apk add --no-cache "$@"
            set -- ninja
            if [ "$MESON" = true ]; then
              set -- "$@" meson
            fi
            python3 -m pip install --break-system-packages --no-cache-dir "$@"
            exec su-exec "$BUILD_UID:$BUILD_GID" /bin/bash -euo pipefail
          ' <<'ALPINE_BUILD_SCRIPT'
            if [[ "$COMPILER" == clang ]]; then
              export PATH="/usr/lib/llvm22/bin:$PATH"
              C_COMPILER=clang-22
              CXX_COMPILER=clang++-22
              LINKER_ARGS=(-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
                -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld
                -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld
                "-DCMAKE_AR=$(command -v llvm-ar)"
                "-DCMAKE_RANLIB=$(command -v llvm-ranlib)")
            else
              C_COMPILER=gcc
              CXX_COMPILER=g++
              LINKER_ARGS=()
            fi
            export CC="$C_COMPILER" CXX="$CXX_COMPILER"
            cmake_args=(-S "$SOURCE_DIR" -B "$BUILD_DIR" -G Ninja
              "-DCMAKE_BUILD_TYPE=$BUILD_TYPE"
              "-DCMAKE_C_COMPILER=$C_COMPILER"
              "-DCMAKE_CXX_COMPILER=$CXX_COMPILER")
            cmake_args+=("${LINKER_ARGS[@]}")
            if [[ -n "$BUILDMASTER_DATADIR" ]]; then cmake_args+=("-DBUILDMASTER_DATADIR=$BUILDMASTER_DATADIR"); fi
            if [[ "$CACHE_ENABLED" == true ]]; then
              cmake_args+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            fi
            source "$ACTION_PATH/configure-common.sh"
            prepare_cmake_options
            cmake_args+=("${CONFIGURE_ARGS[@]}")
            # musl's allocator returns memory to the kernel so eagerly that compilers spend
            # much of their time page-faulting, which is especially costly on x86-64 VMs.
            # Tests and installation keep the native allocator.
            BUILD_ALLOCATOR=/usr/lib/libjemalloc.so.2
            LD_PRELOAD="$BUILD_ALLOCATOR" cmake "${cmake_args[@]}"

            if [[ "$INSTALL_ENABLED" == true || "$DEPLOY" == true ]]; then
              configured_prefix="$INSTALL_PREFIX"
              if [[ -z "$configured_prefix" ]]; then
                configured_prefix="$(sed -n 's/^CMAKE_INSTALL_PREFIX:[^=]*=//p' "$BUILD_DIR/CMakeCache.txt" | tail -n 1)"
              fi
              if [[ -z "$configured_prefix" ]]; then
                echo "::error::Could not determine CMAKE_INSTALL_PREFIX"
                exit 1
              fi
              python3 - "$configured_prefix" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" <<'PY'
        from pathlib import Path
        import sys

        path = Path(sys.argv[1]).resolve()
        roots = [Path(root).resolve() for root in sys.argv[2:]]
        if not any(path == root or root in path.parents for root in roots):
            print("::error::Alpine installation must use a prefix inside the workspace or runner temp; set install-prefix", file=sys.stderr)
            sys.exit(1)
        PY
            fi

            jobs="$(nproc)"
            if [[ -n "$BUILD_TARGET" ]]; then
              LD_PRELOAD="$BUILD_ALLOCATOR" ninja -C "$BUILD_DIR" -j"$jobs" "$BUILD_TARGET"
            else
              LD_PRELOAD="$BUILD_ALLOCATOR" ninja -C "$BUILD_DIR" -j"$jobs"
            fi
            if [[ "$CTEST_ENABLED" == true ]]; then
              parse_action_arguments "$CTEST_OPTIONS" "ctest-options"
              ctest --test-dir "$BUILD_DIR" "${PARSED_ARGS[@]}"
            fi
            if [[ "$INSTALL_ENABLED" == true || "$DEPLOY" == true ]]; then
              if [[ -n "$INSTALL_PREFIX" ]]; then
                cmake --install "$BUILD_DIR" --prefix "$INSTALL_PREFIX"
              else
                cmake --install "$BUILD_DIR"
              fi
            fi
            if [[ "$CACHE_ENABLED" == true ]]; then ccache -s; fi
        ALPINE_BUILD_SCRIPT

    - name: Build (Linux/macOS)
      id: build-unix
      if: runner.os != 'Windows' && steps.options.outputs.libc != 'musl'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🏗️  Building with Ninja (Linux/macOS)"
        echo "────────────────────────────────────────────────────────"

        JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"

        echo "🚀 Starting build with ${JOBS} jobs..."

        if [ -n "${{ steps.options.outputs.build_target }}" ]; then
          echo "   Target: ${{ steps.options.outputs.build_target }}"
          ninja -C "${{ inputs.build-dir }}" -j"${JOBS}" "${{ steps.options.outputs.build_target }}"
        else
          echo "   Target: all"
          ninja -C "${{ inputs.build-dir }}" -j"${JOBS}"
        fi

        echo "✅ Build finished successfully"

    ###########################################################################
    # 4. CACHE STATS
    ###########################################################################
    - name: ccache build statistics
      if: always() && runner.os != 'Windows' && steps.options.outputs.libc != 'musl' && steps.options.outputs.compiler_cache_key != '' && (steps.build-unix.outcome == 'success' || steps.build-unix.outcome == 'failure')
      shell: bash
      run: |
        set +e
        echo ""
        echo "=============================================="
        echo " 📊 COMPILER CACHE STATISTICS"
        echo "=============================================="
        echo "CCACHE_DIR=${CCACHE_DIR:-<unset>}"
        command -v ccache >/dev/null 2>&1 && ccache -s || echo "::warning::Could not read ccache statistics"
        echo "=============================================="
        echo ""

    ###########################################################################
    # 5. TESTS (optional)
    ###########################################################################
    - name: Run tests (Windows)
      if: steps.options.outputs.ctest == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
        CC: ${{ steps.toolchain.outputs.c_compiler }}
        CXX: ${{ steps.toolchain.outputs.cxx_compiler }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "🧪 Running tests (Windows)"
        Write-Host "────────────────────────────────────────────────────────"

        $opts = @()
        if (-not [string]::IsNullOrWhiteSpace($env:CTEST_OPTIONS)) {
          $parser = Join-Path $env:ACTION_PATH "parse-windows-arguments.py"
          $json = & python $parser $env:CTEST_OPTIONS "ctest-options"
          if ($LASTEXITCODE -ne 0) { throw "Invalid ctest-options" }
          $opts = @(ConvertFrom-Json -InputObject ($json -join "`n") -NoEnumerate)
        }
        ctest --test-dir "${{ inputs.build-dir }}" @opts
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        Write-Host "✅ Tests finished"

    - name: Run tests (Linux/macOS)
      if: steps.options.outputs.ctest == 'true' && runner.os != 'Windows' && steps.options.outputs.libc != 'musl'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
        CC: ${{ steps.toolchain.outputs.c_compiler }}
        CXX: ${{ steps.toolchain.outputs.cxx_compiler }}
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🧪 Running tests (Linux/macOS)"
        echo "────────────────────────────────────────────────────────"

        source "$ACTION_PATH/configure-common.sh"
        parse_action_arguments "$CTEST_OPTIONS" "ctest-options"
        ctest --test-dir "${{ inputs.build-dir }}" ${PARSED_ARGS[@]+"${PARSED_ARGS[@]}"}

        echo "✅ Tests finished"

    ###########################################################################
    # 5c. INSTALL (optional)
    ###########################################################################
    - name: Install
      if: (inputs.install == 'true' || steps.options.outputs.deploy == 'true') && steps.options.outputs.libc != 'musl'
      shell: bash
      env:
        INSTALL_PREFIX: ${{ steps.options.outputs.install_prefix }}
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "📦 Installing"
        echo "   Build dir : ${{ inputs.build-dir }}"
        if [ -n "${INSTALL_PREFIX}" ]; then
          echo "   Prefix    : ${INSTALL_PREFIX}"
        else
          echo "   Prefix    : (configured default)"
        fi
        echo "────────────────────────────────────────────────────────"

        if [ -n "${INSTALL_PREFIX}" ]; then
          cmake --install "${{ inputs.build-dir }}" --prefix "${INSTALL_PREFIX}"
        else
          cmake --install "${{ inputs.build-dir }}"
        fi

        echo "✅ Install finished"

    - name: Package release
      if: steps.options.outputs.deploy == 'true'
      shell: bash
      env:
        INSTALL_PREFIX: ${{ steps.options.outputs.install_prefix }}
        CXX_STDLIB: ${{ steps.options.outputs.cxx_stdlib }}
        LIBC: ${{ steps.options.outputs.libc }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        if [[ ! -d "$INSTALL_PREFIX" ]]; then
          echo "::error::Install prefix does not exist: $INSTALL_PREFIX"
          exit 1
        fi
        prefix_abs="$(cd "$INSTALL_PREFIX" && pwd -P)"
        workspace_abs="$(pwd -P)"
        if [[ "$prefix_abs" == / || "$workspace_abs" == "$prefix_abs" || "$workspace_abs" == "$prefix_abs"/* ]]; then
          echo "::error::Install prefix must not contain the workspace root"
          exit 1
        fi
        repo="${GITHUB_REPOSITORY##*/}"
        tag="$GITHUB_REF_NAME"
        case "$repo" in ''|.|..|*/*|*\\*) echo "::error::Invalid repository name for a release asset"; exit 1 ;; esac
        case "$tag" in ''|.|..|*/*|*\\*) echo "::error::Tag cannot be used in a release asset name: $tag"; exit 1 ;; esac
        case "$RUNNER_ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Unsupported release architecture: $RUNNER_ARCH"; exit 1 ;;
        esac
        case "$RUNNER_OS" in
          Linux)
            if [[ "$arch" == x64 ]]; then arch=amd64; fi
            suffix="linux-${arch}-${LIBC}-${CXX_STDLIB}"
            ;;
          macOS) suffix="macos-${arch}" ;;
          Windows) suffix="windows-${arch}" ;;
          *) echo "::error::Unsupported release OS: $RUNNER_OS"; exit 1 ;;
        esac
        archive="${RUNNER_TEMP}/${repo}-${tag}-${suffix}.zip"
        for notice in LICENSE* COPYING* THIRD-PARTY*; do
          if [[ -f "$notice" ]]; then cp "$notice" "$INSTALL_PREFIX/"; fi
        done
        (cd "$INSTALL_PREFIX" && cmake -E tar cf "$archive" --format=zip -- .)
        echo "RELEASE_ASSET=$archive" >> "$GITHUB_ENV"
        echo "Release asset: $archive"

    - name: Upload to existing GitHub release
      if: steps.options.outputs.deploy == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ ! -f "${RELEASE_ASSET:-}" ]]; then
          echo "::error::Release archive was not created"
          exit 1
        fi
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
        gh release upload "$GITHUB_REF_NAME" "$RELEASE_ASSET" \
          --repo "$GITHUB_REPOSITORY" --clobber

    ###########################################################################
    # 6. SAVE COMPILER CACHE
    ###########################################################################
    - name: Save ccache
      id: save-ccache
      if: always() && !cancelled() && steps.options.outputs.compiler_cache_key != '' && (steps.build-unix.outcome == 'success' || steps.build-unix.outcome == 'failure' || steps.build-musl.outcome == 'success' || steps.build-musl.outcome == 'failure')
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}

    - name: Save sccache
      id: save-sccache
      if: always() && !cancelled() && runner.os == 'Windows' && steps.options.outputs.compiler_cache_key != '' && steps.build-windows.outputs.sccache-ready == 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}

    ###########################################################################
    # 7. SAVE DOWNLOADS CACHE
    ###########################################################################
    - name: Save BuildMaster data directory
      id: save-buildmaster
      if: always() && !cancelled() && steps.options.outputs.buildmaster_cache_key != '' && steps.buildmaster.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.buildmaster.outputs.datadir }}/downloads
        key: ${{ steps.buildmaster.outputs.save_key }}

    ###########################################################################
    # 8. CLEANUP OLD CACHES
    ###########################################################################
    - name: Cleanup old ccache entries
      if: always() && !cancelled() && steps.save-ccache.outcome == 'success'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        CACHE_ACTION_PATH: ${{ github.action_path }}
        CACHE_KEY: ${{ steps.cachekeys.outputs.cache_key }}
        CACHE_SAVE_KEY: ${{ steps.cachekeys.outputs.save_key }}
      with:
        script: |
          const cleanup = require(require('path').join(process.env.CACHE_ACTION_PATH, 'cleanup-cache.cjs'));
          await cleanup({ github, context, core });

    - name: Cleanup old sccache entries
      if: always() && !cancelled() && steps.save-sccache.outcome == 'success'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        CACHE_ACTION_PATH: ${{ github.action_path }}
        CACHE_KEY: ${{ steps.cachekeys.outputs.cache_key }}
        CACHE_SAVE_KEY: ${{ steps.cachekeys.outputs.save_key }}
      with:
        script: |
          const cleanup = require(require('path').join(process.env.CACHE_ACTION_PATH, 'cleanup-cache.cjs'));
          await cleanup({ github, context, core });

    - name: Cleanup old BuildMaster data directory caches
      if: always() && !cancelled() && steps.save-buildmaster.outcome == 'success'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        CACHE_ACTION_PATH: ${{ github.action_path }}
        CACHE_KEY: ${{ steps.buildmaster.outputs.cache_key }}
        CACHE_SAVE_KEY: ${{ steps.buildmaster.outputs.save_key }}
      with:
        script: |
          const cleanup = require(require('path').join(process.env.CACHE_ACTION_PATH, 'cleanup-cache.cjs'));
          await cleanup({ github, context, core });
