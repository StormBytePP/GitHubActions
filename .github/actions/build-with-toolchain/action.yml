name: "Build with Toolchain"
description: "Configure caches/linkers, build with CMake/Ninja, run tests and save caches"
author: "David C. Manuelda"
branding:
  icon: "package"
  color: "blue"

inputs:
  toolchain:
    description: "gcc, clang, clang-libc++, msvc, or clang-cl (Windows only)"
    required: true

  ccache-key:
    description: >
      Non-empty enables compiler caching. Namespace suffix (e.g. "v1" or
      "v1-clang-extra-OFF"). Combined with OS, toolchain, job id and cache-scope.
    required: false
    default: ""

  cache-scope:
    description: >
      Extra uniqueness per matrix cell / parallel job. Composite actions cannot
      see the matrix context; pass the value from the workflow (e.g. the matrix
      extra field, or os-extra). Empty is fine if ccache-key already differs
      per matrix cell.
    required: false
    default: ""

  build-dir:
    description: "CMake build directory"
    required: false
    default: "build"

  build-type:
    description: "CMake build type"
    required: false
    default: "Debug"

  configure-options:
    description: "Extra CMake configure options"
    required: false
    default: ""

  target:
    description: "Optional CMake target to build (empty = all)"
    required: false
    default: ""

  run-tests:
    description: "Run ctest after build"
    required: false
    default: "false"

  ctest-options:
    description: "Extra options for ctest"
    required: false
    default: "--output-on-failure"

  version:
    description: "Optional major version for gcc/clang"
    required: false
    default: ""

  docs:
    description: "Install documentation tools"
    required: false
    default: "false"

  install-meson:
    description: >
      Install Meson via pip (default: true).
      Windows: pin meson==1.10.0 (workaround for known bugs).
      Linux/macOS: install latest Meson from PyPI.
    required: false
    default: "true"

  msvc-embedded-debug:
    description: >
      Windows only. If true (default), pass CMP0141=NEW and
      CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded (/Z7).
      Applies to msvc and clang-cl.
    required: false
    default: "true"

outputs:
  c_compiler:
    value: ${{ steps.toolchain.outputs.c_compiler }}
  cxx_compiler:
    value: ${{ steps.toolchain.outputs.cxx_compiler }}

runs:
  using: "composite"
  steps:

    ###########################################################################
    # 0. COMPILER CACHE KEYS + STABLE CACHE DIRS
    ###########################################################################
    - name: Compute compiler cache keys
      if: inputs.ccache-key != ''
      id: cachekeys
      shell: bash
      run: |
        set -euo pipefail

        echo "🔑 Computing compiler cache keys..."

        OS="${{ runner.os }}"
        TOOL="${{ inputs.toolchain }}"
        JOB="${{ github.job }}"
        SUFFIX="$(echo '${{ inputs.ccache-key }}' | tr -s ' ' | sed 's/^ *//;s/ *$//')"
        SCOPE="$(echo '${{ inputs.cache-scope }}' | tr -s ' ' | sed 's/^ *//;s/ *$//')"

        if [ -z "$SUFFIX" ]; then
          echo "❌ ccache-key is empty after trim"
          exit 1
        fi

        sanitize() {
          echo "$1" | sed 's/[^A-Za-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//'
        }
        JOB_S="$(sanitize "$JOB")"
        SCOPE_S="$(sanitize "$SCOPE")"
        SUFFIX_S="$(sanitize "$SUFFIX")"
        TOOL_S="$(sanitize "$TOOL")"

        if [ "$OS" = "Windows" ]; then
          PREFIX="sccache"
          if [ -z "${SCCACHE_DIR:-}" ]; then
            if [ -n "${RUNNER_TEMP:-}" ]; then
              SCCACHE_DIR="${RUNNER_TEMP}/sccache"
            else
              SCCACHE_DIR="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}/Mozilla/sccache/cache"
            fi
          fi
          mkdir -p "$SCCACHE_DIR"
          echo "SCCACHE_DIR=${SCCACHE_DIR}" >> "$GITHUB_ENV"
          export SCCACHE_DIR
          echo "📁 SCCACHE_DIR=${SCCACHE_DIR}"
        else
          PREFIX="ccache"
          CCACHE_DIR="${RUNNER_TEMP}/ccache"
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          export CCACHE_DIR
          echo "📁 CCACHE_DIR=${CCACHE_DIR}"
        fi

        KEY="${PREFIX}-${OS}-${TOOL_S}-${SUFFIX_S}-${JOB_S}"
        if [ -n "$SCOPE_S" ]; then
          KEY="${KEY}-${SCOPE_S}"
        fi

        SAVE_KEY="${KEY}-${{ github.run_id }}-${{ github.run_attempt }}"

        echo "cache_key=${KEY}" >> "$GITHUB_OUTPUT"
        echo "save_key=${SAVE_KEY}" >> "$GITHUB_OUTPUT"
        echo "CACHE_KEY=${KEY}" >> "$GITHUB_ENV"
        echo "✅ Compiler cache KEY=${KEY}"
        echo "✅ Compiler cache SAVE_KEY=${SAVE_KEY}"

        DL_KEY="buildmaster-downloads-${OS}-${TOOL_S}-${SUFFIX_S}-${JOB_S}"
        if [ -n "$SCOPE_S" ]; then
          DL_KEY="${DL_KEY}-${SCOPE_S}"
        fi
        DL_SAVE_KEY="${DL_KEY}-${{ github.run_id }}-${{ github.run_attempt }}"
        echo "downloads_cache_key=${DL_KEY}" >> "$GITHUB_OUTPUT"
        echo "downloads_save_key=${DL_SAVE_KEY}" >> "$GITHUB_OUTPUT"
        echo "✅ Downloads cache KEY=${DL_KEY}"
        echo "✅ Downloads cache SAVE_KEY=${DL_SAVE_KEY}"

    ###########################################################################
    # 0b. DETECT STORMBYTE-BUILDMASTER
    ###########################################################################
    - name: Detecting StormByte-BuildMaster
      id: buildmaster
      shell: bash
      run: |
        set -euo pipefail

        echo "🔍 Looking for StormByte-BuildMaster submodule..."

        DETECTED="false"
        DOWNLOADS_DIR=""
        DOWNLOADS_REL=""

        if [ -f .gitmodules ]; then
          while IFS= read -r -d '' key; do
            path=$(git config -f .gitmodules --get "$key")
            name="${key#submodule.}"
            name="${name%.path}"
            url=$(git config -f .gitmodules --get "submodule.${name}.url" 2>/dev/null || true)

            if echo "$name" | grep -qiE 'StormByte-BuildMaster|BuildMaster|Build Master' || \
               echo "$url"  | grep -qiE 'StormByte-BuildMaster|StormBytePP/StormByte-BuildMaster'; then
              DETECTED="true"
              DOWNLOADS_REL="${path}/downloads"
              DOWNLOADS_DIR="${{ inputs.build-dir }}/${DOWNLOADS_REL}"
              break
            fi
          done < <(git config -f .gitmodules --null --name-only --get-regexp 'submodule\..*\.path' 2>/dev/null || true)
        fi

        if [ "$DETECTED" = "true" ]; then
          echo "✅ StormByte-BuildMaster detected → downloads cache for ${DOWNLOADS_REL}"
          echo "detected=true" >> "$GITHUB_OUTPUT"
          echo "downloads_dir=${DOWNLOADS_DIR}" >> "$GITHUB_OUTPUT"
        else
          echo "ℹ️  StormByte-BuildMaster not detected – skipping downloads cache"
          echo "detected=false" >> "$GITHUB_OUTPUT"
          echo "downloads_dir=" >> "$GITHUB_OUTPUT"
        fi

    ###########################################################################
    # 1. INSTALL TOOLCHAIN
    ###########################################################################
    - name: Install toolchain
      id: toolchain
      uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        ccache-key: ${{ inputs.ccache-key }}
        version: ${{ inputs.version }}
        docs: ${{ inputs.docs }}
        install-meson: ${{ inputs.install-meson }}

    ###########################################################################
    # 1a. CONFIGURE COMPILER CACHE + LAUNCHERS
    ###########################################################################
    - name: Configure compiler cache and launchers
      if: inputs.ccache-key != ''
      shell: bash
      run: |
        set -euo pipefail

        echo "⚙️  Configuring compiler cache & launchers..."

        OS="${{ runner.os }}"

        if [ "$OS" = "Windows" ]; then
          if [ -z "${SCCACHE_DIR:-}" ]; then
            if [ -n "${RUNNER_TEMP:-}" ]; then
              SCCACHE_DIR="${RUNNER_TEMP}/sccache"
            else
              SCCACHE_DIR="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}/Mozilla/sccache/cache"
            fi
          fi
          mkdir -p "$SCCACHE_DIR"
          echo "SCCACHE_DIR=${SCCACHE_DIR}" >> "$GITHUB_ENV"

          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

          if command -v sccache >/dev/null 2>&1; then
            sccache --stop-server 2>/dev/null || true
            sccache --start-server 2>/dev/null || true
            sccache --zero-stats 2>/dev/null || true
            echo "✅ sccache ready (dir=${SCCACHE_DIR})"
            sccache --show-stats || true
          else
            echo "⚠️  WARNING: sccache not on PATH after install-toolchain"
          fi
        else
          CCACHE_DIR="${RUNNER_TEMP}/ccache"
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          export CCACHE_DIR

          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

          if [ -d /usr/lib/ccache ]; then
            echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          elif [ -d /usr/lib64/ccache ]; then
            echo "/usr/lib64/ccache" >> "$GITHUB_PATH"
          fi

          if command -v ccache >/dev/null 2>&1; then
            ccache -M 2G || true
            ccache -z || true
            echo "✅ ccache ready (dir=${CCACHE_DIR})"
            ccache -s || true
          else
            echo "⚠️  WARNING: ccache not found in PATH after install-toolchain"
          fi
        fi

    ###########################################################################
    # 1b. FORCE LLD + MATCHING LLVM BINUTILS (Clang on Linux only)
    ###########################################################################
    - name: Force lld for Clang
      if: runner.os == 'Linux' && (inputs.toolchain == 'clang' || inputs.toolchain == 'clang-libc++')
      shell: bash
      run: |
        set -euo pipefail

        echo "🔗 Forcing lld + LLVM binutils for ${{ inputs.toolchain }}..."

        VER="${CLANG_VERSION:-}"
        if [ -z "$VER" ]; then
          VER="$(clang --version 2>/dev/null | sed -n 's/.*clang version \([0-9]\+\).*/\1/p' | head -1)"
        fi
        if [ -z "$VER" ]; then
          echo "::error::Could not resolve CLANG_VERSION"
          exit 1
        fi
        echo "CLANG_VERSION=${VER}"

        if ! command -v "ld.lld-${VER}" >/dev/null 2>&1 && ! command -v ld.lld >/dev/null 2>&1; then
          echo "::error::ld.lld not found (install-toolchain should provide lld-${VER})"
          exit 1
        fi

        LLD="$(command -v ld.lld-${VER} 2>/dev/null || command -v ld.lld)"
        AR="$(command -v llvm-ar-${VER} 2>/dev/null || command -v llvm-ar || true)"
        RANLIB="$(command -v llvm-ranlib-${VER} 2>/dev/null || command -v llvm-ranlib || true)"
        NM="$(command -v llvm-nm-${VER} 2>/dev/null || command -v llvm-nm || true)"

        echo "ld.lld:  ${LLD}"
        "$LLD" --version 2>/dev/null | head -1 || true
        echo "llvm-ar: ${AR:-<missing — install llvm-${VER} in install-toolchain>}"

        {
          echo "LDFLAGS=-fuse-ld=lld"
          echo "CMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=lld"
          echo "CMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=lld"
          echo "CMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=lld"
          echo "CMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
          echo "CMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld"
          echo "CMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld"
        } >> "$GITHUB_ENV"

        if [ -n "$AR" ]; then
          echo "AR=${AR}" >> "$GITHUB_ENV"
          echo "CMAKE_AR=${AR}" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_AR=${AR}" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_AR=${AR}" >> "$GITHUB_ENV"
        else
          echo "::warning::llvm-ar-${VER} not found; LTO static libs may still hit bfd/gold mismatch"
        fi
        if [ -n "$RANLIB" ]; then
          echo "RANLIB=${RANLIB}" >> "$GITHUB_ENV"
          echo "CMAKE_RANLIB=${RANLIB}" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_RANLIB=${RANLIB}" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_RANLIB=${RANLIB}" >> "$GITHUB_ENV"
        fi
        if [ -n "$NM" ]; then
          echo "NM=${NM}" >> "$GITHUB_ENV"
          echo "CMAKE_NM=${NM}" >> "$GITHUB_ENV"
        fi

        echo "CC=$(command -v clang-${VER} 2>/dev/null || command -v clang)" >> "$GITHUB_ENV"
        echo "CXX=$(command -v clang++-${VER} 2>/dev/null || command -v clang++)" >> "$GITHUB_ENV"

        echo "✅ Forced -fuse-ld=lld and LLVM ${VER} binutils for nested LTO builds"

    ###########################################################################
    # 1c. RESTORE COMPILER CACHE
    ###########################################################################
    - name: Restore ccache
      id: restore-ccache
      if: inputs.ccache-key != '' && (runner.os == 'Linux' || runner.os == 'macOS')
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}
        restore-keys: |
          ${{ steps.cachekeys.outputs.cache_key }}-${{ github.run_id }}-
          ${{ steps.cachekeys.outputs.cache_key }}-

    - name: Restore sccache
      id: restore-sccache
      if: inputs.ccache-key != '' && runner.os == 'Windows'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}
        restore-keys: |
          ${{ steps.cachekeys.outputs.cache_key }}-${{ github.run_id }}-
          ${{ steps.cachekeys.outputs.cache_key }}-

    ###########################################################################
    # 1d. RESTORE + PREPARE DOWNLOADS CACHE
    ###########################################################################
    - name: Restore downloads cache
      id: restore-downloads
      if: inputs.ccache-key != '' && steps.buildmaster.outputs.detected == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.buildmaster.outputs.downloads_dir }}
        key: ${{ steps.cachekeys.outputs.downloads_save_key }}
        restore-keys: |
          ${{ steps.cachekeys.outputs.downloads_cache_key }}-${{ github.run_id }}-
          ${{ steps.cachekeys.outputs.downloads_cache_key }}-

    - name: Ensure downloads directory exists
      if: inputs.ccache-key != '' && steps.buildmaster.outputs.detected == 'true'
      shell: bash
      run: |
        mkdir -p "${{ steps.buildmaster.outputs.downloads_dir }}"
        echo "📁 Downloads directory ready: ${{ steps.buildmaster.outputs.downloads_dir }}"

    ###########################################################################
    # 1e. WINDOWS: sanitize PATH — MSVC link.exe first (msvc + clang-cl)
    ###########################################################################
    - name: Sanitize PATH for MSVC linker
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "🧹 Sanitizing PATH for MSVC linker..."

        function Remove-GnuShadowPaths([string]$pathValue) {
          $gnuPathFragments = @(
            'Git\usr\bin',
            'Git\mingw64\bin',
            'Git\mingw32\bin',
            'Strawberry\c\bin',
            'Strawberry\c\x86_64-w64-mingw32',
            'msys64\usr\bin',
            'msys64\mingw64\bin',
            'cygwin64\bin',
            'mingw64\bin',
            'mingw32\bin'
          )
          $parts = [System.Collections.Generic.List[string]]::new()
          foreach ($p in ($pathValue -split ';')) {
            if ([string]::IsNullOrWhiteSpace($p)) { continue }
            $drop = $false
            foreach ($frag in $gnuPathFragments) {
              if ($p -like "*$frag*") {
                Write-Host "PATH: removing GNU shadow: $p"
                $drop = $true
                break
              }
            }
            if (-not $drop) { $parts.Add($p) }
          }
          return ($parts -join ';')
        }

        $env:Path = Remove-GnuShadowPaths $env:Path

        $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
        if ($null -eq $linkCmd) {
          Write-Error "link.exe not found after PATH sanitize (msvc-dev-cmd missing?)"
          exit 1
        }

        $linkDir = Split-Path -Parent $linkCmd.Source
        $env:Path = "$linkDir;$env:Path"

        $linkDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        if ($env:__VSCMD_PREINIT_PATH) {
          $cleanPreinit = Remove-GnuShadowPaths $env:__VSCMD_PREINIT_PATH
          $env:__VSCMD_PREINIT_PATH = $cleanPreinit
          "__VSCMD_PREINIT_PATH=$cleanPreinit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Cleaned __VSCMD_PREINIT_PATH"
        }

        Write-Host "Using linker: $($linkCmd.Source)"

        if ($linkCmd.Source -notmatch '(?i)[\\/]MSVC[\\/]|HostX64|Hostx64|Visual Studio') {
          Write-Error "link.exe does not look like MSVC: $($linkCmd.Source)"
          exit 1
        }

        $bannerText = cmd /c "link.exe 2>&1" | Out-String
        $LASTEXITCODE = 0

        Write-Host "link.exe banner (first 300 chars):"
        if ($bannerText.Length -gt 0) {
          Write-Host $bannerText.Substring(0, [Math]::Min(300, $bannerText.Length))
        }

        Write-Host "✅ MSVC linker OK"

    ###########################################################################
    # 2. CONFIGURE
    ###########################################################################
    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        CONFIGURE_OPTIONS: ${{ inputs.configure-options }}
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🔧 Configuring CMake (Linux/macOS)"
        echo "   Build type : ${{ inputs.build-type }}"
        echo "   Build dir  : ${{ inputs.build-dir }}"
        echo "   Toolchain  : ${{ inputs.toolchain }}"
        echo "────────────────────────────────────────────────────────"

        LAUNCHER_ARGS=()
        if [ -n "${{ inputs.ccache-key }}" ] && command -v ccache >/dev/null 2>&1; then
          export CCACHE_DIR="${CCACHE_DIR:-${RUNNER_TEMP}/ccache}"
          mkdir -p "${CCACHE_DIR}"
          LAUNCHER_ARGS+=(
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          )
          echo "📦 Using ccache launcher (dir=${CCACHE_DIR})"
          ccache -s || true
        fi

        LINKER_ARGS=()
        if [ "${{ runner.os }}" = "Linux" ]; then
          case "${{ inputs.toolchain }}" in
            clang|clang-libc++)
              LINKER_ARGS+=(
                -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
                -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld
                -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld
              )
              echo "🔗 Using lld for toolchain=${{ inputs.toolchain }}"
              ;;
          esac
        fi

        # shellcheck disable=SC2086
        cmake -S . -B "${{ inputs.build-dir }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
          -DCMAKE_C_COMPILER="${{ steps.toolchain.outputs.c_compiler }}" \
          -DCMAKE_CXX_COMPILER="${{ steps.toolchain.outputs.cxx_compiler }}" \
          ${LAUNCHER_ARGS[@]+"${LAUNCHER_ARGS[@]}"} \
          ${LINKER_ARGS[@]+"${LINKER_ARGS[@]}"} \
          ${CONFIGURE_OPTIONS}

        echo "✅ CMake configure finished"

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CONFIGURE_OPTIONS: ${{ inputs.configure-options }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "🔧 Configuring CMake (Windows)"
        Write-Host "   Build type : ${{ inputs.build-type }}"
        Write-Host "   Build dir  : ${{ inputs.build-dir }}"
        Write-Host "   Toolchain  : ${{ inputs.toolchain }}"
        Write-Host "────────────────────────────────────────────────────────"

        $cCompiler = "${{ steps.toolchain.outputs.c_compiler }}"
        $cxxCompiler = "${{ steps.toolchain.outputs.cxx_compiler }}"
        if ([string]::IsNullOrWhiteSpace($cCompiler))  { $cCompiler = "cl" }
        if ([string]::IsNullOrWhiteSpace($cxxCompiler)) { $cxxCompiler = "cl" }

        # Always force MSVC link.exe (msvc and clang-cl).
        # IPO stays MSVC-style (/GL + /LTCG); only the linker is pinned.
        $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
        if ($null -eq $linkCmd) {
          Write-Error "link.exe not found (msvc-dev-cmd / PATH sanitize required)"
          exit 1
        }
        if ($linkCmd.Source -notmatch '(?i)[\\/]MSVC[\\/]|HostX64|Hostx64|Visual Studio') {
          Write-Error "link.exe does not look like MSVC: $($linkCmd.Source)"
          exit 1
        }

        # CMake paths must use forward slashes — backslashes become invalid escapes (\P, \M, …)
        $linkExe = ($linkCmd.Source -replace '\\', '/')

        $mtCmd = Get-Command mt.exe -ErrorAction SilentlyContinue
        $mtExe = if ($mtCmd) { ($mtCmd.Source -replace '\\', '/') } else { "mt" }

        Write-Host "   C compiler  : $cCompiler"
        Write-Host "   CXX compiler: $cxxCompiler"
        Write-Host "   Linker      : $linkExe (MSVC — forced for msvc and clang-cl)"
        Write-Host "   mt          : $mtExe"

        $cmakeArgs = [System.Collections.Generic.List[string]]::new()
        foreach ($a in @(
          "-S", ".",
          "-B", "${{ inputs.build-dir }}",
          "-G", "Ninja",
          "-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}",
          "-DCMAKE_C_COMPILER=$cCompiler",
          "-DCMAKE_CXX_COMPILER=$cxxCompiler",
          "-DCMAKE_LINKER_TYPE=MSVC",
          "-DCMAKE_LINKER=$linkExe",
          "-DCMAKE_C_COMPILER_LINKER=$linkExe",
          "-DCMAKE_CXX_COMPILER_LINKER=$linkExe",
          "-DCMAKE_MT=$mtExe"
        )) {
          $cmakeArgs.Add($a)
        }

        if ("${{ inputs.msvc-embedded-debug }}" -eq "true") {
          Write-Host "🛠️  msvc-embedded-debug: CMP0141=NEW + Embedded (/Z7)"
          $cmakeArgs.Add("-DCMAKE_POLICY_DEFAULT_CMP0141=NEW")
          $cmakeArgs.Add("-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded")
        }

        if ("${{ inputs.ccache-key }}" -ne "" -and (Get-Command sccache -ErrorAction SilentlyContinue)) {
          Write-Host "📦 Using sccache launcher (msvc / clang-cl)"
          $cmakeArgs.Add("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
          $cmakeArgs.Add("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")

          if (-not $env:SCCACHE_DIR -or $env:SCCACHE_DIR -eq "") {
            if ($env:RUNNER_TEMP) {
              $env:SCCACHE_DIR = Join-Path $env:RUNNER_TEMP "sccache"
            } else {
              $env:SCCACHE_DIR = Join-Path $env:LOCALAPPDATA "Mozilla\sccache\cache"
            }
          }
          New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null
          "SCCACHE_DIR=$($env:SCCACHE_DIR)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SCCACHE_DIR=$($env:SCCACHE_DIR)"
        } else {
          Write-Host "ℹ️  sccache launcher disabled"
        }

        $extra = $env:CONFIGURE_OPTIONS
        if ($extra -and $extra.Trim() -ne "") {
          foreach ($m in [regex]::Matches($extra, '("([^"]*)"|''([^'']*)''|\S+)')) {
            $t = $m.Value
            if ($t.Length -ge 2 -and (
                ($t.StartsWith('"') -and $t.EndsWith('"')) -or
                ($t.StartsWith("'") -and $t.EndsWith("'"))
              )) {
              $t = $t.Substring(1, $t.Length - 2)
            }
            if ($t -ne "") { $cmakeArgs.Add($t) }
          }
        }

        Write-Host "Running: cmake $($cmakeArgs -join ' ')"
        & cmake @($cmakeArgs.ToArray())
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        Write-Host "✅ CMake configure finished"

    ###########################################################################
    # 3. BUILD
    ###########################################################################
    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "🏗️  Building with Ninja (Windows)"
        Write-Host "────────────────────────────────────────────────────────"

        function Remove-GnuShadowPaths([string]$pathValue) {
          $gnuPathFragments = @(
            'Git\usr\bin', 'Git\mingw64\bin', 'Git\mingw32\bin',
            'Strawberry\c\bin', 'Strawberry\c\x86_64-w64-mingw32',
            'msys64\usr\bin', 'msys64\mingw64\bin', 'cygwin64\bin',
            'mingw64\bin', 'mingw32\bin'
          )
          $parts = [System.Collections.Generic.List[string]]::new()
          foreach ($p in ($pathValue -split ';')) {
            if ([string]::IsNullOrWhiteSpace($p)) { continue }
            $drop = $false
            foreach ($frag in $gnuPathFragments) {
              if ($p -like "*$frag*") { $drop = $true; break }
            }
            if (-not $drop) { $parts.Add($p) }
          }
          return ($parts -join ';')
        }

        $env:Path = Remove-GnuShadowPaths $env:Path
        $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
        if ($null -eq $linkCmd) {
          Write-Error "link.exe not found before build"
          exit 1
        }
        $linkDir = Split-Path -Parent $linkCmd.Source
        $env:Path = "$linkDir;$env:Path"
        if ($env:__VSCMD_PREINIT_PATH) {
          $env:__VSCMD_PREINIT_PATH = Remove-GnuShadowPaths $env:__VSCMD_PREINIT_PATH
        }

        $jobs = [Environment]::ProcessorCount
        if ($jobs -lt 1) { $jobs = 4 }

        $target = "${{ inputs.target }}"
        Write-Host "🚀 Starting build with $jobs jobs..."
        if ($target -ne "") {
          Write-Host "   Target: $target"
          ninja -C "${{ inputs.build-dir }}" -j $jobs $target
        } else {
          Write-Host "   Target: all"
          ninja -C "${{ inputs.build-dir }}" -j $jobs
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        Write-Host "✅ Build finished successfully"

    - name: Build (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🏗️  Building with Ninja (Linux/macOS)"
        echo "────────────────────────────────────────────────────────"

        JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"

        echo "🚀 Starting build with ${JOBS} jobs..."

        if [ -n "${{ inputs.target }}" ]; then
          echo "   Target: ${{ inputs.target }}"
          ninja -C "${{ inputs.build-dir }}" -j"${JOBS}" "${{ inputs.target }}"
        else
          echo "   Target: all"
          ninja -C "${{ inputs.build-dir }}" -j"${JOBS}"
        fi

        echo "✅ Build finished successfully"

    ###########################################################################
    # 4. CACHE STATS
    ###########################################################################
    - name: Compiler cache stats
      if: always() && inputs.ccache-key != ''
      shell: bash
      run: |
        set +e
        echo ""
        echo "=============================================="
        echo " 📊 COMPILER CACHE STATISTICS"
        echo "=============================================="
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          echo "SCCACHE_DIR=${SCCACHE_DIR:-<unset>}"
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || echo "sccache not found in PATH"
        else
          echo "CCACHE_DIR=${CCACHE_DIR:-<unset>}"
          command -v ccache >/dev/null 2>&1 && ccache -s || echo "ccache not found in PATH"
        fi
        echo "=============================================="
        echo ""

    ###########################################################################
    # 5. TESTS (optional)
    ###########################################################################
    - name: Run tests (Windows)
      if: inputs.run-tests == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "────────────────────────────────────────────────────────"
        Write-Host "🧪 Running tests (Windows)"
        Write-Host "────────────────────────────────────────────────────────"

        $opts = $env:CTEST_OPTIONS
        if ($opts) {
          ctest --test-dir "${{ inputs.build-dir }}" $opts.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
        } else {
          ctest --test-dir "${{ inputs.build-dir }}" --output-on-failure
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        Write-Host "✅ Tests finished"

    - name: Run tests (Linux/macOS)
      if: inputs.run-tests == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
      run: |
        set -euo pipefail

        echo "────────────────────────────────────────────────────────"
        echo "🧪 Running tests (Linux/macOS)"
        echo "────────────────────────────────────────────────────────"

        # shellcheck disable=SC2086
        ctest --test-dir "${{ inputs.build-dir }}" ${CTEST_OPTIONS}

        echo "✅ Tests finished"

    ###########################################################################
    # 6. SAVE COMPILER CACHE
    ###########################################################################
    - name: Save ccache
      if: always() && (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}

    - name: Save sccache
      if: always() && runner.os == 'Windows' && inputs.ccache-key != ''
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.cachekeys.outputs.save_key }}

    ###########################################################################
    # 7. SAVE DOWNLOADS CACHE
    ###########################################################################
    - name: Save downloads cache
      if: always() && inputs.ccache-key != '' && steps.buildmaster.outputs.detected == 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.buildmaster.outputs.downloads_dir }}
        key: ${{ steps.cachekeys.outputs.downloads_save_key }}

    ###########################################################################
    # 8. CLEANUP OLD CACHES
    ###########################################################################
    - name: Cleanup old ccache entries
      if: always() && (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const keyPrefix = `${{ steps.cachekeys.outputs.cache_key }}-`;
          const currentKey = `${{ steps.cachekeys.outputs.save_key }}`;
          const caches = await github.paginate(
            github.rest.actions.getActionsCacheList,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: keyPrefix,
              per_page: 100
            }
          );
          for (const cache of caches) {
            if (cache.key !== currentKey) {
              console.log(`Deleting old cache: ${cache.key} (id=${cache.id})`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }
          }

    - name: Cleanup old sccache entries
      if: always() && runner.os == 'Windows' && inputs.ccache-key != ''
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const keyPrefix = `${{ steps.cachekeys.outputs.cache_key }}-`;
          const currentKey = `${{ steps.cachekeys.outputs.save_key }}`;
          const caches = await github.paginate(
            github.rest.actions.getActionsCacheList,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: keyPrefix,
              per_page: 100
            }
          );
          for (const cache of caches) {
            if (cache.key !== currentKey) {
              console.log(`Deleting old cache: ${cache.key} (id=${cache.id})`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }
          }

    - name: Cleanup old downloads cache entries
      if: always() && inputs.ccache-key != '' && steps.buildmaster.outputs.detected == 'true'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const keyPrefix = `${{ steps.cachekeys.outputs.downloads_cache_key }}-`;
          const currentKey = `${{ steps.cachekeys.outputs.downloads_save_key }}`;
          const caches = await github.paginate(
            github.rest.actions.getActionsCacheList,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: keyPrefix,
              per_page: 100
            }
          );
          for (const cache of caches) {
            if (cache.key !== currentKey) {
              console.log(`Deleting old downloads cache: ${cache.key} (id=${cache.id})`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }
          }