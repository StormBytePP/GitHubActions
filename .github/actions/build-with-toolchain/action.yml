name: "Build with Toolchain"
description: "Install compiler toolchain, build with CMake/Ninja and save compiler cache"
author: "David C. Manuelda"
branding:
  icon: "package"
  color: "blue"

inputs:
  toolchain:
    description: "gcc, clang, clang-libc++, or msvc"
    required: true

  ccache-key:
    description: "Base cache key for ccache/sccache. Empty = disabled"
    required: false
    default: ""

  build-dir:
    description: "CMake build directory"
    required: false
    default: "build"

  build-type:
    description: "CMake build type"
    required: false
    default: "Debug"

  configure-options:
    description: "Extra CMake configure options"
    required: false
    default: ""

  target:
    description: "Optional CMake target to build (empty = all)"
    required: false
    default: ""

  run-tests:
    description: "Run ctest after build"
    required: false
    default: "false"

  ctest-options:
    description: "Extra options for ctest"
    required: false
    default: "--output-on-failure"

  version:
    description: "Optional major version for gcc/clang"
    required: false
    default: ""

  docs:
    description: "Install documentation tools"
    required: false
    default: "false"

  install-meson:
    description: "Install Meson"
    required: false
    default: "true"

  msvc-embedded-debug:
    description: >
      Windows only. If true (default), pass
      -DCMAKE_POLICY_DEFAULT_CMP0141=NEW and
      -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded so MSVC uses /Z7
      instead of /Zi (avoids PDB races under parallel sccache).
    required: false
    default: "true"

outputs:
  c_compiler:
    value: ${{ steps.toolchain.outputs.c_compiler }}
  cxx_compiler:
    value: ${{ steps.toolchain.outputs.cxx_compiler }}

runs:
  using: "composite"
  steps:

    ###########################################################################
    # 1. INSTALL TOOLCHAIN
    ###########################################################################
    - name: Install toolchain
      id: toolchain
      uses: stormbytepp/githubactions/.github/actions/install-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        ccache-key: ${{ inputs.ccache-key }}
        version: ${{ inputs.version }}
        docs: ${{ inputs.docs }}
        install-meson: ${{ inputs.install-meson }}

    ###########################################################################
    # 1b. WINDOWS: drop GNU link.exe shadows + clean __VSCMD_PREINIT_PATH
    ###########################################################################
    - name: Sanitize PATH for MSVC linker
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        function Remove-GnuShadowPaths([string]$pathValue) {
          $gnuPathFragments = @(
            'Git\usr\bin',
            'Git\mingw64\bin',
            'Git\mingw32\bin',
            'Strawberry\c\bin',
            'Strawberry\c\x86_64-w64-mingw32',
            'msys64\usr\bin',
            'msys64\mingw64\bin',
            'cygwin64\bin',
            'mingw64\bin',
            'mingw32\bin'
          )
          $parts = [System.Collections.Generic.List[string]]::new()
          foreach ($p in ($pathValue -split ';')) {
            if ([string]::IsNullOrWhiteSpace($p)) { continue }
            $drop = $false
            foreach ($frag in $gnuPathFragments) {
              if ($p -like "*$frag*") {
                Write-Host "PATH: removing GNU shadow: $p"
                $drop = $true
                break
              }
            }
            if (-not $drop) { $parts.Add($p) }
          }
          return ($parts -join ';')
        }

        $env:Path = Remove-GnuShadowPaths $env:Path

        $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
        if ($null -eq $linkCmd) {
          Write-Error "link.exe not found after PATH sanitize (msvc-dev-cmd missing?)"
          exit 1
        }

        $linkDir = Split-Path -Parent $linkCmd.Source
        $env:Path = "$linkDir;$env:Path"

        $linkDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        if ($env:__VSCMD_PREINIT_PATH) {
          $cleanPreinit = Remove-GnuShadowPaths $env:__VSCMD_PREINIT_PATH
          $env:__VSCMD_PREINIT_PATH = $cleanPreinit
          "__VSCMD_PREINIT_PATH=$cleanPreinit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Cleaned __VSCMD_PREINIT_PATH"
        }

        Write-Host "Using linker: $($linkCmd.Source)"

        # Path-based check only. Do NOT use "$banner -notmatch" on multi-line
        # cmd output: PowerShell treats it as a filter and false-positives.
        if ($linkCmd.Source -notmatch '(?i)[\\/]MSVC[\\/]|HostX64|Hostx64|Visual Studio') {
          Write-Error "link.exe does not look like MSVC: $($linkCmd.Source)"
          exit 1
        }

        $bannerText = @(cmd /c "link.exe 2>&1") | Out-String
        Write-Host "link.exe banner (first 300 chars):"
        if ($bannerText.Length -gt 0) {
          Write-Host $bannerText.Substring(0, [Math]::Min(300, $bannerText.Length))
        }

        Write-Host "MSVC linker OK"
        exit 0

    ###########################################################################
    # 2. CONFIGURE
    ###########################################################################
    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        CONFIGURE_OPTIONS: ${{ inputs.configure-options }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        cmake -S . -B "${{ inputs.build-dir }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
          -DCMAKE_C_COMPILER="${{ steps.toolchain.outputs.c_compiler }}" \
          -DCMAKE_CXX_COMPILER="${{ steps.toolchain.outputs.cxx_compiler }}" \
          ${CONFIGURE_OPTIONS}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CONFIGURE_OPTIONS: ${{ inputs.configure-options }}
      run: |
        $ErrorActionPreference = "Stop"

        $cmakeArgs = [System.Collections.Generic.List[string]]::new()
        foreach ($a in @(
          "-S", ".",
          "-B", "${{ inputs.build-dir }}",
          "-G", "Ninja",
          "-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}",
          "-DCMAKE_C_COMPILER=cl",
          "-DCMAKE_CXX_COMPILER=cl"
        )) {
          $cmakeArgs.Add($a)
        }

        if ("${{ inputs.msvc-embedded-debug }}" -eq "true") {
          Write-Host "msvc-embedded-debug: CMP0141=NEW + Embedded (/Z7)"
          $cmakeArgs.Add("-DCMAKE_POLICY_DEFAULT_CMP0141=NEW")
          $cmakeArgs.Add("-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded")
        }

        if ($env:CMAKE_C_COMPILER_LAUNCHER) {
          Write-Host "Using sccache launcher"
          $cmakeArgs.Add("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
          $cmakeArgs.Add("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
        } else {
          Write-Host "WARNING: sccache not configured – caching disabled"
        }

        $extra = $env:CONFIGURE_OPTIONS
        if ($extra -and $extra.Trim() -ne "") {
          foreach ($m in [regex]::Matches($extra, '("([^"]*)"|''([^'']*)''|\S+)')) {
            $t = $m.Value
            if ($t.Length -ge 2 -and (
                ($t.StartsWith('"') -and $t.EndsWith('"')) -or
                ($t.StartsWith("'") -and $t.EndsWith("'"))
              )) {
              $t = $t.Substring(1, $t.Length - 2)
            }
            if ($t -ne "") { $cmakeArgs.Add($t) }
          }
        }

        Write-Host "Running: cmake $($cmakeArgs -join ' ')"
        & cmake @($cmakeArgs.ToArray())
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    ###########################################################################
    # 3. BUILD
    ###########################################################################
    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        function Remove-GnuShadowPaths([string]$pathValue) {
          $gnuPathFragments = @(
            'Git\usr\bin', 'Git\mingw64\bin', 'Git\mingw32\bin',
            'Strawberry\c\bin', 'Strawberry\c\x86_64-w64-mingw32',
            'msys64\usr\bin', 'msys64\mingw64\bin', 'cygwin64\bin',
            'mingw64\bin', 'mingw32\bin'
          )
          $parts = [System.Collections.Generic.List[string]]::new()
          foreach ($p in ($pathValue -split ';')) {
            if ([string]::IsNullOrWhiteSpace($p)) { continue }
            $drop = $false
            foreach ($frag in $gnuPathFragments) {
              if ($p -like "*$frag*") { $drop = $true; break }
            }
            if (-not $drop) { $parts.Add($p) }
          }
          return ($parts -join ';')
        }

        # Re-assert for this process tree (nested meson / runner.bat / ninja)
        $env:Path = Remove-GnuShadowPaths $env:Path
        $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
        if ($null -eq $linkCmd) {
          Write-Error "link.exe not found before build"
          exit 1
        }
        $linkDir = Split-Path -Parent $linkCmd.Source
        $env:Path = "$linkDir;$env:Path"
        if ($env:__VSCMD_PREINIT_PATH) {
          $env:__VSCMD_PREINIT_PATH = Remove-GnuShadowPaths $env:__VSCMD_PREINIT_PATH
        }

        Write-Host "Build-time linker: $($linkCmd.Source)"
        if ($linkCmd.Source -notmatch '(?i)[\\/]MSVC[\\/]|HostX64|Hostx64|Visual Studio') {
          Write-Error "Build step link.exe does not look like MSVC: $($linkCmd.Source)"
          exit 1
        }
        where.exe link

        $target = "${{ inputs.target }}"
        if ($target -ne "") {
          cmake --build "${{ inputs.build-dir }}" --target $target --parallel
        } else {
          cmake --build "${{ inputs.build-dir }}" --parallel
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.target }}" ]; then
          cmake --build "${{ inputs.build-dir }}" --target "${{ inputs.target }}" --parallel
        else
          cmake --build "${{ inputs.build-dir }}" --parallel
        fi

    ###########################################################################
    # 4. CACHE STATS
    ###########################################################################
    - name: Compiler cache stats
      if: always() && inputs.ccache-key != ''
      shell: bash
      run: |
        set +e
        echo "=============================================="
        echo " COMPILER CACHE STATISTICS"
        echo "=============================================="
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || echo "sccache not found in PATH"
        else
          command -v ccache >/dev/null 2>&1 && ccache -s || echo "ccache not found in PATH"
        fi
        echo "=============================================="

    ###########################################################################
    # 5. TESTS (optional)
    ###########################################################################
    - name: Run tests (Windows)
      if: inputs.run-tests == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
      run: |
        $ErrorActionPreference = "Stop"
        $opts = $env:CTEST_OPTIONS
        if ($opts) {
          ctest --test-dir "${{ inputs.build-dir }}" $opts.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
        } else {
          ctest --test-dir "${{ inputs.build-dir }}" --output-on-failure
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run tests (Linux/macOS)
      if: inputs.run-tests == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        CTEST_OPTIONS: ${{ inputs.ctest-options }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        ctest --test-dir "${{ inputs.build-dir }}" ${CTEST_OPTIONS}

    ###########################################################################
    # 6. SAVE COMPILER CACHE
    ###########################################################################
    - name: Save ccache
      if: success() && (runner.os == 'Linux' || runner.os == 'macOS') && inputs.ccache-key != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.CCACHE_SAVE_KEY }}

    - name: Save sccache
      if: success() && runner.os == 'Windows' && inputs.ccache-key != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ env.SCCACHE_SAVE_KEY }}