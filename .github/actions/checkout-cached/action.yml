name: "Checkout Cached"
description: "Checkout repository and cache git submodules by commit SHA"
author: "David C. Manuelda"
branding:
  icon: "download"
  color: "blue"

inputs:
  fetch-depth:
    description: "Fetch depth for the parent repository (0 = full history)"
    required: false
    default: "0"

  submodules:
    description: "false | true | recursive"
    required: false
    default: "recursive"

  token:
    description: "Token used for checkout, submodule fetch, and optional cache prune"
    required: false
    default: ${{ github.token }}

  persist-credentials:
    description: "Persist credentials for subsequent git operations"
    required: false
    default: "true"

  cache-key-prefix:
    description: "Prefix for the submodule cache key"
    required: false
    default: "git-submodules"

  path:
    description: "Relative path under $GITHUB_WORKSPACE to place the repository"
    required: false
    default: "."

  prune-old-caches:
    description: >
      On cache miss, delete other Actions caches in this repo whose key starts
      with cache-key-prefix (frees space; does not wait for GitHub eviction).
      Requires permissions: actions: write. Default true.
    required: false
    default: "true"

  submodule-max-attempts:
    description: >
      Max attempts for git submodule update on transient remote errors
      (502/503/504/429, timeouts, connection reset). Permanent errors
      (404, not found, auth) fail immediately. Default 5.
    required: false
    default: "5"

  submodule-retry-base-seconds:
    description: "Base sleep (seconds) between retries; grows with attempt number"
    required: false
    default: "20"

runs:
  using: "composite"
  steps:

    ###########################################################################
    # 1. CHECKOUT PARENT (never fetch submodules here)
    ###########################################################################
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        submodules: false
        token: ${{ inputs.token }}
        persist-credentials: ${{ inputs.persist-credentials }}
        path: ${{ inputs.path }}

    ###########################################################################
    # 2. RESOLVE SUBMODULE PATHS + CACHE KEY
    ###########################################################################
    - name: Resolve submodule cache metadata
      if: inputs.submodules != 'false'
      id: meta
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        set -euo pipefail

        if [ ! -f .gitmodules ]; then
          echo "has_submodules=false" >> "$GITHUB_OUTPUT"
          echo "No .gitmodules found – skipping submodule cache"
          exit 0
        fi

        PATHS=()
        while IFS= read -r p; do
          [ -n "$p" ] && PATHS+=("$p")
        done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null | awk '{print $2}')

        if [ ${#PATHS[@]} -eq 0 ]; then
          echo "has_submodules=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "has_submodules=true" >> "$GITHUB_OUTPUT"

        # Cache key must depend only on submodule identity, not on the parent
        # commit. Including HEAD made the key unique per parent SHA and caused
        # near-zero hit rates on normal pushes, rebases, and force-pushes.
        # Safe because we always run `git submodule update --force` after restore.
        LINKS="$(git ls-tree -r HEAD | awk '$2 == "commit" { print $3 " " $4 }' | sort)"
        MOD="$(git show HEAD:.gitmodules 2>/dev/null || true)"

        if command -v sha256sum >/dev/null 2>&1; then
          HASH="$(printf '%s\n%s\n' "$LINKS" "$MOD" | sha256sum | awk '{print substr($1,1,24)}')"
        else
          HASH="$(printf '%s\n%s\n' "$LINKS" "$MOD" | shasum -a 256 | awk '{print substr($1,1,24)}')"
        fi

        PREFIX="${{ inputs.cache-key-prefix }}"
        echo "cache_key=${PREFIX}-${HASH}" >> "$GITHUB_OUTPUT"
        echo "cache_key=${PREFIX}-${HASH}"
        echo "Submodule cache identity (gitlinks + .gitmodules):"
        printf '%s\n' "$LINKS"

        {
          echo "cache_paths<<EOF"
          echo ".git/modules"
          printf '%s\n' "${PATHS[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    ###########################################################################
    # 3. RESTORE SUBMODULE CACHE
    ###########################################################################
    - name: Restore submodule cache
      if: inputs.submodules != 'false' && steps.meta.outputs.has_submodules == 'true'
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.meta.outputs.cache_paths }}
        key: ${{ steps.meta.outputs.cache_key }}

    ###########################################################################
    # 4. FETCH / SYNC SUBMODULES (retry only transient errors)
    ###########################################################################
    - name: Update submodules
      if: inputs.submodules != 'false' && steps.meta.outputs.has_submodules == 'true'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        token: ${{ inputs.token }}
        MAX_ATTEMPTS: ${{ inputs.submodule-max-attempts }}
        RETRY_BASE: ${{ inputs.submodule-retry-base-seconds }}
      run: |
        set -euo pipefail

        RECURSIVE_FLAG=""
        if [ "${{ inputs.submodules }}" = "recursive" ]; then
          RECURSIVE_FLAG="--recursive"
        fi

        git config --local http.version HTTP/1.1 || true
        git config --local http.lowSpeedLimit 1000 || true
        git config --local http.lowSpeedTime 60 || true
        git config --local http.postBuffer 524288000 || true

        echo "Syncing submodule URLs..."
        # shellcheck disable=SC2086
        git submodule sync $RECURSIVE_FLAG

        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "Submodule cache HIT – forcing consistent working trees"
        else
          echo "Submodule cache MISS – cloning/updating submodules"
        fi

        # Returns 0 if output looks transient (worth retrying)
        is_transient_error() {
          local log="$1"
          # Explicit permanent failures → do not retry
          if echo "$log" | grep -Eiq \
            'returned error: 404|HTTP[[:space:]]*404|Repository not found|not found\.|could not read Username|Authentication failed|Permission denied|returned error: 401|returned error: 403|ERROR: Repository not found|does not exist|invalid pathspec|No url found for submodule'; then
            return 1
          fi
          # Known transient / network flakiness
          if echo "$log" | grep -Eiq \
            'returned error: 502|returned error: 503|returned error: 504|returned error: 429|HTTP[[:space:]]*502|HTTP[[:space:]]*503|HTTP[[:space:]]*504|HTTP[[:space:]]*429|timed out|timeout|Connection timed out|Connection reset|Connection refused|Could not resolve host|Temporary failure|SSL connection|Unable to access|Failed to connect|network is unreachable|empty reply from server|RPC failed|early EOF|expected flush after'; then
            return 0
          fi
          # Unknown: retry once policy — treat as transient to avoid false permanent
          return 0
        }

        attempt=1
        max="${MAX_ATTEMPTS:-5}"
        base="${RETRY_BASE:-20}"
        case "$max" in ''|*[!0-9]*) max=5 ;; esac
        case "$base" in ''|*[!0-9]*) base=20 ;; esac
        if [ "$max" -lt 1 ]; then max=1; fi

        while true; do
          set +e
          # shellcheck disable=SC2086
          out="$(git submodule update --init $RECURSIVE_FLAG --force --jobs 1 2>&1)"
          rc=$?
          set -e

          printf '%s\n' "$out"

          if [ "$rc" -eq 0 ]; then
            echo "Submodule update succeeded (attempt ${attempt}/${max})"
            break
          fi

          if ! is_transient_error "$out"; then
            echo "Permanent submodule error detected – not retrying"
            exit "$rc"
          fi

          if [ "$attempt" -ge "$max" ]; then
            echo "Submodule update failed after ${max} transient attempt(s) (exit ${rc})"
            exit "$rc"
          fi

          sleep_secs=$((base * attempt))
          echo "Transient failure (attempt ${attempt}/${max}, exit ${rc}); retrying in ${sleep_secs}s..."
          sleep "$sleep_secs"
          attempt=$((attempt + 1))

          # shellcheck disable=SC2086
          git submodule sync $RECURSIVE_FLAG || true
        done

        # shellcheck disable=SC2086
        git submodule status $RECURSIVE_FLAG || true

    ###########################################################################
    # 5. SAVE SUBMODULE CACHE (only on miss)
    ###########################################################################
    - name: Save submodule cache
      if: >-
        inputs.submodules != 'false'
        && steps.meta.outputs.has_submodules == 'true'
        && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.meta.outputs.cache_paths }}
        key: ${{ steps.meta.outputs.cache_key }}

    ###########################################################################
    # 6. PRUNE OLD SUBMODULE CACHES
    ###########################################################################
    - name: Prune old submodule caches
      if: >-
        inputs.submodules != 'false'
        && steps.meta.outputs.has_submodules == 'true'
        && steps.cache.outputs.cache-hit != 'true'
        && inputs.prune-old-caches == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PREFIX: ${{ inputs.cache-key-prefix }}
        KEEP_KEY: ${{ steps.meta.outputs.cache_key }}
      run: |
        set -euo pipefail

        if ! command -v gh >/dev/null 2>&1; then
          echo "gh not available – skipping prune"
          exit 0
        fi

        echo "Pruning caches with prefix '${PREFIX}-' except '${KEEP_KEY}'"

        ENTRIES=()
        while IFS= read -r line; do
          [ -n "$line" ] && ENTRIES+=("$line")
        done < <(
          gh cache list --key "${PREFIX}-" --limit 100 \
            --json id,key,sizeInBytes \
            --jq '.[] | "\(.id)\t\(.key)\t\(.sizeInBytes)"' \
            2>/dev/null || true
        )

        if [ ${#ENTRIES[@]} -eq 0 ]; then
          echo "No matching caches to prune"
          exit 0
        fi

        deleted=0
        for entry in "${ENTRIES[@]}"; do
          id="${entry%%	*}"
          rest="${entry#*	}"
          key="${rest%%	*}"
          size="${rest#*	}"

          if [ -z "$id" ] || [ "$key" = "$KEEP_KEY" ]; then
            echo "Keep: $key"
            continue
          fi

          echo "Delete: id=$id key=$key size=${size:-?}B"
          if gh cache delete "$id" 2>/dev/null; then
            deleted=$((deleted + 1))
          else
            echo "  (delete failed – ignored)"
          fi
        done

        echo "Pruned $deleted old cache(s)"